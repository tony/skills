name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.300

      - name: Verify Claude CLI
        run: claude --version

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version-file: .tool-versions

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Type check plugin scripts on Python 3.14
        run: uv run ty check --python-version 3.14 plugins shared

      - name: Tests
        run: uv run pytest -q

      - name: Test plugin scripts on Python 3.14
        run: uv run --no-project --isolated --python 3.14 --with pytest pytest -q plugins

      - name: Marketplace lint
        run: uv run scripts/marketplace.py lint

      - name: Marketplace sync check
        run: uv run scripts/marketplace.py sync --check

      - name: Portable export check
        run: uv run scripts/marketplace.py portable --check

      - name: Skill routing check
        run: uv run scripts/skill_evals.py check

      - name: Commit messages (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/commit_lint.py "$BASE_SHA" "$HEAD_SHA"

      - name: Commit messages (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: scripts/commit_lint.py "$BEFORE_SHA" "$AFTER_SHA"

      - name: Plugin versions (pull request)
        if: github.event_name == 'pull_request'
        # Compare the checked-out merge with its actual base, not a stale event SHA.
        run: uv run scripts/marketplace.py versions --base HEAD^1

      - name: Plugin versions (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: uv run scripts/marketplace.py versions --base "$BEFORE_SHA"

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.300

      - name: Verify Claude CLI
        run: claude --version

      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.162.1

      - name: Verify Codex CLI
        run: codex --version

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version-file: .tool-versions

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: E2E plugin lifecycle (local)
        run: uv run scripts/e2e.py --source local --host both
