schema_version: "1.0"
name: routing-research-to-foray
description: >-
  Researching a topic and keeping its sources is a foray. With both plugins
  loaded, research:foray must win and scholar stay quiet.
tags: [routing]

plugins: ["../../plugins/research", "../../plugins/scholar"]

execution:
  prompt: >-
    Research how SQLite WAL mode decides when readers and writers block each
    other, and keep the sources so I can pick this up next week.
  max_turns: 15
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: foray-wins
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(research:)?foray"'
    arm: both

  - name: scholar-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(scholar:[a-z-]+|ontology|gather|annotate|extract|distill|contest|render|ask|revise|compare)"'
    min: 0
    max: 0
    arm: both

  - name: engages-with-wal-blocking
    type: llm
    criteria: >-
      The reply addresses researching when SQLite WAL readers and writers block
      each other: framing the question, planning sources, or findings. It does
      not claim to have captured sources or created files, since it has no
      shell or write access.
