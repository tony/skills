schema_version: "1.0"
name: routing-glossary-to-ontology
description: >-
  A glossary of what a codebase calls things is an ontology. With both
  plugins loaded, scholar:ontology must win and foray stay quiet.
tags: [routing]

plugins: ["../../plugins/research", "../../plugins/scholar"]

execution:
  prompt: >-
    Build a glossary of what this codebase calls things: the types, the
    preferred terms, and where the names collide.
  max_turns: 15
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: ontology-wins
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(scholar:)?ontology"'
    arm: both

  - name: foray-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(research:)?foray"'
    min: 0
    max: 0
    arm: both

  - name: engages-with-the-glossary
    type: llm
    criteria: >-
      The reply addresses building a glossary or controlled vocabulary of the
      codebase's terms, whether as a plan, a first step, or results, and does
      not start a research topic instead.
