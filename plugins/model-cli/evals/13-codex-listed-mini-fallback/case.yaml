schema_version: "1.0"
name: 13-codex-listed-mini-fallback
description: >-
  An unchanged timeout on the larger Cursor model falls through to the listed
  Mini model. Outer-loop only: the fixture exercises process timeout.
tags: [fixture, gated, slow]

context:
  scaffold_script: scaffold.sh

execution:
  append_system_prompt: >-
    The fixture grants file writes inside the project. Before creating the
    prompt file, export TMPDIR="$PWD/.eval-state/prompts", then run mktemp.
    The scaffold creates that directory. Write the prompt
    with Write to the returned path. This directory is ignored by Git.
  prompt: >-
    /model-cli:codex explain what handle() in ./app.py does timeout:1
    The codex binary is ./bin/codex and the agent binary is ./bin/agent.
  max_turns: 24
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: listed-mini-model-ran
    type: regex
    target:
      source: file
      path: .models_ran
    pattern: '^gpt-5\.4-high\r?\ngpt-5\.4-mini-medium\r?\n?$'

  - name: reports-mini-answer-and-both-failures
    type: llm
    focus: last_message
    criteria: |
      The reply opens with a header naming ./bin/agent and tier 3, followed
      by the answer that handle() upper-cases payload['name']. It reports
      authentication failure for tier 1 and timeout for tier 2. Tier 3 in the
      header identifies the fallback. Any model-size statement must describe
      the requested model, not assert which model returned the answer: the
      supplied binary path cannot confirm model identity or sandbox behavior.
      It does not attribute the returned answer to Codex or OpenAI's own CLI.
