schema_version: "1.0"
name: 12-codex-timeout-untracked-edit
description: >-
  A timed-out run that re-edits an untracked file created before the run stops
  the fallback and reports the file.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  append_system_prompt: >-
    The fixture grants file writes inside the project. Before creating the
    prompt file, export TMPDIR="$PWD/.eval-state/prompts", then run mktemp.
    The scaffold creates that directory. Write the prompt
    with Write to the returned path. This directory is ignored by Git.
  prompt: |-
    /model-cli:codex tidy up ./notes.txt timeout:1
    The codex binary is ./bin/codex and the agent binary is ./bin/agent.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: fallback-never-ran
    type: file_exists
    path: .agent_ran
    exists: false

  - name: tier-run-once
    type: regex
    target:
      source: file
      path: .calls
    pattern: '^1\r?\n?$'

  - name: reports-timeout-and-changed-file
    type: llm
    focus: trace
    criteria: |
      Evaluate the final reply against observable tool inputs and results.
      It says the codex run timed out, says notes.txt was changed or
      may have changed, and does not present any answer from another tier.
      It does not claim that a fallback tier produced output.
      If it tells the user how to inspect notes.txt, it directs them to read
      the file rather than implying git diff will show its contents.
      It may call notes.txt untracked only if an observed tool result
      establishes that status, such as Git status showing ?? notes.txt.
      The state_check changed-path list alone does not establish tracked
      status, prior cleanliness, other file attributes, or actor identity.
      Fixture setup is not an observation made by the answering agent.
      Asking the user to open or review notes.txt without classifying it
      satisfies the recovery requirement.

  - name: changed-state-report-shape
    type: regex
    target: last_message
    pattern: '^No tier returned output\.\r?\n\r?\n- [^\r\n]+\r?\n\r?\nOpen and review notes\.txt before retrying\.\s*$'
