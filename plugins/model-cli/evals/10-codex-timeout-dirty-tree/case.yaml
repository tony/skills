schema_version: "1.0"
name: 10-codex-timeout-dirty-tree
description: >-
  A write-enabled run that times out after editing a file stops the fallback
  and reports the changed file.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  append_system_prompt: >-
    The fixture grants file writes inside the project. Before creating the
    prompt file, export TMPDIR="$PWD/.eval-state/prompts", then run mktemp.
    The scaffold creates that directory. Write the prompt
    with Write to the returned path. This directory is ignored by Git.
  prompt: |-
    /model-cli:codex tidy up ./app.py timeout:1
    The codex binary is ./bin/codex and the agent binary is ./bin/agent.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: fallback-never-ran
    type: file_exists
    path: .agent_ran
    exists: false

  - name: tier-run-once
    type: regex
    target:
      source: file
      path: .calls
    pattern: '^1\r?\n?$'

  - name: reports-timeout-and-changed-file
    type: llm
    focus: last_message
    criteria: |
      The reply says the codex run timed out, says app.py was changed or
      may have changed, and does not present any answer from another tier.
      It does not say a fallback tier ran. It attributes the change to the
      status check's observation, not to Codex or another actor: the check
      proves state changed during the run, not who changed it.

  - name: changed-state-report-shape
    type: regex
    target: last_message
    pattern: '^No tier returned output\.\r?\n\r?\n- [^\r\n]+\r?\n\r?\nOpen and review app\.py before retrying\.\s*$'
