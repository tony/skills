schema_version: "1.0"
name: 05-gpt-regex-check
description: >-
  The gpt alias runs the codex stub and attributes the answer only to the codex tier.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /model-cli:gpt "double check this regex handles unicode edge cases" timeout:90

    ```
    ^[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}$
    ```

    The codex binary is ./bin/codex and the agent binary is ./bin/agent.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: ran-codex
    type: tool_used
    tool: Bash
    input_match: 'bin/codex'
    min: 1
    arm: both

  - name: attributes-to-codex-tier
    type: llm
    focus: last_message
    criteria: |
        The reply opens with a one-line header naming codex and tier 1, then shows the answer the codex CLI returned.
        The reply never claims a non-GPT backend answered.
