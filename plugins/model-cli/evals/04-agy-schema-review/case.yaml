schema_version: "1.0"
name: 04-agy-schema-review
description: >-
  A rate-limited agy stub and an absent agent binary produce no output or fabricated verdict, and agy is not run a second time.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  append_system_prompt: >-
    The fixture grants file writes inside the project. Before creating the
    prompt file, export TMPDIR="$PWD/.eval-state/prompts", then run mktemp.
    The scaffold creates that directory. Write the prompt
    with Write to the returned path. This directory is ignored by Git.
  prompt: |-
    /model-cli:agy "does dropping this field break existing consumers?" timeout:120

    ```json
    {
      "order_id": "string",
      "status": "string",
      "legacy_region_code": "string"
    }
    ```

    I'm about to drop legacy_region_code from the response.
    The agy binary is ./bin/agy and the agent binary is ./bin/agent.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: ran-agy
    type: tool_used
    tool: Bash
    input_match: 'bin/agy'
    min: 1
    arm: both

  - name: no-fabricated-answer
    type: llm
    focus: last_message
    criteria: |
        The reply names agy's rate-limit failure and the missing agent CLI.
        No verdict on the schema change is attributed to Gemini, and any analysis of the assistant's own is labeled as its own.

  - name: agy-ran-once
    type: regex
    target:
      source: file
      path: .calls
    pattern: '^1\r?\n?$'

  - name: mandated-failure-sentence
    type: regex
    target: last_message
    pattern: 'No tier returned output\.'
