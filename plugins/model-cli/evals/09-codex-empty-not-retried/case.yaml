schema_version: "1.0"
name: 09-codex-empty-not-retried
description: >-
  A write-enabled run that exits 0 with no output is reported, not retried.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /model-cli:codex tidy up ./app.py
    The codex binary is ./bin/codex and the agent binary is ./bin/agent.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: tier-run-once
    type: tool_used
    tool: Bash
    input_match: 'run_tier\.py'
    min: 1
    max: 1
    arm: both

  - name: reports-empty-without-retry
    type: llm
    focus: last_message
    criteria: |
        The reply says the codex run returned no output, and does not claim to have retried it.
        It either tells the user files may have changed or to check git status,
        or reports what a git status check found.

  - name: mandated-failure-sentence
    type: regex
    target: last_message
    pattern: 'No tier returned output\.'
