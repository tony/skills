schema_version: "1.0"
name: 05-xfail-stops-after-test-commit
description: >-
  A request for only the failing test commits a test-only xfail, leaves the
  source bug in place, and does not push.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /tdd:xfail is_business_day(5) returns True for Saturday, but Saturday is
    not a business day. I only want the failing test committed; do not fix
    bizdays.py.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: test-file-marked-expected-failure
    type: regex
    target:
      source: file
      path: test_bizdays.py
    pattern: 'expectedFailure[\s\S]*is_business_day\(5\)'

  - name: source-bug-untouched
    type: regex
    target:
      source: file
      path: bizdays.py
    pattern: 'weekday <= 5'

  - name: commits-the-test
    type: tool_used
    tool: Bash
    input_match: 'git (-\w+ \S+ )*commit\b'
    min: 1
    arm: both

  - name: no-attribution-trailer
    type: tool_used
    tool: Bash
    input_match: '[Cc]o-[Aa]uthored-[Bb]y|[Gg]enerated with'
    min: 0
    max: 0
    arm: both

  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git (-\w+ \S+ )*push\b'
    min: 0
    max: 0
    arm: both

  - name: reports-stop-after-test
    type: llm
    focus: last_message
    criteria: |
      The reply says the failing xfail test is committed and the source fix
      was not made (or is left for the user to ask for). It does not claim
      the bug is fixed.
