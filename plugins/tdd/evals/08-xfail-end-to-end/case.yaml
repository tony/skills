schema_version: "1.0"
name: 08-xfail-end-to-end
description: >-
  An approved /tdd:xfail run makes three commits (test only, source only, test
  only), stashes the fix and restores it by stash SHA, leaves a peer's
  pre-existing stash untouched, and does not push.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /tdd:xfail is_business_day(5) returns True for Saturday, but Saturday is
    not a business day. Go ahead with the full workflow: failing test, fix,
    and regression test. Do not push.
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: history-gains-exactly-three-commits
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit \(initial\)[^\n]*\n([^\n]*\n)*?[^\n]*\tcommit: [^\n]*\n([^\n]*\n)*?[^\n]*\tcommit: [^\n]*\n([^\n]*\n)*?[^\n]*\tcommit: [^\n]*\n([^\n]*\n)*$'

  - name: history-has-no-fourth-commit
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '(\tcommit: [^\n]*\n[\s\S]*){4}'
    match: not_contains

  - name: stash-pushed-through-the-script
    type: tool_used
    tool: Bash
    input_match: 'stash_roundtrip\.py\s+push\b'
    min: 1
    arm: both

  - name: stash-restored-by-sha
    type: tool_used
    tool: Bash
    input_match: 'stash_roundtrip\.py\s+restore\s+[0-9a-f]{40}\b'
    min: 1
    arm: both

  - name: never-pops-drops-or-clears-by-hand
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-\w+ \S+ )*stash\s+(pop|drop|clear)\b'
    min: 0
    max: 0
    arm: both

  - name: peer-stash-survives
    type: regex
    target:
      source: file
      path: .git/logs/refs/stash
    pattern: 'On main: peer work\n$'

  - name: own-stash-is-gone
    type: regex
    target:
      source: file
      path: .git/logs/refs/stash
    pattern: 'tdd-xfail-'
    match: not_contains

  - name: stages-source-file-alone-for-the-fix
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-\w+ \S+ )*(add|commit)\b(?![^;&|\n]*test_bizdays)[^;&|\n]*(?<!\w)bizdays\.py'
    min: 1
    arm: both

  - name: never-stages-everything
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-\w+ \S+ )*add\b[^;&|\\"]*(\s-[a-zA-Z]*A|\s--all|\s-u|\s\.(\s|$|;|&))|git(?:\s+-[Cc]\s*\S+)*\s+(-\w+ \S+ )*commit\b[^;&|\\"]*\s-[a-zA-Z]*a'
    min: 0
    max: 0
    arm: both

  - name: source-bug-fixed
    type: regex
    target:
      source: file
      path: bizdays.py
    pattern: 'weekday\s*(<\s*5|<=\s*4)'

  - name: regression-test-kept-and-unmarked
    type: regex
    target:
      source: file
      path: test_bizdays.py
    pattern: 'expectedFailure|skip\('
    match: not_contains

  - name: regression-test-covers-saturday
    type: regex
    target:
      source: file
      path: test_bizdays.py
    pattern: 'is_business_day\(5\)'

  - name: no-attribution-trailer
    type: tool_used
    tool: Bash
    input_match: '[Cc]o-[Aa]uthored-[Bb]y|[Gg]enerated with'
    min: 0
    max: 0
    arm: both

  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-\w+ \S+ )*push\b'
    min: 0
    max: 0
    arm: both

  - name: reports-three-commits-and-stash-proof
    type: llm
    focus: last_message
    criteria: |
      The reply says the bug is fixed and lists three commits (failing test,
      fix, xfail removal). It mentions that with the fix stashed the test
      went back to its expected-failure state. It does not claim anything was
      pushed.
