schema_version: "1.0"
name: 01-xfail-is-business-day-bug
description: >-
  A request to prove a bug with a failing test before touching the code
  routes to the xfail skill, which commits the test alone and leaves the
  source bug in place.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    write a failing test that proves this bug before we touch the code.

    Bug report: `is_business_day(5)` returns `True` for Saturday, but
    Saturday should not count as a business day. The function is in
    bizdays.py.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(tdd:)?xfail"'
    min: 1

  - name: source-bug-untouched
    type: regex
    target:
      source: file
      path: bizdays.py
    pattern: 'weekday <= 5'

  - name: test-uses-strict-expected-failure
    type: regex
    target:
      source: file
      path: test_bizdays.py
    pattern: 'expectedFailure[\s\S]*is_business_day\(5\)'

  - name: xfail-contract
    type: llm
    focus: last_message
    criteria: |
      The reply identifies the root cause as the `<= 5` comparison including
      Saturday as a business day. It says the failing test is committed and
      the fix is not made, and it describes how the failure was confirmed to
      come from the bug.
