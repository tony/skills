schema_version: "1.0"
name: 07-fix-end-to-end
description: >-
  An approved /tdd:fix run makes three commits in order (test only, source
  only, test only), leaves a passing regression test, and does not push.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /tdd:fix is_business_day(5) returns True for Saturday, but Saturday is
    not a business day. Go ahead with the full workflow: failing test, fix,
    and regression test. Do not push.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: history-gains-exactly-three-commits
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit \(initial\): [^\n]*\n([^\n]*\tcommit: [^\n]*\n){3}$'

  - name: stages-source-file-alone-for-the-fix
    type: tool_used
    tool: Bash
    input_match: 'git (-\w+ \S+ )*(add|commit)\b(?![^;&|\n]*test_bizdays)[^;&|\n]*(?<!\w)bizdays\.py'
    min: 1
    arm: both

  - name: never-stages-everything
    type: tool_used
    tool: Bash
    input_match: 'git (-\w+ \S+ )*add\b[^;&|\\"]*(\s-[a-zA-Z]*A|\s--all|\s-u|\s\.(\s|$|;|&))|git (-\w+ \S+ )*commit\b[^;&|\\"]*\s-[a-zA-Z]*a'
    min: 0
    max: 0
    arm: both

  - name: source-bug-fixed
    type: regex
    target:
      source: file
      path: bizdays.py
    pattern: 'weekday\s*(<\s*5|<=\s*4)'

  - name: regression-test-kept-and-unmarked
    type: regex
    target:
      source: file
      path: test_bizdays.py
    pattern: 'expectedFailure|skip\('
    match: not_contains

  - name: regression-test-covers-saturday
    type: regex
    target:
      source: file
      path: test_bizdays.py
    pattern: 'is_business_day\(5\)'

  - name: no-attribution-trailer
    type: tool_used
    tool: Bash
    input_match: '[Cc]o-[Aa]uthored-[Bb]y|[Gg]enerated with'
    min: 0
    max: 0
    arm: both

  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git (-\w+ \S+ )*push\b'
    min: 0
    max: 0
    arm: both

  - name: reports-three-commits
    type: llm
    focus: last_message
    criteria: |
      The reply says the bug is fixed and lists three commits (failing test,
      fix, xfail removal). It does not claim anything was pushed.

  - name: middle-commit-is-source-only
    type: llm
    focus: last_message
    criteria: |
      The reply does not say the fix commit touched test_bizdays.py; the fix
      commit changes only bizdays.py.
