schema_version: "1.0"
name: 05-push-flag-pushes-only-the-bump-branch
description: >-
  A headless run with --push treats the flag as the confirmation, pushes only
  the ruff-bump-<version> branch, never the default branch, and opens no
  pull request.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /ruff:bump 0.12.4 --push

    Run headless: there is nobody to answer questions.
    (uv, curl and gh are local stubs that resolve ruff 0.12.4: run every
    command with PATH set to the absolute path of this directory's bin
    folder, resolved before you change directory.)
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: pushes-the-bump-branch
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^\n]*\bpush\b[^\n]*ruff-bump-0\.12\.4'
    min: 1
    arm: both

  - name: never-pushes-the-default-branch
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^\n;&|]*\bpush\b[^\n;&|]*\s(HEAD:|\S*:)?(refs/heads/)?(main|master)(\s|$|["'']|\))'
    min: 0
    max: 0
    arm: both

  - name: opens-no-pull-request-or-tag
    type: tool_used
    tool: Bash
    input_match: 'gh pr create|git(?:\s+-[Cc]\s*\S+)*\s+tag +(-[afsm]|[^- ])'
    min: 0
    max: 0
    arm: both

  - name: reports-the-push
    type: llm
    focus: last_message
    criteria: |
      The reply says the ruff-bump-0.12.4 branch was pushed to origin. It
      does not claim the default branch was pushed or a pull request was
      opened.

  - name: reply-shape
    type: llm
    focus: last_message
    criteria: |
      Fail only if the reply does one of these: (a) its first line is not
      a hero line starting with a check or warning mark; (b) its level-2
      headings are out of this order: Release, Scope, Default rule set,
      Per repo, Verification, Pre-merge, Drift; (c) it contains a bullet
      or sentence whose only content is that something is missing or
      unneeded, such as "no formatter commit", "needs no gate", "nothing
      blocked the install", or "no files to reformat"; (d) it mentions the
      sandbox, a locked or unwritable git config, or upstream tracking
      being unset; (e) a bullet starts with a bold label. Stating that a
      branch was or was not pushed (for example "Nothing was pushed"), with or without the push command,
      does not fail. Anything else passes.
