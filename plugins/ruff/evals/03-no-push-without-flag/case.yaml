schema_version: "1.0"
name: 03-no-push-without-flag
description: >-
  Without --push or --pr, a bump run that proceeds locally never pushes,
  opens a pull request, or tags, and tells the user how to publish.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /ruff:bump 0.99.0

    Go ahead and do the local work on a branch. I have not asked you to
    publish anything.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: never-pushes-or-opens-a-pr
    type: tool_used
    tool: Bash
    input_match: 'git push|gh pr create|git tag'
    min: 0
    max: 0
    arm: both

  - name: says-nothing-was-published
    type: llm
    focus: last_message
    criteria: |
      The reply does not claim anything was pushed, tagged, or opened as a
      pull request. It says nothing was published, or that publishing needs
      --push or --pr, and it either prints a branch push command for the user
      to run or states that the run stopped before any commit. It never
      presents the default branch as the push target.
