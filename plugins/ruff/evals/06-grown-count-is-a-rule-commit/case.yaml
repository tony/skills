schema_version: "1.0"
name: 06-grown-count-is-a-rule-commit
description: >-
  A rule the previous version already reported, now firing in more places on
  the target version, gets its own commit for the increase; a rule whose
  count did not change is left alone.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /ruff:bump 0.12.4

    Go ahead and do the local work on a branch. I have not asked you to
    publish anything.
    (uv, curl and gh are local stubs that resolve ruff 0.12.4: run every
    command with PATH set to the absolute path of this directory's bin
    folder, resolved before you change directory.)
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: commits-made
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^\n]*\bcommit\b'
    min: 2
    arm: both

  - name: commits-the-f401-rule
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^\n]*\bcommit\b[\s\S]*F401'
    min: 1
    arm: both

  - name: leaves-e711-alone
    type: tool_used
    tool: Bash
    input_match: 'check[^\n]*--select[ =]E711'
    min: 0
    max: 0
    arm: both

  - name: grown-rule-gets-its-own-commit
    type: llm
    focus: last_message
    criteria: |
      The reply reports a commit that raises the ruff floor and a separate
      commit for F401, even though the previous version already reported one
      F401 finding, because 0.12.4 reports two. It does not describe the F401
      increase as pre-existing. It does not report a commit that fixes E711:
      E711 fires once on both versions and is left alone or named as
      pre-existing.
