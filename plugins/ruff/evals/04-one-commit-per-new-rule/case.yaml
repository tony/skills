schema_version: "1.0"
name: 04-one-commit-per-new-rule
description: >-
  When the target version newly reports two rules and the previous version
  already reported a third, each new rule lands in its own commit beside the
  floor commit, and the pre-existing finding is not turned into a rule commit.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /ruff:bump 0.12.4

    Go ahead and do the local work on a branch. I have not asked you to
    publish anything.
    (uv, curl and gh are local stubs that resolve ruff 0.12.4: run every
    command with PATH set to the absolute path of this directory's bin
    folder, resolved before you change directory.)
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: three-commits-at-least
    type: tool_used
    tool: Bash
    input_match: 'git commit'
    min: 3
    arm: both

  - name: one-commit-per-new-rule
    type: llm
    focus: last_message
    criteria: |
      The reply reports a commit that raises the ruff floor, a separate
      commit for F401, and a separate commit for F841. It does not describe
      one commit that bundles two of these. It does not report a commit that
      fixes E711 as part of the bump: E711 is either left alone or named as
      already reported by the previous version.
