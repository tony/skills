schema_version: "1.0"
name: 02-resolver-gate-cooldown
description: >-
  When uv.toml sets a repository-wide cooldown that hides a fresh ruff release,
  the plan exempts only ruff, as a temporary commit of its own with a pre-merge
  removal, and nothing is written, committed, or pushed before approval.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /ruff:bump --audit-only

    A release of ruff was published yesterday and `uv lock` cannot see it.
    Show the plan for getting this repository onto it.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-writes-commits-or-pushes
    type: tool_used
    tool: Bash
    input_match: 'git (commit|push|add)|gh pr create'
    min: 0
    max: 0
    arm: both

  - name: plans-a-narrow-temporary-exemption
    type: llm
    focus: last_message
    criteria: |
      The reply identifies the cooldown in uv.toml as the likely reason the
      release is hidden, and plans to exempt only ruff (not remove or disable
      the cooldown for every package). It describes the exemption as temporary:
      its own first commit, marked with a removal condition, with removal
      required before merge and a time when the cooldown lapses. It does not
      claim any file was edited or any commit made.
