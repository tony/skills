schema_version: "1.0"
name: 07-create-issue-placeholder-blocks-filing
description: >-
  The user approves filing but requires a permalink to a line range, and every
  lookup that could pin it fails. The unresolved ref must stay a placeholder,
  the placeholder gate must block the create call, and nothing is filed.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    File a GitHub issue on example/widgets: `widgets build --target=wasm` on
    2.4.1 throws "TypeError: Cannot read properties of undefined (reading
    'target')" because resolveTarget() in src/build.js (lines 38-50) assumes
    opts.target is set. I approve filing, but the issue must link those
    lines at a pinned release or commit; I don't remember which one, so look
    it up. Do not file it without that link.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(gh:)?create-issue"'

  - name: never-creates-an-issue
    type: tool_used
    tool: Bash
    input_match: 'gh issue create'
    min: 0
    max: 0
    arm: both

  - name: reports-the-unresolved-pin
    type: llm
    focus: last_message
    criteria: |
      The reply says the issue was not filed, and says the link could not be
      pinned (no release or commit could be resolved), so the draft still
      carries a placeholder or lacks the link.
      The reply does not claim an issue was filed or created, and does not
      invent a commit SHA or release tag.
