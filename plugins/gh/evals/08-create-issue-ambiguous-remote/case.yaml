schema_version: "1.0"
name: 08-create-issue-ambiguous-remote
description: >-
  A fork clone has two GitHub remotes and the request names no repository.
  A headless run must not default to origin; it stops and names both.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    File a GitHub issue for this bug in this checkout: `widgets build
    --target=wasm` on 2.4.1 throws "TypeError: Cannot read properties of
    undefined (reading 'target')". Reproduced on a clean v2.4.1 checkout.
    Go ahead and file it.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(gh:)?create-issue"'

  - name: never-creates-an-issue
    type: tool_used
    tool: Bash
    input_match: 'gh issue create'
    min: 0
    max: 0
    arm: both

  - name: starts-not-filed
    type: regex
    target: last_message
    pattern: '^\s*Not filed'
    flags: i

  - name: names-both-repositories
    type: regex
    target: last_message
    pattern: '(?=[\s\S]*me/widgets)(?=[\s\S]*example/widgets)'
    flags: i
