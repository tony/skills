schema_version: "1.0"
name: 05-create-issue-duplicate-found
description: >-
  The duplicate search returns an open issue that matches the bug. The skill
  stops, names the duplicate, offers to comment, and never creates an issue.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    File a GitHub issue on example/widgets: `widgets build --target=wasm` on
    2.4.1 throws "TypeError: Cannot read properties of undefined (reading
    'target')" because resolveTarget() assumes opts.target is set. Reproduced
    on a clean v2.4.1 checkout. Go ahead and file it.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(gh:)?create-issue"'

  - name: searches-for-duplicates
    type: tool_used
    tool: Bash
    input_match: 'gh (issue list|search issues)'

  - name: never-creates-an-issue
    type: tool_used
    tool: Bash
    input_match: 'gh issue create'
    min: 0
    max: 0
    arm: both

  - name: stops-on-the-duplicate
    type: llm
    focus: last_message
    criteria: |
      The reply says an existing issue (#17) already covers this bug and that
      nothing was filed.
      The reply offers to comment on #17 with the new evidence, or asks the
      user how to proceed; it does not claim a new issue was created.
