schema_version: "1.0"
name: 09-create-issue-template-ambiguous
description: >-
  The repository has two issue forms and neither fits a defect report. A headless run must not pick one silently; it stops and names them.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    File a GitHub issue on example/widgets: `widgets build --target=wasm` on
    2.4.1 throws "TypeError: Cannot read properties of undefined (reading
    'target')" because resolveTarget() assumes opts.target is set. Reproduced
    on a clean v2.4.1 checkout with Node 20. Go ahead and file it.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(gh:)?create-issue"'

  - name: never-creates-an-issue
    type: tool_used
    tool: Bash
    input_match: 'gh issue create'
    min: 0
    max: 0
    arm: both

  - name: starts-not-filed
    type: regex
    target: last_message
    pattern: '^\s*Not filed'
    flags: i

  - name: names-both-templates
    type: regex
    target: last_message
    pattern: '(?=[\s\S]*question)(?=[\s\S]*documentation)'
    flags: i
