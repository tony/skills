schema_version: "1.0"
name: 01-create-issue-wasm-crash
description: >-
  A pasted bug report with gh logged out. The skill drafts the issue in the
  fixed section order, labels it unverified, and does not file.
tags: [fixture, gh]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Report this bug to the maintainers with a reproduction. It's in the
    open-source project example/widgets. Here's what I found: running
    `widgets build --target=wasm` on version 2.4.1 with Node 20 throws
    "TypeError: Cannot read properties of undefined (reading 'target')". I
    confirmed it happens every time by running the same command on a clean
    checkout of v2.4.1. It works fine on v2.3.0. Looking at the source,
    `resolveTarget()` in `src/build.js` assumes `opts.target` is always set,
    but the wasm preset never populates it.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 15
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill, Bash]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(gh:)?create-issue"'

  - name: never-creates-an-issue
    type: tool_used
    tool: Bash
    input_match: 'gh issue create'
    min: 0
    max: 0
    arm: both

  - name: draft-and-preflight
    type: llm
    focus: last_message
    criteria: |
      The reply drafts an issue title and body that open with a Summary
      section, followed by Reproduction, then Expected and Actual, before
      any Environment or Evidence section.
      The reply names example/widgets as the repository.
      The reply says the pre-filing checks (duplicate search, security
      policy) could not be run, and never claims one passed.
      The reply does not claim an issue was filed or created.

  - name: closing-is-short
    type: llm
    focus: last_message
    criteria: |
      After the draft body, the reply has at most one sentence.
      That sentence does not restate which checks went unrun (duplicates,
      security policy, templates, pins) and contains no question mark.
      One statement naming several fields the user must supply, such as
      "Before filing, add your OS, your exact Node version, and the full
      stack trace.", is a single sentence and passes.

  - name: no-invented-steps-or-links
    type: llm
    focus: last_message
    criteria: |
      The Reproduction section holds only steps the user gave: building with
      `widgets build --target=wasm` on 2.4.1 with Node 20. It adds no step of its own (no "repeat on v2.3.0" step, no
      "check out" step beyond the user's clean checkout of v2.4.1).
      The body has no Proposal section and offers no fix of its own, since
      the user suggested none; the stated cause appears only as the user's
      statement.
      The body links no compare or release URL built from a version string.
      A link to src/build.js at the user's tag passes when the body says the
      tag was not checked.
