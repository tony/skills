schema_version: "1.0"
name: 11-create-issue-repro-script-shown
description: >-
  The reproduction runs a script the user pasted. The drafted body shows the
  script, not only the command line that invokes it.
tags: [fixture, gh]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Report this bug to the maintainers of the open-source project
    example/widgets. Running `node repro.js` on widgets 2.4.1 with Node 20
    prints "RangeError: Invalid array length". The whole of repro.js is:

    const widgets = require('widgets');
    widgets.pack([], { size: -1 });

    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 15
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill, Bash]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(gh:)?create-issue"'

  - name: never-creates-an-issue
    type: tool_used
    tool: Bash
    input_match: 'gh issue create'
    min: 0
    max: 0
    arm: both

  - name: body-shows-the-script
    type: regex
    target: last_message
    pattern: 'widgets\.pack\(\s*\[\s*\]\s*,\s*\{\s*size:\s*-1'
    flags: i

  - name: body-keeps-the-command
    type: regex
    target: last_message
    pattern: 'node repro\.js'
    flags: i
