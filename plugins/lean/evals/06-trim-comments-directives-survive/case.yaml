schema_version: "1.0"
name: 06-trim-comments-directives-survive
description: >-
  Tool directives and sole docstrings survive a trim of pasted code.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Trim the fat comments in this, it is too chatty:

    ```python
    # -*- coding: utf-8 -*-
    import os


    def load(path):
        """Load the file."""
        # open the file and read it
        data = open(path).read()  # noqa: SIM115
        return data


    class NotFound(Exception):
        """Raised when the requested record does not exist in the store, which happens often."""


    def parse(raw):
        # This function parses the raw value into an int by calling int on it
        return int(raw)  # type: ignore[arg-type]
    ```
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, AskUserQuestion, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(lean:)?trim-comments"'

  - name: verdicts
    type: llm
    focus: last_message
    criteria: |
      The reply's trimmed code still contains the `# -*- coding: utf-8 -*-` line, the `# noqa: SIM115` directive, and the `# type: ignore[arg-type]` directive, each present in the output.
      The `NotFound` class keeps a docstring (original or shortened) so its body is not empty; the reply never deletes it outright.
      The narration comments ("open the file and read it", "This function parses the raw value...") are flagged for deletion or rewrite.
