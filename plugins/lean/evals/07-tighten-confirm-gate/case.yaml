schema_version: "1.0"
name: 07-tighten-confirm-gate
description: >-
  A bare tighten request on a named file proposes edits and writes nothing
  before confirmation.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /lean:tighten NOTES.md
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Edit, AskUserQuestion, Skill]

runs: 3

graders:
  - name: no-edit-before-confirm
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both

  - name: proposes-not-applies
    type: llm
    focus: last_message
    criteria: |
      The reply proposes tightening edits to NOTES.md, or asks for
      confirmation before changing it, and does not claim the file was
      already rewritten. It does not commit anything.
      When it proposes edits, it shows them as a diff block of the
      changed lines, not only a count of findings.
