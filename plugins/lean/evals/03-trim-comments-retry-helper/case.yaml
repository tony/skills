schema_version: "1.0"
name: 03-trim-comments-retry-helper
description: >-
  Pasted retry helper gets one verdict per comment, keeps included.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    These comments are too fat, trim them:

    ```python
    def fetch_with_retry(url):
        # This function fetches a URL with retries and returns the response
        MAX_RETRIES = 3  # retries up to 3 times
        for attempt in range(MAX_RETRIES):
            # try to make the request
            try:
                return requests.get(url, timeout=5)
            except requests.ConnectionError:
                # Windows CI runners see a cold DNS cache on the first call; the
                # extra attempt below absorbs it. Do not lower this without
                # testing on the windows-latest runner.
                continue
        raise TimeoutError("exhausted retries")
    ```
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, AskUserQuestion, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(lean:)?trim-comments"'

  - name: verdicts
    type: llm
    focus: last_message
    criteria: |
      The reply gives each of the four comments an explicit verdict such as keep, rewrite, or delete, keeps included, rather than just handing back rewritten code.
      The comment restating what the function does ("fetches a URL with retries and returns the response") and the duplicated retry-count comment ("retries up to 3 times") are flagged for removal or rewrite.
      The comment about Windows CI runners needing the extra retry attempt for a cold DNS cache is kept or shortened to two lines, and its constraint (do not lower the count without testing on the windows-latest runner) survives.
      The reply does not claim to have edited any file (printing the trimmed code and past-tense verdict labels such as "Deleted" or "Rewrote" are not edit claims), and its verdict counts add up to the four comments.
