schema_version: "1.0"
name: 18-ontology-full-pipeline
description: >-
  Ontology runs every stage on a tiny pinned checkout and ends with a brief
  that passes the citation gate and a single final report.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /scholar:ontology --out=notes/ontology/tiny-lib/ The corpus is the
    checkout in ./tiny-lib. I approve the plan. Run every stage through
    render. Record the final brief check with ./verify-brief.sh followed by
    the analyzer's absolute path. Do not ask me anything.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: writes-the-term-table
    type: file_exists
    path: notes/ontology/tiny-lib/terms.jsonl

  - name: writes-the-brief
    type: file_exists
    path: notes/ontology/tiny-lib/brief.md

  - name: runs-the-brief-gate
    type: tool_used
    tool: Bash
    input_match: 'check-brief|verify-brief\.sh'
    min: 1

  - name: brief-gate-passes
    type: regex
    target:
      source: file
      path: .eval-state/brief-gate.exit
    pattern: '^0\s*$'

  - name: reports-the-gate-result
    type: llm
    focus: last_message
    criteria: |
      The reply says the brief's citation check passed. It may group it
      with the other successful checks and need not quote an exit code.
      A reply reporting a failed brief check or omitting its outcome fails.

  - name: reports-once
    type: llm
    focus: last_message
    criteria: |
      The reply is a single final report that opens with a hero line and
      covers the corpus, the ontology, what was contested, and where the
      study lives. It does not repeat a separate report per stage.

  - name: brief-claims-follow-the-source
    type: llm
    focus:
      source: file
      path: notes/ontology/tiny-lib/brief.md
    criteria: |
      The corpus contains only three class declarations with docstrings:
      PortAdapter wraps a third-party client behind the port interface;
      EventBus publishes domain events to subscribed handlers; EventHandler
      receives one domain event and acts on it. There are no method bodies
      or usage examples. The brief may describe these stated roles, not
      claim tested implementation behavior. It must not infer an
      architectural pattern, exclusive roles, or disjoint types from those
      names alone. Claims that the adapter never touches events, callers
      never meet the client, or the bus never acts on events are unsupported
      and fail, including equivalent wording. Unsupported hypotheses belong
      in contested evidence, not in the brief as established conclusions.

  - name: report-does-not-add-unsupported-claims
    type: llm
    focus: last_message
    criteria: |
      The report limits factual behavior claims to the corpus's docstrings:
      wrapping a third-party client, publishing domain events to subscribed
      handlers, and receiving and acting on one domain event. The empty
      classes do not establish exclusive roles, a hexagonal architecture,
      or that callers never meet the client. It may report those hypotheses
      as unsupported, rejected, or open, but not as established conclusions.

  - name: never-writes-into-the-corpus
    type: tool_used
    tool: Write
    input_match: 'file_path\W+[^"]*tiny-lib/src'
    min: 0
    max: 0
    arm: both
