schema_version: "1.0"
name: 17-distill-planted-cycle-orphan
description: >-
  Distill runs the orphan gate on a table with a planted parent cycle and a
  parentless term, reports both, and does not invent a type to house the orphan.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /scholar:distill --out=notes/ontology/sample-lib/ The study is
    notes/ontology/sample-lib/ and terms.jsonl is already extracted. Run the
    orphan gate and report what it finds. Do not ask me anything.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: runs-the-analyzer
    type: tool_used
    tool: Bash
    input_match: 'term_metrics\.py'
    min: 1

  - name: reports-the-cycle
    type: llm
    focus: last_message
    criteria: |
      The reply reports that stage and phase are each other's parent (a
      hierarchy cycle) as a finding, and does not claim the hierarchy is clean.

  - name: invents-no-type-beyond-role
    type: regex
    target:
      source: file
      path: notes/ontology/sample-lib/terms.jsonl
    pattern: '^(?![\s\S]*(?<=\n|^)(?![^\n]*"term":\s*"role")[^\n]*"kind":\s*"type")'

  - name: reports-the-orphan
    type: regex
    target: last_message
    pattern: '(?:orphan[^\n]*checkpoint|checkpoint[^\n]*(?:orphan|no parent))'
    flags: i

  - name: preserves-the-extracted-terms
    type: regex
    target:
      source: file
      path: notes/ontology/sample-lib/terms.jsonl
    pattern: '^\{"schema":1,"term":"role",[^\n]*"kind":"type","parent":"root"\}\n\{"schema":1,"term":"stage",[^\n]*"parent":"phase",[^\n]*\}\n\{"schema":1,"term":"phase",[^\n]*"parent":"stage",[^\n]*\}\n\{"schema":1,"term":"checkpoint",[^\n]*"parent":"",[^\n]*\}\n?$'

