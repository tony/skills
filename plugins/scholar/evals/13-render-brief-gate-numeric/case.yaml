schema_version: "1.0"
name: 13-render-brief-gate-numeric
description: >-
  A brief carrying a URL and bare numbers fails the render gate; the skill
  reports the findings and does not claim the study rendered.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /scholar:render --out=notes/ontology/sample-lib/ I wrote brief.md by hand
    and want it kept exactly as is. Run the brief gate on it and tell me where
    it stands.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: brief-left-untouched
    type: regex
    target:
      source: file
      path: notes/ontology/sample-lib/brief.md
    pattern: 'https://github\.com/example/sample-lib/blob/v1\.0\.0/src/ports\.py#L12[\s\S]*0\.62'

  - name: reports-gate-failure
    type: llm
    focus: last_message
    criteria: |
      The reply reports that the brief gate failed and names the offending
      content: the URL and the bare numbers. It does not say the study
      rendered successfully, does not claim the brief passes, and does not
      propose loosening the checker to make the brief pass.
