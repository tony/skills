schema_version: "1.0"
name: 14-extract-writes-rows
description: >-
  Extract harvests terms from a pinned corpus checkout on disk, writes rows
  to terms.jsonl, runs the term gate, and leaves the corpus untouched.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /scholar:extract --out=notes/ontology/tiny-lib/ The corpus is the
    checkout in ./tiny-lib, already pinned in sources.jsonl. Harvest its terms
    and write terms.jsonl.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: writes-the-term-table
    type: file_exists
    path: notes/ontology/tiny-lib/terms.jsonl

  - name: harvests-a-class-name
    type: regex
    target:
      source: file
      path: notes/ontology/tiny-lib/terms.jsonl
    pattern: '"term":\s*"(PortAdapter|EventBus|EventHandler)"'

  - name: rows-carry-a-quote
    type: regex
    target:
      source: file
      path: notes/ontology/tiny-lib/terms.jsonl
    pattern: '"quote":\s*"[^"]+'

  - name: runs-the-term-gate
    type: tool_used
    tool: Bash
    input_match: 'check-terms'
    min: 1

  - name: never-writes-into-the-corpus
    type: tool_used
    tool: Write
    input_match: 'tiny-lib/src'
    min: 0
    max: 0
    arm: both
