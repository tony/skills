schema_version: "1.0"
name: 25-compare-two-studies
description: >-
  Compare reports the planted mapping, collision and one-sided coverage from
  two term tables, writes only the requested third document, and leaves both
  studies as they were.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /scholar:compare notes/ontology/alpha/ notes/ontology/beta/
    --out=notes/ontology/alpha-vs-beta.md
    Both studies are distilled. Do not ask me anything.
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Write, Skill]

runs: 3

graders:
  - name: writes-the-comparison-document
    type: file_exists
    path: notes/ontology/alpha-vs-beta.md

  - name: leaves-both-term-tables-alone
    type: tool_used
    tool: Write
    input_match: 'file_path\W+[^"]*ontology/(alpha|beta)/'
    min: 0
    max: 0

  - name: document-sections-carry-the-planted-findings
    type: regex
    target:
      source: file
      path: notes/ontology/alpha-vs-beta.md
    pattern: '## Mappings(?:(?!\n## )[\s\S])*adapter(?:(?!\n## )[\s\S])*connector[\s\S]*\n## Collisions(?:(?!\n## )[\s\S])*\bbus\b[\s\S]*\n## Coverage(?:(?!\n## )[\s\S])*retry(?:(?!\n## )[\s\S])*cache'

  - name: document-adds-no-mechanism-the-definitions-lack
    type: regex
    target:
      source: file
      path: notes/ontology/alpha-vs-beta.md
    pattern: '^(?![\s\S]*([Dd]ispatcher|pub/?sub|\bIPC\b|[Tt]ransport|mutex|would live))'

  - name: fixed-final-report
    type: regex
    target: last_message
    pattern: '^✓ \d+ mappings?, \d+ collisions?, \d+ uncovered\n\n## Mappings(?=\n)(?:(?!\n## )[\s\S])*\n## Collisions(?=\n)(?:(?!\n## )[\s\S])*\n## Coverage(?=\n)'

  - name: reply-counts-match-the-planted-findings
    type: llm
    focus: last_message
    criteria: |
      The reply reports one mapping (adapter and connector), one collision
      (bus) and the two one-sided terms (retry, cache) as uncovered. Counts
      in the hero are counts of findings, not scores. It states no
      similarity number. It ends with plain options such as studying the
      uncovered area or stopping, without running one.
