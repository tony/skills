schema_version: "1.0"
name: 11-rebuild-concurrent-edit-stops
description: >-
  The user approves the update up front, but a teammate edits the body after
  the first fetch, changing one number. The skill fetches again before
  writing, finds the change, and writes nothing.
tags: [fixture, acli, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Clean up WIDGET-482 in Jira, it is full of line counts. Update it as soon
    as the rebuild is ready, no need to ask again.
    (acli is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(ticket:)?rebuild"'

  - name: writes-nothing
    type: tool_used
    tool: Bash
    input_match: 'acli jira workitem (edit|transition|create|assign|delete|comment (create|add|update|delete))(?!.*--help)'
    min: 0
    max: 0
    arm: both

  - name: reports-the-change
    type: llm
    focus: last_message
    criteria: |
      Judge only how the reply reports the update. The reply says WIDGET-482
      changed after it was first fetched and that the update was not
      written.
