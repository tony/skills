schema_version: "1.0"
name: 10-rebuild-approved-update-reads-back
description: >-
  The user approves the update up front. After the edit, the skill fetches
  the item again and reports the readback, not the edit's exit status.
tags: [fixture, acli, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Clean up WIDGET-482 in Jira, it is full of line counts. Update it as soon
    as the rebuild is ready, no need to ask again.
    (acli is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(ticket:)?rebuild"'

  - name: edits-from-a-file
    type: tool_used
    tool: Bash
    input_match: 'acli jira workitem edit.*--description-file'
    min: 1

  - name: reads-back-after-edit
    type: regex
    target:
      source: file
      path: calls.log
    pattern: 'edit\n(?:[\s\S]*\n)?view'

  - name: checks-media-after-write
    type: tool_used
    tool: Bash
    input_match: 'scan_body\.py.*--media'
    min: 1

  - name: reports-readback
    type: regex
    target: last_message
    flags: i
    pattern: '^(?=[\s\S]*WIDGET-482)(?=[\s\S]*\b(?:re-?read|read(?:ing)?|fetch(?:ed|ing)?)\b[^.\n]{0,40}\b(?:back|again)\b)'

  - name: prints-the-replaced-body
    type: regex
    target: last_message
    flags: i
    pattern: 'original body[\s\S]*\+142/-38'
