schema_version: "1.0"
name: 12-draft-related-item-links
description: >-
  The tracker holds an open issue about a different problem in the same
  feature. The skill drafts the new issue and links the related one under
  References instead of halting.
tags: [fixture, glab]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Open a GitLab issue for this bug: the CSV export drops the last row when
    the file has more than 10000 rows. Seen on widgets 2.4.1.
    (glab is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(ticket:)?draft"'

  - name: never-writes
    type: tool_used
    tool: Bash
    input_match: 'glab issue (create|update|note)(?!.*--help)|glab api.*(-X|--method) (POST|PUT|PATCH)'
    min: 0
    max: 0
    arm: both

  - name: drafts-and-links-the-related-issue
    type: regex
    target: last_message
    flags: i
    pattern: '^(?!\s*Halted)(?=[\s\S]*## Title)(?=[\s\S]*#5\b)'
