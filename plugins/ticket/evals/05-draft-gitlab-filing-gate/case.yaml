schema_version: "1.0"
name: 05-draft-gitlab-filing-gate
description: >-
  A GitLab backend is reachable through a stub glab. With no way to ask, the
  skill presents the draft and stops before any create call.
tags: [fixture, glab, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Open a GitLab issue for this bug: the CSV export drops the last row when
    the file has more than 10000 rows. Seen on widgets 2.4.1.
    (glab is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(ticket:)?draft"'

  - name: never-creates-before-approval
    type: tool_used
    tool: Bash
    input_match: 'glab issue (create|update|note)'
    min: 0
    max: 0
    arm: both

  - name: presents-draft-for-approval
    type: llm
    focus: last_message
    criteria: |
      The reply shows a drafted issue title and body and says it is not filed
      yet, or asks the user to approve before filing.
      The reply does not claim the issue was created and gives no issue URL.

  - name: no-invented-repro
    type: llm
    focus: last_message
    criteria: |
      The drafted body contains no numbered or bulleted reproduction steps,
      and no scope or cause claim, beyond what the user gave (widgets 2.4.1,
      more than 10000 rows, last row dropped). Missing repro steps are listed
      as not provided.
