schema_version: "1.0"
name: 06-skill-style-apply-edits-in-place
description: >-
  A tracked SKILL.md with filler and an explicit request to apply the trim. The
  target loses the filler on disk and the reply carries the Diff section.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /skill-style:skill-style skills/tidy/SKILL.md apply the trim, go ahead and edit in place
  max_turns: 25
  timeout_seconds: 400
  allowed_tools: [Bash, Read, Glob, Edit, Skill]

runs: 3

graders:
  - name: ledger-is-reported
    type: regex
    target: last_message
    pattern: '## Ledger'

  - name: diff-section-present
    type: regex
    target: last_message
    pattern: '^## Diff'
    flags: m

  - name: filler-is-gone-from-the-file
    type: regex
    target:
      source: file
      path: skills/tidy/SKILL.md
    pattern: 'Imports are an important part of any Python program'
    match: not_contains

  - name: command-line-survives
    type: regex
    target:
      source: file
      path: skills/tidy/SKILL.md
    pattern: "Sort the imports of the named file with the project's formatter"

  - name: no-bold-label-bullets
    type: regex
    target: last_message
    pattern: '^- \*\*[^*]+:\*\*'
    flags: m
    match: not_contains

  - name: hero-follows-mode-template
    type: regex
    target: last_message
    pattern: '^[^\s]+ loses (?:[^\s;.!?]+[ \t]+){0,15}[^\s;.!?]+\.[ \t]*\n'

  - name: only-contract-headings
    type: regex
    target: last_message
    pattern: '^## (?!Ledger$|Behavior changes$|Diff$)'
    flags: m
    match: not_contains
