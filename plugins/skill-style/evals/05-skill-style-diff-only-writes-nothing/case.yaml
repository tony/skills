schema_version: "1.0"
name: 05-skill-style-diff-only-writes-nothing
description: >-
  A tracked SKILL.md with filler, run with the diff-only flag. The reply carries
  a Diff section and the target file stays unchanged.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /skill-style:skill-style skills/tidy/SKILL.md --diff-only
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Bash, Read, Glob, Skill]

runs: 3

graders:
  - name: ledger-is-reported
    type: regex
    target: last_message
    pattern: '## Ledger'

  - name: diff-section-present
    type: regex
    target: last_message
    pattern: '^## Diff'
    flags: m

  - name: no-bold-label-bullets
    type: regex
    target: last_message
    pattern: '^- \*\*[^*]+:\*\*'
    flags: m
    match: not_contains

  - name: target-unchanged
    type: regex
    target:
      source: file
      path: skills/tidy/SKILL.md
    pattern: 'Imports are an important part of any Python program'

  - name: hero-follows-mode-template
    type: regex
    target: last_message
    pattern: '^[^\s]+ would lose (?:[^\s;.!?]+[ \t]+){0,15}[^\s;.!?]+\.[ \t]*\n'

  - name: diff-cuts-the-filler
    type: regex
    target: last_message
    pattern: '^-Imports are an important part'
    flags: m

  - name: only-contract-headings
    type: regex
    target: last_message
    pattern: '^## (?!Ledger$|Behavior changes$|Diff$)'
    flags: m
    match: not_contains
