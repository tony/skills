schema_version: "1.0"
name: 04-skill-style-audit-writes-nothing
description: >-
  A tracked SKILL.md with filler, run with the audit flag. The ledger is the
  whole deliverable: no edit tool runs and no diff section is printed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /skill-style:skill-style skills/tidy/SKILL.md --audit
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Bash, Read, Glob, Skill]

runs: 3

graders:
  - name: ledger-is-reported
    type: regex
    target: last_message
    pattern: '## Ledger'

  - name: no-diff-section
    type: regex
    target: last_message
    pattern: '^## Diff'
    flags: m
    match: not_contains

  - name: no-bold-label-bullets
    type: regex
    target: last_message
    pattern: '^- \*\*[^*]+:\*\*'
    flags: m
    match: not_contains

  - name: target-unchanged
    type: regex
    target:
      source: file
      path: skills/tidy/SKILL.md
    pattern: 'Imports are an important part of any Python program'

  - name: creates-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
