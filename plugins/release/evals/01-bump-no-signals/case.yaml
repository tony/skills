schema_version: "1.0"
name: 01-bump-no-signals
description: >-
  A repo with no manifest version, tag, or changelog gives `bump` nothing to
  compute a next version from. It asks the user and releases nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:bump
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: no-mutation
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)\b|git(?:\s+-[Cc]\s*\S+)*\s+tag +-a'
    min: 0
    max: 0
    arm: both

  - name: asks-instead-of-proposing
    type: llm
    focus: last_message
    criteria: |
      The reply says it could not establish a current version and asks the user
      to supply one.
      The reply proposes no specific next version or bump type, and does not
      claim a release was made.
