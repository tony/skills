schema_version: "1.0"
name: 06-cut-tag-flag-never-pushes
description: >-
  `--tag` alone creates the local tag after the release commit and pushes
  neither the commit nor the tag.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:cut 0.4.0 --tag
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: commits-the-release
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit\b'
    min: 1
    max: 99
    arm: both

  - name: creates-the-tag-through-the-script
    type: tool_used
    tool: Bash
    input_match: '(?<!push-)\btag[\s\\n]+--tag\s+v0\.4\.0'
    min: 1
    max: 99
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n"]*\bpush\b(?![.=])'
    min: 0
    max: 0
    arm: both

  - name: manifest-at-new-version
    type: regex
    target:
      source: file
      path: pyproject.toml
    pattern: 'version = "0\.4\.0"'

  - name: changelog-retitled
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: '^#{2} +0\.4\.0 +\(\d{4}-\d{2}-\d{2}\)'
    flags: m

  - name: fresh-unreleased-section
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: '^#{2} +Unreleased'
    flags: m

  - name: release-commit-subject
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit[\s\S]*Tag v0\.4\.0'
    min: 1
    max: 99
    arm: both

  - name: reports-tag-local-only
    type: llm
    focus: last_message
    criteria: |
      The reply states that tag `v0.4.0` was created locally and that neither the
      commit nor the tag was pushed.
      The reply gives the push commands as a next step for the user and does not run
      them or claim to have run them.
