schema_version: "1.0"
name: 11-cut-push-ignores-push-config
description: >-
  `--push` alone publishes only the release commit to the trunk branch even when
  the repo configures `push.followTags` and a `remote.origin.push` tag mapping;
  no tag is created or pushed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:cut 0.4.0 --push
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: binds-the-release-commit
    type: tool_used
    tool: Bash
    input_match: 'verify-commit[\s\S]{0,200}?--parent'
    min: 1
    max: 99
    arm: both

  - name: pushes-the-branch-through-the-script
    type: tool_used
    tool: Bash
    input_match: 'push-branch[\s\S]{0,400}?--commit'
    min: 1
    max: 99
    arm: both

  - name: never-runs-raw-push
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n"]*\bpush\b(?![.=])'
    min: 0
    max: 0
    arm: both

  - name: never-tags
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n"]*\btag\b +(?!-l\b|-n\b|--list\b|--sort\b)\S|\btag[\s\\n]+--tag\b|push-tag'
    min: 0
    max: 0
    arm: both

  - name: reports-pushed-without-a-tag
    type: llm
    focus: last_message
    criteria: |
      The reply says the release commit was pushed to the trunk branch and that no tag was created.
      The reply does not claim a tag was created or pushed, and does not claim a registry release exists.
