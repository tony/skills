schema_version: "1.0"
name: 09-cut-tag-push-tag-to-bare-origin
description: >-
  `--tag --push-tag` creates the tag and pushes only `refs/tags/<tag>` to the
  remote, with `--no-follow-tags`; the trunk branch is not pushed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:cut 0.4.0 --tag --push-tag
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: commits-the-release
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit[\s\S]*Tag v0\.4\.0'
    min: 1
    max: 99
    arm: both

  - name: creates-the-tag
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+tag +(?!-l\b|--list\b|--sort\b)\S.*v0\.4\.0'
    min: 1
    max: 99
    arm: both

  - name: pushes-only-the-tag-ref
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n]*\bpush\b[^|;&\n]*--no-follow-tags[^|;&\n]*refs/tags/v0\.4\.0'
    min: 1
    max: 99
    arm: both

  - name: no-other-push
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n]*\bpush\b(?![.=])(?![^|;&\n]*refs/tags/v0\.4\.0)'
    min: 0
    max: 0
    arm: both

  - name: no-force-or-bulk-tag-push
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n]*\bpush\b[^|;&\n]*(--force|--tags\b|(?<!no-)--follow-tags|--mirror| -f\b)'
    min: 0
    max: 0
    arm: both

  - name: reports-tag-created-and-pushed
    type: regex
    target: last_message
    pattern: 'tag v0\.4\.0 created and pushed'
    flags: i

  - name: gives-branch-push-as-next-step
    type: regex
    target: last_message
    pattern: 'git push --no-follow-tags\s*$'
    flags: m
