schema_version: "1.0"
name: 09-cut-tag-push-tag-to-bare-origin
description: >-
  `--tag --push-tag` creates the tag and pushes only `refs/tags/<tag>` through the
  publication script, which reads the remote back; the trunk branch is not pushed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:cut 0.4.0 --tag --push-tag
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: commits-the-release
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit[\s\S]*Tag v0\.4\.0'
    min: 1
    max: 99
    arm: both

  - name: binds-the-release-commit
    type: tool_used
    tool: Bash
    input_match: 'verify-commit[\s\S]{0,200}?--parent'
    min: 1
    max: 99
    arm: both

  - name: creates-the-tag-through-the-script
    type: tool_used
    tool: Bash
    input_match: '(?<!push-)\btag[\s\\n]+--tag\s+v0\.4\.0'
    min: 1
    max: 99
    arm: both

  - name: pushes-the-tag-through-the-script
    type: tool_used
    tool: Bash
    input_match: 'push-tag[\s\S]{0,400}?v0\.4\.0'
    min: 1
    max: 99
    arm: both

  - name: never-runs-raw-push
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n"]*\bpush\b(?![.=])'
    min: 0
    max: 0
    arm: both

  - name: reports-tag-created-and-pushed
    type: regex
    target: last_message
    pattern: 'tag v0\.4\.0[^\n]*created[^\n]*pushed'
    flags: i

  - name: gives-branch-push-as-next-step
    type: regex
    target: last_message
    pattern: '^- git push --no-follow-tags --recurse-submodules=no origin [0-9a-f]+:refs/heads/main\s*$'
    flags: m
