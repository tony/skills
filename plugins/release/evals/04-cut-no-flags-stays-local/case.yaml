schema_version: "1.0"
name: 04-cut-no-flags-stays-local
description: >-
  A release is cut at an explicit version with no flags. The release commit is
  made and nothing is tagged or pushed, whatever a user's push config says.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:cut 0.4.0
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: commits-the-release
    type: tool_used
    tool: Bash
    input_match: 'git +commit\b'
    min: 1
    max: 99
    arm: both

  - name: never-tags
    type: tool_used
    tool: Bash
    input_match: 'git +tag +(?!-l\b|--list\b|--sort\b)\S'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git\b[^|;&\n]*\bpush\b'
    min: 0
    max: 0
    arm: both

  - name: reports-nothing-tagged-or-pushed
    type: llm
    focus: last_message
    criteria: |
      The reply states that the release was committed locally and that no tag was
      created and nothing was pushed.
      The reply offers the commands for tagging and pushing as something the user
      runs or re-invokes with flags, and does not run them or claim to have run them.
