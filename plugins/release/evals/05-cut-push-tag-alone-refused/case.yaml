schema_version: "1.0"
name: 05-cut-push-tag-alone-refused
description: >-
  `--push-tag` without `--tag` is refused before anything runs: no commit, no
  edit, no tag, no push.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:cut 0.4.0 --push-tag
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit\b'
    min: 0
    max: 0
    arm: both

  - name: never-tags
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n"]*\btag\b +(?!-l\b|-n\b|--list\b|--sort\b)\S'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n"]*\bpush\b(?![.=])'
    min: 0
    max: 0
    arm: both

  - name: never-edits-a-version-file
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both

  - name: version-manifest-untouched
    type: regex
    target:
      source: file
      path: pyproject.toml
    pattern: 'version = "0\.3\.0"'

  - name: changelog-still-unreleased
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: '^#{2} +Unreleased'
    flags: m

  - name: refuses-and-explains
    type: llm
    focus: last_message
    criteria: |
      The reply refuses to run the release and says that `--push-tag` requires
      `--tag` in the same run.
      The reply does not claim to have committed, tagged, or pushed anything, and
      does not cut the release without the tag.
