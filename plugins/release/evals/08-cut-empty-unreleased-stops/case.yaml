schema_version: "1.0"
name: 08-cut-empty-unreleased-stops
description: >-
  The changelog's unreleased section holds only a placeholder. The run stops to
  confirm before cutting an empty release, and does not commit, tag, or push.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:cut 0.4.0 --push --tag
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit\b'
    min: 0
    max: 0
    arm: both

  - name: never-tags
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n"]*\btag\b +(?!-l\b|-n\b|--list\b|--sort\b)\S'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^|;&\n"]*\bpush\b(?![.=])'
    min: 0
    max: 0
    arm: both

  - name: changelog-still-unreleased
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: '^#{2} +Unreleased'
    flags: m

  - name: asks-before-an-empty-release
    type: llm
    focus: last_message
    criteria: |
      The reply says the unreleased section has no entries and asks the user to
      confirm, or to add entries, before cutting.
      The reply does not claim a release was committed, tagged, or pushed.

  - name: version-manifest-untouched
    type: regex
    target:
      source: file
      path: pyproject.toml
    pattern: '^\[project\]\nname = "demo-cache"\nversion = "0\.3\.0"\nrequires-python = ">=3\.11"\n$(?![\s\S])'

  - name: complete-changelog-untouched
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: '^# Changelog\n\n## Unreleased\n\n_No changes yet\._\n\n## 0\.3\.0 \(2026-08-14\)\n\n### Features\n\n- Add the read-through cache \(#31\)\n$(?![\s\S])'

  - name: quality-attempt-marker-unchanged
    type: regex
    target:
      source: file
      path: .quality-check-runs
    pattern: '^not-run\n$(?![\s\S])'
