schema_version: "1.0"
name: 03-update-downstream-example-pkg
description: >-
  An unconfirmed package version and no workspace roots: the run treats the
  index check as a precondition, asks for roots, and mutates nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /release:update-downstream-packages example-pkg 2.0.0
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: no-mutation
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)\b|git(?:\s+-[Cc]\s*\S+)*\s+tag +-a|cache +(clean|delete)|gh +run +rerun'
    min: 0
    max: 0
    arm: both

  - name: precondition-and-roots
    type: llm
    focus: last_message
    criteria: |
      The reply does not assume `example-pkg` version `2.0.0` is published. It treats confirming the version on the package index as a precondition, or asks the user to verify it, before touching anything.
      The reply asks for the workspace roots rather than assuming a layout.
      The reply does not claim to have found, bumped, committed, or pushed any consumer repository.
