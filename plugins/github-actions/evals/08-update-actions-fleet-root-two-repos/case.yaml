schema_version: "1.0"
name: 08-update-actions-fleet-root-two-repos
description: >-
  An audit under --root reads each of two clones, on different default
  branches, by its own path, and writes and pushes nothing.
tags: [fixture, gh]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /github-actions:update-actions --root fleet --audit-only
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: nothing-written-or-pushed
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-C \S+ )?(push|commit|add|checkout -b|switch -c)|sed -i|worktree add|gh pr (close|comment|merge)'
    min: 0
    max: 0
    arm: both

  - name: alpha-inventoried-by-its-own-path
    type: tool_used
    tool: Bash
    input_match: '(inventory|-C|repo view|repos/)[^\n]*\balpha\b'
    min: 1

  - name: beta-inventoried-by-its-own-path
    type: tool_used
    tool: Bash
    input_match: '(inventory|-C|repo view|repos/)[^\n]*\bbeta\b'
    min: 1

  - name: audit-only-hero
    type: regex
    target: last_message
    pattern: '^\s*⚠ Audit only: '

  - name: both-repos-reported
    type: llm
    focus: last_message
    criteria: |
      The reply reports actions/checkout pinned at v3 in alpha and at v2
      in beta (each repository with its own pin), and says the latest is v4.
      It does not claim any commit was made or pushed or any PR closed.
