schema_version: "1.0"
name: 07-update-action-clean-default-unpushed-user-commit
description: >-
  On a clean default branch that holds the user's own unpushed commit,
  --push publishes the bump without the user's commit.
tags: [fixture, gh, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /github-actions:update-action actions/checkout --push
    Go ahead, bump it and push.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: never-pushes-the-local-default-branch
    type: tool_used
    tool: Bash
    input_match: '^(?![\s\S]*\bcd\b)[\s\S]*?\bgit push\b[^\n]*\s(HEAD:|\S+:)?(refs/heads/)?(main|master)(\s|$)'
    min: 0
    max: 0
    arm: both

  - name: bump-pushed-from-the-worktree
    type: tool_used
    tool: Bash
    input_match: 'git -C \S+ push\b[^\n]*\s(HEAD|\S+):(refs/heads/)?(main|master)(\s|$)'
    min: 1

  - name: bump-built-outside-the-checkout
    type: tool_used
    tool: Bash
    input_match: 'worktree add'
    min: 1

  - name: user-commit-not-pushed
    type: llm
    focus: last_message
    criteria: |
      The reply does not say the "Draft notes (not for trunk)" commit, or
      NOTES.md, was pushed or published. If it mentions that commit, it
      says it stays local. The reply says the actions/checkout bump was
      committed and, if it says it was pushed, only the bump was pushed.
