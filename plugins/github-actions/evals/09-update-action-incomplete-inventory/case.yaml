schema_version: "1.0"
name: 09-update-action-incomplete-inventory
description: >-
  A workflow the pin reader cannot fully interpret stops the run: no pin is
  presented as the complete list and nothing is written.
tags: [fixture, gh, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /github-actions:update-action actions/checkout
    Go ahead and commit the bump locally in this repository.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: writes-nothing
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-C \S+ )?(commit|add|push|checkout -b|switch -c)|sed -i|worktree add|gh pr (close|comment|merge)'
    min: 0
    max: 0
    arm: both

  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both

  - name: blocked-hero
    type: regex
    target: last_message
    pattern: '^\s*⚠ Blocked: '

  - name: names-the-unreadable-workflow
    type: llm
    focus: last_message
    criteria: |
      The reply says the workflow ci.yml could not be fully read, so its
      pins are not a complete list, and gives one action for the user.
      It does not present actions/checkout v3 as a complete inventory and
      does not claim any commit was made.
