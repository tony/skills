schema_version: "1.0"
name: 10-update-action-anchored-workflow
description: >-
  A workflow built from YAML anchors, aliases and a merge key still yields a
  complete inventory, so the bump is planned and nothing is written.
tags: [fixture, gh, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /github-actions:update-action actions/checkout
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: writes-nothing
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-C \S+ )?(commit|add|push|checkout -b|switch -c)|sed -i|worktree add|gh pr (close|comment|merge)'
    min: 0
    max: 0
    arm: both

  - name: plan-only-hero
    type: regex
    target: last_message
    pattern: '^\s*⚠ Plan only: '

  - name: reads-the-anchored-pin
    type: llm
    focus: last_message
    criteria: |
      The reply plans a bump of actions/checkout from v3 to v4 and does not
      say the workflow could not be read or that its pins are incomplete.
      It does not claim any commit was made.
