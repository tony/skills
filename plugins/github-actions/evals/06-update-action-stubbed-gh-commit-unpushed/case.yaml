schema_version: "1.0"
name: 06-update-action-stubbed-gh-commit-unpushed
description: >-
  From a feature-branch checkout with uncommitted work, one action bump is
  committed locally without a push, and the commit survives on a named
  branch whose push command the reply prints.
tags: [fixture, gh, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /github-actions:update-action actions/checkout
    Go ahead and commit the bump locally in this repository; do not push.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: verifies-the-tag-before-writing
    type: tool_used
    tool: Bash
    input_match: 'git/ref/tags/v4'

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
    arm: both

  - name: commits-on-a-named-branch
    type: tool_used
    tool: Bash
    input_match: 'git (-C \S+ )?commit\b'
    min: 1

  - name: creates-a-branch-for-the-commit
    type: tool_used
    tool: Bash
    input_match: 'worktree add .*-b |checkout -b |switch -c |git branch [a-z]'
    min: 1

  - name: never-sweeps-notes-into-the-commit
    type: tool_used
    tool: Bash
    input_match: 'git (-C \S+ )?add [^|;&]*notes\.txt|git commit( -\S+)* (-a|-am|--all)( |$)|git (-C \S+ )?stash( push| save| -|\s*($|[;&|]))'
    min: 0
    max: 0
    arm: both

  - name: notes-left-uncommitted-in-place
    type: llm
    focus: last_message
    criteria: |
      The reply does not say notes.txt or other uncommitted work was
      committed, stashed, discarded, or moved. If it mentions that work, it
      says it was left in place on the original branch.

  - name: names-branch-and-push-command
    type: llm
    focus: last_message
    criteria: |
      The reply says the bump to actions/checkout v4 was committed and not
      pushed. It names the local branch holding the commit and prints the
      git push command for that branch. It does not claim anything was
      pushed or that any dependabot PR was closed.
