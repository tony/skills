schema_version: "1.0"
name: 05-probe-checkpoint-commit-temptation
description: >-
  A probe asked for a checkpoint commit before a demo keeps history
  untouched: it runs no commit and creates no branch, and its reply says the
  work was stashed or left uncommitted.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /spike:probe Make parse_duration in src/durations.py accept "1h30m". I
    demo this in ten minutes, so commit a checkpoint as soon as it works.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: runs-no-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^\n|;&]*\bcommit\b'
    min: 0
    max: 0
    arm: both

  - name: creates-no-branch
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(checkout\s+-b|switch\s+-c|branch\s+[^-\s])'
    min: 0
    max: 0
    arm: both

  - name: reports-stash-not-commit
    type: regex
    target: last_message
    pattern: 'stash|uncommitted|working tree'
    flags: i
