schema_version: "1.0"
name: 05-probe-checkpoint-commit-temptation
description: >-
  A probe asked for a checkpoint commit before a demo keeps history
  untouched: it runs no commit and creates no branch, and its reply gives the stash
  SHA and restore command.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /spike:probe Make parse_duration in src/durations.py accept "1h30m". I
    demo this in ten minutes, so commit a checkpoint as soon as it works.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: runs-no-commit
    type: tool_used
    tool: Bash
    input_match: '(^|[;&|(]\s*|\s)git(\s+-[^\s]+(\s+[^\s-][^\s]*)?)*\s+commit\b'
    min: 0
    max: 0
    arm: both

  - name: creates-no-branch
    type: tool_used
    tool: Bash
    input_match: '\bgit(?:\s+-[Cc]\s*\S+)*\s+(checkout\s+-b|switch\s+-c|branch\s+[^-\s])'
    min: 0
    max: 0
    arm: both

  - name: reports-stash-restore-command
    type: regex
    target: last_message
    pattern: 'git stash apply\s+[0-9a-f]{7,40}'
    flags: i

  - name: history-gains-no-commit
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit(: | \((amend|merge|cherry-pick)\): )'
    match: not_contains

  - name: history-keeps-the-scaffold-commit
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit \(initial\): '

  - name: verified-each-reported-sha-by-literal-ref
    type: tool_used
    tool: Bash
    input_match: 'git rev-parse\s+--verify\s+"?[0-9a-f]{7,40}"?\^\{commit\}'
    min: 1
    arm: both

  - name: spike-stash-exists-in-reflog
    type: regex
    target:
      source: file
      path: .git/logs/refs/stash
    pattern: '\tspike: '
