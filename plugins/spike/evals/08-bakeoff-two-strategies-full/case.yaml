schema_version: "1.0"
name: 08-bakeoff-two-strategies-full
description: >-
  A bakeoff on a clean repository with two named strategies builds both,
  stashes each with a recorded SHA, removes the worktrees, and adds no
  commit.
tags: [fixture, git, destructive, slow]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /spike:bakeoff --strategies="cap the dict with LRU eviction; expire
    entries after a TTL" --prongs=2 Bound the unbounded cache in
    src/cache.py. Keep each contender tiny; the shared proving check is
    that the store never holds more than 100 live keys.
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill, Agent]

runs: 3

graders:
  - name: runs-no-commit
    type: tool_used
    tool: Bash
    input_match: '(^|[;&|(]\s*|\s)git(\s+-[^\s]+(\s+[^\s-][^\s]*)?)*\s+commit\b'
    min: 0
    max: 0
    arm: both

  - name: history-gains-no-commit
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit(: | \((amend|merge|cherry-pick)\): )'
    match: not_contains

  - name: history-keeps-the-scaffold-commit
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit \(initial\): '

  - name: both-contenders-stashed
    type: regex
    target:
      source: file
      path: .git/logs/refs/stash
    pattern: '\tbakeoff [^\n]*\n[\s\S]*\tbakeoff '

  - name: worktrees-removed
    type: tool_used
    tool: Bash
    input_match: 'worktree remove|\bteardown\b'
    min: 1
    arm: both

  - name: only-the-main-worktree-remains
    type: file_exists
    path: .git/worktrees
    exists: false

  - name: checked-the-worktree-list
    type: tool_used
    tool: Bash
    input_match: 'worktree list|\bteardown\b'
    min: 1
    arm: both

  - name: reports-both-stash-shas
    type: regex
    target: last_message
    pattern: 'git stash apply\s+[0-9a-f]{7,40}[\s\S]*git stash apply\s+[0-9a-f]{7,40}'
    flags: i

  - name: reports-the-verdict
    type: llm
    focus: last_message
    criteria: |
      The reply names a winner (or says the result is inconclusive) and lists
      both contenders, each with a stash SHA or "no changes". It does not
      claim a commit was made.

  - name: stashes-one-at-a-time
    type: tool_used
    tool: Bash
    input_match: 'spike\.sh\s+stash[\s\S]*spike\.sh\s+stash'
    min: 0
    max: 0
    arm: both

  - name: verified-the-reported-shas-in-git
    type: tool_used
    tool: Bash
    input_match: 'git stash (list|show)|git (cat-file|rev-parse --verify)|logs/refs/stash'
    min: 1
    arm: both
