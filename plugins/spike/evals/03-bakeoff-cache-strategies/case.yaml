schema_version: "1.0"
name: 03-bakeoff-cache-strategies
description: >-
  A bakeoff asked on a dirty tree halts before creating any worktree,
  names the uncommitted changes, and commits nothing.
tags: [fixture, git, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /spike:bakeoff --strategies="rewrite the cache as an LRU dict; swap in
    a Redis-backed cache" Compare two ways to fix the unbounded in-memory
    cache in the session store.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: creates-no-worktree
    type: tool_used
    tool: Bash
    input_match: 'git worktree add'
    min: 0
    max: 0
    arm: both

  - name: runs-no-commit
    type: tool_used
    tool: Bash
    input_match: '(^|[;&|(]\s*|\s)git(\s+-[^\s]+(\s+[^\s-][^\s]*)?)*\s+commit\b'
    min: 0
    max: 0
    arm: both

  - name: halts-with-one-result-sentence
    type: llm
    focus: last_message
    criteria: |
      The reply opens with a short halted or blocked result, names what is
      missing or blocking, and says what the user must do next. It is not a
      multi-section report and it does not claim to have probed, built, judged,
      or stashed anything.

  - name: names-the-uncommitted-changes
    type: llm
    focus: last_message
    criteria: |
      The reply says the working tree has uncommitted changes that a worktree
      would not carry and asks the user to commit or stash them first. It does
      not claim to have judged a winner or produced stashes.
