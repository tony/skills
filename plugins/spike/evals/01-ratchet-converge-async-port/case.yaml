schema_version: "1.0"
name: 01-ratchet-converge-async-port
description: >-
  A ratchet asked in a repository with no commits halts before round 1,
  says why and what the user does next, and commits nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    I want to converge on an approach for porting our retry-queue module
    from callback style to async/await. Keep spiking, bake off the
    strategies, and spike again until nothing new fights back.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: ratchet-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(spike:)?ratchet"'
    min: 1
    arm: both

  - name: runs-no-commit
    type: tool_used
    tool: Bash
    input_match: '(^|[;&|(]\s*|\s)git(\s+-[^\s]+(\s+[^\s-][^\s]*)?)*\s+commit\b'
    min: 0
    max: 0
    arm: both

  - name: halts-with-one-result-sentence
    type: llm
    focus: last_message
    criteria: |
      The reply opens with a short halted or blocked result, names what is
      missing or blocking, and says what the user must do next. It is not a
      multi-section report and it does not claim to have probed, built, judged,
      or stashed anything.

  - name: names-the-missing-commit
    type: llm
    focus: last_message
    criteria: |
      The reply says the repository has no commits yet and that the user
      makes the initial commit.
