schema_version: "1.0"
name: 09-probe-replay-lands-plan
description: >-
  A probe run with --replay on a dirty tree, with the plan approved in
  advance, lands exactly one commit per plan item with no tool trailer, drops
  its own spike stash by SHA, and leaves the user's work untouched.
tags: [fixture, git, destructive, slow]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /spike:probe --replay Make parse_duration in src/durations.py accept
    "1h30m". Plan exactly two commits: first a refactor that splits the
    parser into a tokenizer, then the feature. I approve the brief and that
    plan in advance, so replay it. I have uncommitted work in this tree;
    stash it first and put it back when you are done.
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: lands-at-least-two-commits
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit: [^\n]*\n[\s\S]*\tcommit: '

  - name: lands-no-more-than-two-commits
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '(\tcommit: [^\n]*\n[\s\S]*){3}'
    match: not_contains

  - name: commit-carries-no-tool-trailer
    type: tool_used
    tool: Bash
    input_match: 'Co-Authored-By|Generated with|noreply@anthropic'
    min: 0
    max: 0
    arm: both

  - name: drops-the-spike-stash-by-sha
    type: tool_used
    tool: Bash
    input_match: '\bdrop\s+"?[0-9a-f]{7,40}\b'
    min: 1
    arm: both

  - name: never-drops-the-user-stash
    type: regex
    target:
      source: file
      path: .git/logs/refs/stash
    pattern: '\tuser work before spike'

  - name: tracked-edit-restored
    type: regex
    target:
      source: file
      path: notes.txt
    pattern: '^draft notes\nunsaved edit\n$'

  - name: untracked-file-restored
    type: regex
    target:
      source: file
      path: scratch.txt
    pattern: '^scratch idea\n$'

  - name: reports-two-commits-and-the-user-work-sha
    type: llm
    focus: last_message
    criteria: |
      The reply says two commits were landed, one per plan item, and gives
      the SHA of the user's saved work with how it was restored. It does not
      claim more commits than two.

  - name: verified-each-reported-sha-by-literal-ref
    type: tool_used
    tool: Bash
    input_match: 'git rev-parse\s+--verify\s+"?[0-9a-f]{7,40}"?\^\{commit\}'
    min: 1
    arm: both
