schema_version: "1.0"
name: 05-resource-guard-check
description: >-
  Watching resources runs the check, prints its ok or low line, and deletes nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Watch cpu, memory and free disk while you run `python3 -c 'print(1)'`, and tell me if we are low on anything.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: resource-guard-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(goal-planner:)?resource-guard"'

  - name: ran-the-check
    type: tool_used
    tool: Bash
    input_match: '\scheck\b'

  - name: prints-the-resources-line
    type: regex
    pattern: 'resources (ok|low)'

  - name: deletes-nothing
    type: tool_used
    tool: Bash
    input_match: 'clean[^|;&]*--apply|rm\s+-[a-z]*r'
    min: 0
    max: 0
    arm: both
