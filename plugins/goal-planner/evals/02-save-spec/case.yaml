schema_version: "1.0"
name: 02-save-spec
description: Long Claude contract saves a complete specification and prints the exact compact goal.
tags: [fixture, handoff]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    /goal-planner:print Prepare and save a Claude handoff from requirements.md.
    Use topic packet-reader, date 2030-01-02, and the Documents directory inside
    this working directory as the explicitly selected Documents root. Keep the
    default addendum reserve. The source is longer than the payload budget:
    save a complete goal specification and a compact goal. Include requirements.md
    completely and verbatim in the specification, including the Unicode label and
    numerical constraints. Add framing if needed; do not summarize away any
    requirement. Print the entire saved goal exactly, not only links.
    This authorizes handoff files only, not executing the decoder work or
    activating a native goal. Do not consult history or existing profiles.
    For retained eval evidence, keep the final helper request in draft.json,
    with the absolute Documents root and explicit date. Run its public render
    with saving as one direct Bash call using the literal absolute helper path
    and --input draft.json; leave its unmodified JSON result on tool stdout.
    Never repeat that receipt in the final response, which prints the complete
    exact goal once. Do not combine that call with another shell command or
    redirect its output. Other
    preparation and verification calls may be separate. These evidence
    conventions apply only to this eval fixture, not ordinary user handoffs.
    Outside the goal, report whole-payload counts using exactly
    "Counts: N code points; M UTF-16 units." with the measured integers.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  disallowed_tools: [WebFetch, WebSearch]
runs: 1
graders:
  - name: goal-saved
    type: file_exists
    path: Documents/2030-01-02/goals/packet-reader-001.md
  - name: specification-saved
    type: file_exists
    path: Documents/2030-01-02/goal-specs/packet-reader-001.md
  - name: whole-goal-keeps-addendum-reserve
    type: regex
    target: last_message
    pattern: '## Goal\s+```text\n/goal [\s\S]{1,3794}\n```'
  - name: specification-is-a-contract
    type: llm
    focus:
      source: file
      path: Documents/2030-01-02/goal-specs/packet-reader-001.md
    criteria: >-
      Grade coverage of a future-work specification, not completion of decoder
      implementation. A PASS here means required acceptance is preserved; the
      known regression must remain FAIL.
      The specification must explicitly retain the oversized-header regression
      as currently FAIL. Saying it is currently PASS, passed, or fixed fails even
      if generic warnings elsewhere preserve failures; future acceptance is not
      evidence of a fix.
      This is a complete decoder contract with outcome and every source requirement.
      It retains the oversized-header FAIL, consumer verification,
      exact-revision evidence, negative control, ownership, resource bounds,
      failure preservation, and excluded remote/release/benchmark/package scope.
      It does not recast known failures as passed or supply only overflow scraps.
  - name: compact-goal-has-operational-boundaries
    type: llm
    focus: last_message
    criteria: >-
      The copyable compact goal preserves the decoder outcome, mandatory
      acceptance obligations and exclusions, requires reading the complete
      specification and reporting requirement-level acceptance evidence, and
      resolves its companion without depending on the current working directory.
      It does not claim the future implementation or tests are already complete.
      It must not claim to have implemented the decoder, run its checks,
      activated a goal, or performed remote delivery. Handoff files and scratch
      preparation are allowed; actual file and tool evidence is checked separately.
  - name: handoff-only-tools
    type: llm
    focus: trace
    criteria: >-
      Observed tool actions must stay within handoff preparation and verification.
      Reading the source and plugin, writing scratch requests and goal artifacts,
      rendering/counting/checking them are allowed. Implementing the decoder,
      running decoder acceptance checks, activating a native goal, or remote
      delivery fails. Future instructions in the drafted goal are not tool actions.
      Do not demand positive evidence that may be outside this sampled trace;
      actual publication evidence is independently checked from the complete trace.
