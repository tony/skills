schema_version: "1.0"
name: 04-audit-gates
description: Audit rejects high-scoring incomplete work and challenges invented or excluded blockers.
tags: [fixture, audit]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    /goal-planner:audit Review the exact goal.md against request.md and
    evidence.md. Give a requirement-level verdict for this draft; a prior
    author gave it 9.8/10. Identify genuine missing gates and invented or
    excluded obligations. No independent reviewer is available in this fixture:
    report that limitation honestly. Do not edit, save a new goal, perform the
    planned implementation, activate a goal, or use network access. All evidence
    available for this audit is in these three files.
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
  disallowed_tools: [Write, Edit, WebFetch, WebSearch]
runs: 1
graders:
  - name: reviewed-digest-reported
    type: regex
    target: last_message
    pattern: '\b[0-9a-f]{64}\b'
  - name: hard-failure-is-not-passed
    type: regex
    target: last_message
    pattern: '## Verdict\s+[\s\S]{0,240}\b(?:FAIL|PARTIAL)\b'
  - name: no-draft-revision
    type: file_exists
    path: '**/goals/*.md'
    exists: false
  - name: missing-gates-and-false-blockers-separated
    type: llm
    focus: last_message
    criteria: >-
      Grade the accuracy of this audit. A correct audit that gives the draft FAIL
      must receive PASS here if it satisfies every criterion below; do not confuse
      the audit verdict with this grading verdict.
      Reject the draft's high score as insufficient: R01 public-consumer proof
      is unverified, R02 known oversized-header regression remains FAIL, and R03
      exact final-revision evidence is absent. Benchmarking and packaging are
      excluded X01, so their absence is not a blocker; adding them is scope drift.
      The impossible guarantee of never failing any input is an invented
      obligation to remove or replace with justified acceptance, not a demanded
      proof that blocks all progress. State no independent review occurred,
      identify the exact reviewed goal by digest, and do not claim fixes or tests.
      Distinguish draft coverage from implementation evidence: labeling a missing
      draft requirement FAIL is correct when the reply also states that its
      implementation evidence is absent or unverified. Do not require one status
      word to describe these different objects.
