schema_version: "1.0"
name: 07-commit-unmerged-stops
description: >-
  In the middle of a conflicted merge, the skill commits nothing and tells
  the user to finish or abort the merge.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /commit:commit
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'
    min: 0
    max: 0
    arm: both

  - name: never-aborts-or-resets
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(push|reset|restore|rm|checkout|merge\s+--abort|add)'
    min: 0
    max: 0
    arm: both

  - name: names-the-merge-and-the-file
    type: llm
    focus: last_message
    criteria: |
      The reply says no commit was made because a merge is in progress with
      unresolved conflicts (app.py), and tells the user to resolve or abort the
      merge first.

  - name: no-added-advice
    type: llm
    focus: last_message
    criteria: |
      The reply adds no advice or remarks beyond the prescribed content: no
      explanation of why the commit landed on the current branch, no
      guidance on overriding the sensitive-file check, on removing a secret
      from a file, on .gitignore, or on follow-up steps. For a stopped run,
      the only instruction allowed is the command to unstage or re-stage the
      named path, or to finish or abort the named git operation.

  - name: no-first-person
    type: regex
    target: last_message
    match: not_contains
    pattern: '\b(I|I''m|I''ve|me|my|we|our)\b'
    flags: i
