schema_version: "1.0"
name: 07-commit-unmerged-stops
description: >-
  In the middle of a conflicted merge, the skill commits nothing and tells
  the user to finish or abort the merge.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /commit:commit
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'
    min: 0
    max: 0
    arm: both

  - name: never-aborts-or-resets
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(push|reset|restore|rm|checkout|merge\s+--abort|add)'
    min: 0
    max: 0
    arm: both

  - name: names-the-merge-and-the-file
    type: llm
    focus: last_message
    criteria: |
      The reply says no commit was made because a merge is in progress with
      unresolved conflicts (app.py), and tells the user to resolve or abort the
      merge first.
