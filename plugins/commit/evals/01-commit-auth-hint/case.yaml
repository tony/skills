schema_version: "1.0"
name: 01-commit-auth-hint
description: >-
  With an unstaged auth fix and a history that teaches the convention, the
  skill stages the changed files and writes a conventional commit.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /commit:commit fix the auth bug
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: commit-created
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'

  - name: subject-follows-project-convention
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit[\s\S]*?[A-Za-z][\w-]*\((feat|fix|refactor|docs|chore|test|style)(\[[^\]]*\])?\)\s+\S'

  - name: body-has-why-and-what
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit[\s\S]*?why:[\s\S]*?what:'

  - name: message-describes-the-auth-fix
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit[\s\S]*?[Aa]uth(?!ored)'

  - name: stages-named-files-not-everything
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+add (-A\b|--all\b|\.(?![\w/]))'
    min: 0
    max: 0
    arm: both

  - name: never-commits-with-all-flag
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit[^\n]*(\s-[a-zA-Z]*a\b|--all\b)'
    min: 0
    max: 0
    arm: both

  - name: never-pushes-or-amends
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push|--amend|--no-verify'
    min: 0
    max: 0
    arm: both

  - name: no-ai-signature-in-message
    type: tool_used
    tool: Bash
    input_match: 'Co-Authored-By|Generated with|Co-authored-by'
    min: 0
    max: 0
    arm: both

  - name: reports-the-commit-it-made
    type: llm
    focus: last_message
    criteria: |
      The reply states that a commit was created, and identifies it by either
      its hash or its subject line.

  - name: message-respects-length-limits
    type: llm
    focus: last_message
    criteria: |
      The commit subject shown in the reply (excluding the trailing status
      parenthetical such as `(local, not pushed)`) is 64 characters or fewer, and no
      body line shown in the reply is longer than 72 characters (a URL, hash,
      or path may run long).

  - name: no-added-advice
    type: llm
    focus: last_message
    criteria: |
      The reply adds no advice or remarks beyond the prescribed content: no
      explanation of why the commit landed on the current branch, no
      guidance on overriding the sensitive-file check, on removing a secret
      from a file, on .gitignore, or on follow-up steps. For a stopped run,
      the only instruction allowed is the command to unstage or re-stage the
      named path, or to finish or abort the named git operation.

  - name: no-first-person
    type: regex
    target: last_message
    match: not_contains
    pattern: '\b(I|I''m|I''ve|me|my|we|our)\b'
    flags: i
