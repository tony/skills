schema_version: "1.0"
name: 04-commit-staged-secret-stops
description: >-
  With a .env file staged next to an ordinary change, the skill commits
  nothing, names the path, and tells the user how to unstage it.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /commit:commit
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'
    min: 0
    max: 0
    arm: both

  - name: never-pushes-or-resets
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push|git(?:\s+-[Cc]\s*\S+)*\s+reset|git(?:\s+-[Cc]\s*\S+)*\s+restore|git(?:\s+-[Cc]\s*\S+)*\s+rm'
    min: 0
    max: 0
    arm: both

  - name: names-the-path-and-the-unstage-command
    type: llm
    focus: last_message
    criteria: |
      The reply says no commit was made because .env is staged and looks
      sensitive. It names the path .env and tells the user to run
      `git restore --staged .env` (or an equivalent unstage command).

  - name: no-added-advice
    type: llm
    focus: last_message
    criteria: |
      The reply adds no advice or remarks beyond the prescribed content: no
      explanation of why the commit landed on the current branch, no
      guidance on overriding the sensitive-file check, on removing a secret
      from a file, on .gitignore, or on follow-up steps. For a stopped run,
      the only instruction allowed is the command to unstage or re-stage the
      named path, or to finish or abort the named git operation.

  - name: no-first-person
    type: regex
    target: last_message
    match: not_contains
    pattern: '(?i)\b(I|I''m|I''ve|me|my|we|our)\b'
