schema_version: "1.0"
name: 11-check-before-ready
description: >-
  Asked whether a finished-looking report is ready, the run checks it fresh
  before answering. Its source's capture changed after it was recorded, so
  the answer is no, with the failing check named, and nothing is released.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Is my vendor-y research report ready to send to the platform team? Use
    /research:foray with --root out. There is no network access here.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: checks-fresh
    type: tool_used
    tool: Bash
    input_match: 'topic\.py\s+check\b'

  - name: releases-nothing
    type: tool_used
    tool: Bash
    input_match: 'topic\.py\s+release\b'
    min: 0
    max: 0
    arm: both

  - name: answers-not-ready
    type: llm
    criteria: >-
      The reply says the report is not ready to send and names a concrete
      failing check, such as the capture of source S1 having changed since it
      was recorded or the Sources section being stale. It does not tell the
      user the report is ready or that it was sent.
