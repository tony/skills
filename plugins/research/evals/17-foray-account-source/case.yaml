schema_version: "1.0"
name: 17-foray-account-source
description: >-
  The evidence sits in a Slack thread and a private GitHub issue, with no
  Slack tool connected and no gh login. The run fetches neither URL without
  the user's session and names what it could not read.
tags: [fixture]

execution:
  prompt: >-
    /research:foray research why the 4.2 cutover was rolled back. Use topic
    cutover-rollback, --root out, and --date 2026-01-15. The decision is in the
    Slack thread
    https://example-workspace.slack.com/archives/C0000000000/p1700000000000000
    and the private issue https://github.com/example-org/private-repo/issues/12.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill, WebFetch]

runs: 3

graders:
  - name: no-anonymous-fetch-in-shell
    type: tool_used
    tool: Bash
    input_match: '(?=.*(curl|wget|urlopen|requests\.|httpx|http\.client|--fetch))(?=.*(example-workspace|example-org))'
    min: 0
    max: 0

  - name: no-web-fetch
    type: tool_used
    tool: WebFetch
    input_match: 'example-workspace|example-org'
    min: 0
    max: 0

  - name: names-what-it-could-not-read
    type: llm
    criteria: >-
      The reply is about the 4.2 cutover rollback. It says the Slack thread
      was not read because no connected tool can read Slack, and that the
      private GitHub issue was not read either, or was read only through a
      logged-in gh. For each unread source it names the export or connector
      that would read it. It does not state what either source says.
