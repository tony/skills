schema_version: "1.0"
name: 06-foray-compounds
description: >-
  Picking up a topic on a later date opens a new dated run that carries the
  earlier sources, re-verifies them, and never writes the earlier run.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /research:continue sqlite-wal --fill. Use --root out and --date 2026-01-15.
    There is no network access here, so verify offline.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: opens-a-new-dated-run
    type: file_exists
    path: out/2026-01-15/research/sqlite-wal/index.md

  - name: names-the-prior-run
    type: regex
    target:
      source: file
      path: out/2026-01-15/research/sqlite-wal/index.md
    pattern: 'prior: 2026-01-08'

  - name: carries-the-source
    type: regex
    target:
      source: file
      path: out/2026-01-15/research/sqlite-wal/references/sources.jsonl
    pattern: '"carried_from": "2026-01-08"'

  - name: re-verifies-carried-sources
    type: tool_used
    tool: Bash
    input_match: '\sverify\s[^|;&]*?--run\b'

  - name: never-writes-the-earlier-run
    type: tool_used
    tool: Write
    input_match: 'out/2026-01-08/'
    min: 0
    max: 0
    arm: both

  - name: never-edits-the-earlier-run
    type: tool_used
    tool: Edit
    input_match: 'out/2026-01-08/'
    min: 0
    max: 0
    arm: both
