schema_version: "1.0"
name: 14-assess-vendor-only-high
description: >-
  An assessment criterion rests on one vendor source. The rating carries at
  most medium confidence, however strong the vendor's own claim reads.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /research:assess vendor-z. Use --root out and --date 2026-01-15. There is
    no network access here, so check offline. Rate the Throughput criterion
    from the captured source and write the report.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: caps-vendor-only-confidence
    type: llm
    criteria: >-
      The reply gives the Throughput criterion no more than medium confidence,
      and says the rating rests only on a vendor source (or that an
      independent or measured source is still needed). It does not report
      high confidence for Throughput.
