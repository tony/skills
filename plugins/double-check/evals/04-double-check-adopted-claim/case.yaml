schema_version: "1.0"
name: 04-double-check-adopted-claim
description: >-
  The user already acted on the wrong prior claim by filing a ticket. The
  answer must be re-derived from the file and state the correction once.
tags: [history]

context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl

execution:
  prompt: I already filed a ticket saying the cap is 5, based on your answer. Are you sure? Double-check against the file.
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(double-check:)?double-check"'

  - name: reads-the-file-again
    type: tool_used
    tool: Read
    input_match: 'client\.py'
    arm: both

  - name: cites-the-constant-from-source
    type: regex
    target: last_message
    pattern: 'MAX_RETRIES\s*=\s*3'
    arm: both

  - name: no-revision-verdict-language
    type: regex
    target: last_message
    match: not_contains
    pattern: 'overstated|as I (mentioned|said) (before|earlier)|still holds|verdict update|what changed'
    flags: i
    arm: both

  - name: corrects-the-ticket-once
    type: llm
    focus: last_message
    criteria: |
      The reply tells the user the filed ticket's figure of five is wrong and
      that the file sets the cap to three.
    arm: both

  - name: correction-stays-brief
    type: llm
    focus: last_message
    criteria: |
      The reply is a standalone account of the retry behaviour. It does not
      grade or narrate its earlier answer beyond a single brief correction of
      the ticket's figure.
    arm: both

