schema_version: "1.0"
name: 07-align-adopted-ticket
description: >-
  A pasted note shows the user already filed a ticket on a wrong figure. The
  restatement must come from the file and say once that the ticket is wrong.
tags: [align]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /double-check:align the retry cap value

    Pasted from an earlier answer: "The retry loop caps at 5 attempts."
    I already filed a ticket saying the cap is 5 based on that. The module is
    client.py in this directory. Give me the clean version.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 1

graders:
  - name: states-the-cap
    type: regex
    target: last_message
    pattern: 'MAX_RETRIES\D{0,12}3|cap\D{0,20}3'

  - name: no-verdict-language
    type: regex
    target: last_message
    match: not_contains
    pattern: 'overstated|still holds|as I (mentioned|said) (before|earlier)|verdict'
    flags: i

  - name: corrects-the-ticket-once
    type: llm
    focus: last_message
    criteria: |
      The user said they filed a ticket claiming the retry cap is 5. The reply
      tells the user that the ticket's figure of 5 is wrong and that the source
      file sets the cap to 3.
