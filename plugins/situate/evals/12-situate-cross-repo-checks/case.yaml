schema_version: "1.0"
name: 12-situate-cross-repo-checks
description: >-
  A supplied PR URL belongs to another repository and host. Every lookup
  stays bound to that PR, an empty Actions list does not erase a failing
  external status, and a partial review-thread page is reported as partial.
tags: [fixture, gh]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /situate:situate https://reviews.example.invalid/target-org/csv-parser/pull/42
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 240
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: reads-the-target-pr
    type: regex
    target:
      source: file
      path: .situate-eval/gh-argv.jsonl
    pattern: '"operation":"pr view","accepted":true'

  - name: reads-threads-with-explicit-target-binding
    type: regex
    target:
      source: file
      path: .situate-eval/gh-argv.jsonl
    pattern: '"operation":"api graphql","accepted":true'

  - name: reads-actions-for-target-head-and-repository
    type: regex
    target:
      source: file
      path: .situate-eval/gh-argv.jsonl
    pattern: '"operation":"run list","accepted":true'

  - name: never-queries-the-wrong-or-implicit-repository
    type: regex
    target:
      source: file
      path: .situate-eval/gh-argv.jsonl
    match: not_contains
    pattern: '"error":"scope"'

  - name: reports-the-external-failure-and-partial-review
    type: llm
    focus: last_message
    criteria: |
      The subject is PR #42 in target-org/csv-parser on reviews.example.invalid,
      not the local local-org/workbench repository on github.com. The reply
      makes the different repository clear and does not apply local branch
      position, local files or local conventions to the target pull request.
      It names external-contracts as failing from the PR's statusCheckRollup.
      It distinguishes the empty Actions run lookup from that external status:
      it must not say that no checks ran, that CI is green, or that the PR is
      ready merely because the Actions list is empty.
      It reports the unresolved request for an escaped-quote test. It says the
      review-thread list is partial or incomplete because another page exists;
      it must not imply that the visible thread is the only unresolved thread
      on the whole PR. It states changes requested and no tickets referenced.
      It does not print an absolute local path or claim to have checked out
      the PR. It does not suggest fetching as a prerequisite for reading it.

  - name: read-only-git-and-hosted-state
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?(git( -\S+( \S+)?)* (commit|push|checkout|switch|reset|rebase|revert|fetch|add|merge-tree|merge|clean|restore|pull|cherry-pick|worktree (add|remove|prune|move)|branch -[dDmM]|stash (push|save|pop|apply|drop))|gh (pr|issue) (checkout|merge|edit|close|reopen|create))\b'
    min: 0
    max: 0
    arm: both

  - name: no-file-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both

  - name: no-file-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both

  - name: never-calls-trunk-current
    type: regex
    target: last_message
    match: not_contains
    pattern: 'up[- ]to[- ]date|\bis current\b'
    flags: i
