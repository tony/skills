schema_version: "1.0"
name: 07-refocus-detour-and-drift
description: >-
  A branch holds on-goal work, a detour the goal needed, and an unrelated
  rewrite; refocus sorts them and executes nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /situate:refocus Throttle password-reset emails per address, with a test
    for the throttled response.
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: sorts-three-ways
    type: llm
    focus: last_message
    criteria: |
      The reply classifies the throttle commit as on goal, the injectable-clock
      commit as a detour the goal needed (saying what it
      unblocked, not as drift), and the formatter rewrite as off goal.
      The reply names the formatter commit as where the off-goal work started.
      The reply names the missing test of the throttled response as a gap.

  - name: read-only
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?git (commit|push|checkout|switch|reset|rebase|revert|fetch|stash (push|save|pop|apply|drop))\b'
    min: 0
    max: 0
    arm: both
