schema_version: "1.0"
name: 04-situate-get-oriented
description: >-
  A branch with a local-only remote, no pull request and no ticket IDs;
  the sweep reports each absence instead of omitting it.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /situate:situate Get me oriented on this repo before I touch anything.
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: absence-reporting
    type: llm
    focus: last_message
    criteria: |
      The reply states the pull request as none (or says it cannot be checked
      because the remote is not GitHub), rather than omitting the topic.
      The reply states tickets as none referenced, rather than omitting the
      topic.
      The reply reports the branch's one commit ahead of trunk (the shout
      variant) and invents no other commits, diff, or review thread.
      The reply does not print an absolute path.
