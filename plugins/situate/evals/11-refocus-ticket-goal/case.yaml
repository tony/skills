schema_version: "1.0"
name: 11-refocus-ticket-goal
description: >-
  With no typed goal, refocus takes the goal from the ticket named in the
  branch, walks its acceptance criteria one at a time, and finds the gap
  and the drift.
tags: [fixture, gh]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /situate:refocus
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: reads-the-ticket
    type: tool_used
    tool: Bash
    input_match: 'gh issue view'

  - name: goal-gap-and-drift-from-the-criteria
    type: llm
    focus: last_message
    criteria: |
      The reply says the goal came from the ticket (issue 17) and its
      acceptance criteria, not from a typed argument or the diff.
      The reply names the missing criterion, a test for the throttled
      response, as a gap.
      The reply classifies the commit that rewrites the logging module as
      off goal.

  - name: read-only
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?(git( -\S+( \S+)?)* (commit|push|checkout|switch|reset|rebase|revert|fetch|add|merge|clean|restore|pull|cherry-pick|worktree (add|remove|prune|move)|branch -[dDmM]|stash (push|save|pop|apply|drop))|gh pr (checkout|merge))\b'
    min: 0
    max: 0
    arm: both
