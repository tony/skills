schema_version: "1.0"
name: 03-refocus-goal-drift
description: >-
  A typed goal on a real branch: the reply takes the goal from the argument,
  classifies only commits it read, and names only gaps the goal's words imply.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /situate:refocus Ship password-reset email throttling before touching the
    login rate limiter refactor.
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: goal-and-gap
    type: llm
    focus: last_message
    criteria: |
      The reply says the goal is the one the user stated in the request, not
      one taken from a ticket, pull request, or the diff.
      The reply classifies the throttle commit as on goal and the login rate
      limiter refactor as off goal, naming the refactor commit as where the
      drift started.
      The reply adds no gap about a setting, config, test, or documentation
      the goal does not name. A gap resting on the goal's own words or the
      branch's state (shipping, pushing, a pull request, commits stacked in
      the wrong order) is allowed.
      The reply invents no commits and does not print an absolute path.

  - name: read-only
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?(git( -\S+( \S+)?)* (commit|push|checkout|switch|reset|rebase|revert|fetch|add|merge|merge-tree|clean|restore|pull|cherry-pick|worktree (add|remove|prune|move)|branch -[dDmM]|stash (push|save|pop|apply|drop))|gh (pr|issue) (edit|create|close|reopen|checkout|merge))\b'
    min: 0
    max: 0
    arm: both
