schema_version: "1.0"
name: 08-situate-pr-target
description: >-
  A pull request number as the subject: the sweep reads the pull request
  through gh, never checks it out, and reports the failing check and the
  unresolved review thread.
tags: [fixture, gh]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /situate:situate 42
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: reads-the-pr-through-gh
    type: tool_used
    tool: Bash
    input_match: 'gh pr view'

  - name: never-checks-the-pr-out
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?(git( -\S+( \S+)?)* (checkout|switch|fetch)|gh pr checkout)\b'
    min: 0
    max: 0
    arm: both

  - name: reports-checks-and-threads
    type: llm
    focus: last_message
    criteria: |
      The reply names the failing unit-tests check, and says the review
      thread asks for a test of a field with an escaped quote.
      The reply states the review decision as changes requested, and the
      tickets as none referenced.
      The reply does not print an absolute path or claim to have checked
      out the pull request.
