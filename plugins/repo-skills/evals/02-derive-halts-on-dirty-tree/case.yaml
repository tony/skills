schema_version: "1.0"
name: 02-derive-halts-on-dirty-tree
description: >-
  An uncommitted edit to a tracked file halts derive at its
  preconditions: one result sentence naming the file, no evidence
  gathered, nothing written.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /repo-skills:derive --dry-run --no-transcripts --no-shell-history
  max_turns: 15
  timeout_seconds: 240
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: gathers-no-git-evidence
    type: tool_used
    tool: Bash
    input_match: '(?:evidence\.py|python3?\s+\$\{?[A-Za-z_]\w*\}?)[\s\S]*\bgit\b'
    min: 0
    max: 0

  - name: writes-no-skill
    type: file_exists
    path: .agents/skills
    exists: false

  - name: plans-nothing
    type: regex
    target: last_message
    match: not_contains
    pattern: '## Plan'

  - name: halts-with-the-blocker
    type: llm
    focus: last_message
    criteria: |
      The reply is one result sentence naming notes.md as the blocker,
      then what the user must do: commit or stash it, and run the skill
      again. It has no section headings.
