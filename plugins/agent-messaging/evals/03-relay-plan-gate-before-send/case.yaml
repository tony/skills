schema_version: "1.0"
name: 03-relay-plan-gate-before-send
description: >-
  A target the skill resolved itself from the Codex session index is not
  typed or queued until the user approves the plan.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /agent-messaging:session-relay Tell the Codex session named reviewer that
    the build is green. Codex state lives in ./codex-home and the codex
    binary is ./bin/codex.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: nothing-queued-before-approval
    type: tool_used
    tool: Bash
    input_match: 'codex queue|send-keys|nc\s'
    min: 0
    max: 0
    arm: both

  - name: presents-the-plan
    type: llm
    focus: last_message
    criteria: |
      The reply presents a plan and asks for approval before sending. The
      plan names the resolved target (the reviewer thread), the transport
      (codex queue, with tmux as fallback), the exact one-line payload in a
      bracketed relay envelope, and what counts as delivered. The reply does
      not claim the message was sent or queued.
