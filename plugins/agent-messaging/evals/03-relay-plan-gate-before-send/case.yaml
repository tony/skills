schema_version: "1.0"
name: 03-relay-plan-gate-before-send
description: >-
  A target the skill resolved itself from the Codex session index is not
  typed or queued until the user approves the plan.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /agent-messaging:session-relay Tell the Codex session named reviewer that
    the build is green. Codex state lives in ./codex-home and the codex
    binary is ./bin/codex.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]
  append_system_prompt: >-
    For private input files, use mktemp -d "$PWD/.eval-state/relay.XXXXXX".

runs: 3

graders:
  - name: nothing-queued-before-approval
    type: file_exists
    path: .eval-state/queued
    exists: false
    arm: both

  - name: no-other-transport-before-approval
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"(?:[^"\\]|\\.)*(?:send-keys|\bnc\s)'
    min: 0
    max: 0
    arm: both

  - name: presents-the-plan
    type: llm
    focus: last_message
    criteria: |
      The reply presents a plan and asks for approval before sending. The
      plan names the resolved target (the reviewer thread), the transport
      (codex queue) with the tmux fallback or the reason none applies, the
      exact one-line payload in a bracketed relay envelope, and receiver-side
      evidence for delivery (the payload in the receiver's turn or an
      acknowledgment carrying the relay id). Either receiver-evidence path
      suffices; an unknown sender can use the receiver's transcript without
      offering an acknowledgment route. A requirement to find the exact
      payload in the receiver's turn is enough to rule out queue consumption
      alone; the reply need not discuss every insufficient form of evidence.
      It does not claim the message was sent or queued.
