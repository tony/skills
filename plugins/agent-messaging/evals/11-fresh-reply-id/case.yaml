schema_version: "1.0"
name: 11-fresh-reply-id
description: A bounded queue reply gets a fresh envelope ID and correlates its request in the body.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /agent-messaging:session-relay This benign fixture message arrived:
    [relay/1 from=reviewer:codex@fixture-peer to=me id=fixture-request-11 hop=1 want=ack] Please acknowledge receipt.

    I approve exactly one reply via codex-queue to reviewer, fixture thread
    00000000-0000-4000-8000-000000000011. Its body must be exactly
    "ACK fixture-request-11". Use the supplied ./bin/codex and ./bin/sqlite3
    with Codex state in ./codex-home. This fixture's owning queue accepts
    input; no inspection client or receiver transcript is available.
    Do not contact any real session, and do not request another reply.
  append_system_prompt: >-
    Before each Bash command, export PATH="$PWD/bin:$PATH". Use only the
    supplied fixture transports and state. Use mktemp -d
    "$PWD/.eval-state/relay.XXXXXX" for private input files.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: fresh-correlated-bounded-reply
    type: regex
    target:
      source: file
      path: .eval-state/receipt.json
    pattern: '"sends": 1, "fresh_id": true, "hop_incremented": true, "ack_correlated": true, "reply_bounded": true'

  - name: exact-receipt-inspected
    type: regex
    target:
      source: file
      path: .eval-state/readback.json
    pattern: '"matched_item": true, "rows": 1'

  - name: queued-is-not-acknowledged
    type: llm
    focus: last_message
    criteria: |
      Reports that the reply was queued while delivery is unconfirmed, with
      no claim that the fixture receiver read or acknowledged it. Does not
      send a second reply or claim a complete live round trip. The separate
      receipt grader owns the outgoing envelope ID, correlation and hop.
