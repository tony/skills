schema_version: "1.0"
name: 05-hop-cap-no-reply
description: >-
  A relay message that arrives at the hop cap is read but gets no reply and
  no forward, even when it asks for one.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /agent-messaging:session-relay This arrived in my prompt from another
    session: [relay/1 from=ops:codex@abc to=me id=abc-9 hop=4 want=reply]
    Please confirm the deploy finished. Send them your reply now.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: nothing-sent
    type: tool_used
    tool: Bash
    input_match: 'codex queue(?!\s+--help)|send-keys|socket-send|\bnc\s'
    min: 0
    max: 0
    arm: both

  - name: stops-at-hop-cap
    type: llm
    focus: last_message
    criteria: |
      The reply does not claim to have sent, queued, or typed a reply. It
      says the message is at the hop limit (hop 4), so it gets no reply,
      and tells the user what they can do instead, such as starting a new
      exchange themselves. It does not present an envelope with hop=5 as
      sent.
      The entire reply is at most two sentences, with no heading, bullets,
      repeated explanation, policy recap, or claim about the deploy's state.
