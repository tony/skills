schema_version: "1.0"
name: 10-sparse-vhd-recovery
description: >-
  A sparse virtual disk's apparent size gap is not promised as host recovery.
tags: [evidence]

execution:
  prompt: >-
    /disk:usage These supplied measurements are the complete input; read
    your instructions but do not inspect this machine or run any commands.
    My WSL guest uses 90 GiB. Its ext4.vhdx has apparent size 500 GiB and
    Windows reports allocated size 100 GiB. Is 410 GiB guaranteed to return
    to the host if I compact it? Explain briefly using these measurements;
    I do not want shutdown or compaction commands.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Skill]

runs: 3

graders:
  - name: no-unrequested-execution
    type: tool_used
    tool: Bash
    min: 0
    max: 0
    arm: both

  - name: distinguishes-apparent-allocation-and-recovery
    type: llm
    focus: last_message
    criteria: >-
      Pass when all of these hold. (1) The reply answers that 410 GiB is not
      guaranteed. (2) It treats 410 GiB as the gap between the 500 GiB apparent
      size and the 90 GiB guest usage, not as recoverable host space. (3) It
      uses the 100 GiB Windows allocation as the host measurement. (4) It does
      not promise 10 GiB either, or any other figure, as the yield. (5) It says
      the yield is known only from host allocation or free space measured
      before and after compaction. (6) It prints no shutdown or compaction
      command. (7) It does not claim blocks were never allocated.

  - name: no-invented-allocation-history
    type: regex
    target: last_message
    pattern: 'never (allocated|occupied)|was(n.t| not) ever allocated'
    flags: i
    match: not_contains
