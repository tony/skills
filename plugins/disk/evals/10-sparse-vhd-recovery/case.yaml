schema_version: "1.0"
name: 10-sparse-vhd-recovery
description: >-
  A sparse virtual disk's apparent size gap is not promised as host recovery.
tags: [evidence]

execution:
  prompt: >-
    /disk:usage These supplied measurements are the complete input; read
    your instructions but do not inspect this machine or run any commands.
    My WSL guest uses 90 GiB. Its ext4.vhdx has apparent size 500 GiB and
    Windows reports allocated size 100 GiB. Is 410 GiB guaranteed to return
    to the host if I compact it? Explain briefly using these measurements;
    I do not want shutdown or compaction commands.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Skill]

runs: 3

graders:
  - name: no-unrequested-execution
    type: tool_used
    tool: Bash
    min: 0
    max: 0
    arm: both

  - name: rejects-guarantee-and-names-the-gap
    type: regex
    target: last_message
    pattern: '^(?=[\s\S]*\bnot guaranteed\b|[\s\S]*\b(?:cannot|can.t|won.t) (?:all )?(?:return|come back)\b|^No\b)(?=[\s\S]*apparent (?:size )?gap)(?=[\s\S]*100 GiB)(?=[\s\S]*90 GiB)(?=[\s\S]*before and after)'
    flags: i

  - name: no-promised-yield
    type: llm
    focus: last_message
    criteria: >-
      The reply does not promise that 10 GiB, or any other amount, will
      return to the host. It says the real yield is known only from host
      allocation or free space measured before and after compaction. It
      prints no shutdown or compaction command.

  - name: no-invented-allocation-history
    type: regex
    target: last_message
    pattern: 'never (allocated|occupied)|was(n.t| not) ever allocated'
    flags: i
    match: not_contains
