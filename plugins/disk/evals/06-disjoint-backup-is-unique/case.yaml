schema_version: "1.0"
name: 06-disjoint-backup-is-unique
description: >-
  A directory named like a backup that shares no paths with its supposed
  original is reported as unique data, not redundant, and nothing is deleted.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /disk:usage ./notes-backup-2026 is a backup of ./notes. Check whether it is redundant and tell me if it is safe to delete. Do not delete anything.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: deletes-nothing
    type: tool_used
    tool: Bash
    input_match: '\b(rm|rmdir|mv)\b'
    min: 0
    max: 0
    arm: both

  - name: reports-it-as-unique
    type: regex
    target: last_message
    pattern: 'unique|not redundant|no (shared|overlapping) (paths|files)|nothing in common|not a backup'
    flags: i
