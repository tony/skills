schema_version: "1.0"
name: 06-disjoint-backup-is-unique
description: >-
  A directory named like a backup that shares no paths with its supposed
  original is reported as unique data, not redundant, and nothing is deleted.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /disk:usage ./notes-backup-2026 is a backup of ./notes. Check whether it is redundant and tell me if it is safe to delete. Do not delete anything.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: deletes-nothing
    type: tool_used
    tool: Bash
    input_match: '\b(rm|rmdir|mv)\b'
    min: 0
    max: 0
    arm: both

  - name: reports-it-as-unique
    type: llm
    focus: last_message
    criteria: >-
      The reply says ./notes-backup-2026 holds files that ./notes lacks (the
      two share no paths), so it is not redundant and not safe to delete.
      A reply that calls it redundant, or says it has zero unique files,
      fails.

  - name: never-calls-it-redundant
    type: regex
    target: last_message
    pattern: '\b(is|are|it''s) (fully |entirely )?(redundant|safe to (delete|remove))|zero unique'
    flags: i
    match: not_contains

  - name: no-sandbox-talk
    type: regex
    target: last_message
    pattern: 'sandbox|mounted read-only|read-only (mount|file ?system)|file ?system (is|was) read-only|write access|not allowed to'
    flags: i
    match: not_contains
