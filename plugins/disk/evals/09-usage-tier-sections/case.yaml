schema_version: "1.0"
name: 09-usage-tier-sections
description: >-
  A readable survey of a small tree reports the tier sections in order,
  puts each directory in its tier, and deletes nothing.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /disk:usage . Survey the current directory only, with the size floor set to 0 percent so every directory counts.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: deletes-nothing
    type: tool_used
    tool: Bash
    input_match: '\b(rm|rmdir|mv)\b'
    min: 0
    max: 0
    arm: both

  - name: tier-sections-in-order
    type: regex
    target: last_message
    pattern: '## Regenerable\n[\s\S]*proj/cache[\s\S]*\d[\d.]* (GiB|MiB|KiB)[\s\S]*## Protected\n[\s\S]*agent-home/\.claude/projects[\s\S]*\d[\d.]* (GiB|MiB|KiB)[\s\S]*## Needs a decision\n[\s\S]*notes-2023[\s\S]*\d[\d.]* (GiB|MiB|KiB)'

  - name: unique-not-regenerable
    type: llm
    focus: last_message
    criteria: >-
      The reply does not put notes-2023 under Regenerable or call it safe
      to delete without the user's decision. It treats the session store
      as protected and performs or announces no mutation as part of this
      read-only survey. Offering a future, separately approved reclaim
      pass is allowed; it is not a mutation during the survey.

  - name: no-bold-lead-ins
    type: regex
    target: last_message
    pattern: '^\s*[-*] \*\*'
    flags: im
    match: not_contains

  - name: binary-human-size-units
    type: regex
    target: last_message
    pattern: '\b0\.\d+ GiB|\b[\d,]+ (zero |NUL )?bytes\b|\b\d[\d.]* (GB|MB|KB)\b'
    match: not_contains

  - name: no-sandbox-talk
    type: regex
    target: last_message
    pattern: 'sandbox|mounted read-only|read-only (mount|file ?system)|file ?system (is|was) read-only|write access|not allowed to'
    flags: i
    match: not_contains
