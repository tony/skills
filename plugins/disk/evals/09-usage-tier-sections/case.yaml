schema_version: "1.0"
name: 09-usage-tier-sections
description: >-
  A readable survey of a small tree reports the tier sections in order,
  puts each directory in its tier, and deletes nothing.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /disk:usage . Survey the current directory only, with the size floor set to 0 percent so every directory counts.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: deletes-nothing
    type: tool_used
    tool: Bash
    input_match: '\b(rm|rmdir|mv)\b'
    min: 0
    max: 0
    arm: both

  - name: tier-sections-in-order
    type: llm
    focus: last_message
    criteria: >-
      The reply has level-2 headings "## Regenerable", "## Protected" and
      "## Needs a decision", appearing in that relative order. proj/node_modules
      is under Regenerable; the agent session store is under Protected;
      notes-2023 is under Needs a decision. Each carries a size. A reply that
      puts notes-2023 under Regenerable or calls it safe to delete fails.

  - name: no-bold-lead-ins
    type: regex
    target: last_message
    pattern: '^\s*[-*] \*\*'
    flags: im
    match: not_contains

  - name: no-fractional-gib
    type: regex
    target: last_message
    pattern: '\b0\.\d+ GiB'
    match: not_contains

  - name: no-sandbox-talk
    type: regex
    target: last_message
    pattern: 'sandbox|mounted read-only|read-only (mount|file ?system)|file ?system (is|was) read-only|write access|not allowed to'
    flags: i
    match: not_contains
