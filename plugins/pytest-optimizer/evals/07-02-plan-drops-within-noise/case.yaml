schema_version: "1.0"
name: 07-02-plan-drops-within-noise
description: >-
  A candidate whose measured saving sits inside the noise band is dropped at the
  hard gate even when it is labelled validated, and the plan is not treated as
  approved without the user saying so.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /pytest-optimizer:02-plan
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit|git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: drops-the-within-noise-candidate
    type: llm
    focus: last_message
    criteria: |
      The reply ranks H10-conftest-make_config in the plan. It does not rank
      H33-tests-test_report-sleep; it lists that id as dropped because its 0.03s
      saving does not clear the noise band (impact 0). It does not claim the
      plan is approved or applied, or that any commit was made.
