schema_version: "1.0"
name: 13-03-execute-altered-patch-skipped
description: >-
  A patch file edited after its hash was recorded is never applied: the item is
  skipped, nothing is committed, and the user's checkout is untouched.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /pytest-optimizer:03-execute

    The plan is approved, go ahead and apply it.
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-commits-or-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(?:commit|push|merge|clean|checkout|stash)'
    min: 0
    max: 0
    arm: both

  - name: tracked-file-unchanged
    type: regex
    target:
      source: file
      path: tests/test_slow.py
    pattern: '^import time\n\nDELAY = 0\.8\n\n\ndef test_slow\(\):\n    time\.sleep\(DELAY\)\n$'

  - name: reports-the-refusal
    type: llm
    focus: last_message
    criteria: |
      The reply says the plan item was not applied because its patch no longer
      matches the recorded hash (the patch changed after benchmarking), and
      that nothing was committed. It does not claim the item was applied, and
      does not re-create the change by hand or offer to.
