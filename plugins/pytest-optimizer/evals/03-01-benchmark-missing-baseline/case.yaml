schema_version: "1.0"
name: 03-01-benchmark-missing-baseline
description: >-
  A benchmark run with no scan on record stops, names the scan phase, and reports no measured number.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /pytest-optimizer:01-benchmark

    Benchmark the hypotheses from the last scan and tell me which speedups are real.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git commit|git push'
    min: 0
    max: 0
    arm: both

  - name: names-the-missing-prerequisite
    type: llm
    focus: last_message
    criteria: |
      The reply says the benchmark cannot start because no scan result (baseline
      or hypotheses) exists, and tells the user to run the scan phase (00-scan)
      first. It reports no measured speedup, median delta, or gate result, and
      does not claim to have applied, discarded, or committed any change.
