schema_version: "1.0"
name: 10-pipeline-success-commit
description: >-
  With a validated speedup recorded, an approved plan is applied, verified
  green, and committed locally as one commit, never pushed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /pytest-optimizer:pytest-optimizer --phase=plan

    Plan and apply the benchmarked speedup. I approve the orchestration plan and
    the one-commit plan: lower DELAY in tests/test_slow.py and commit it locally.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 2

graders:
  - name: commits-locally
    type: tool_used
    tool: Bash
    input_match: 'git commit'
    min: 1
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
    arm: both

  - name: reports-the-applied-commit
    type: llm
    focus: last_message
    criteria: |
      The reply says one speedup was applied and committed, gives a commit SHA or
      subject, and gives a measured suite time lower than the 0.8s baseline. It
      does not claim to have pushed anything or to have applied more than one
      change.
