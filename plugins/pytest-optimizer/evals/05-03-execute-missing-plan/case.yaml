schema_version: "1.0"
name: 05-03-execute-missing-plan
description: >-
  An execute run with no plan on record refuses, names the plan phase, and commits nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /pytest-optimizer:03-execute

    Land the approved plan as separate verified commits.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git commit|git push'
    min: 0
    max: 0
    arm: both

  - name: names-the-missing-prerequisite
    type: llm
    focus: last_message
    criteria: |
      The reply says it did not apply anything because there is no plan to
      execute, and tells the user to run the plan phase (02-plan) and approve it.
      It reports no commit SHA or wall-time comparison, and does not claim to
      have applied or committed any item.
