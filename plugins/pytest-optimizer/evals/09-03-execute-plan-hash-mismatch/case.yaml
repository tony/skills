schema_version: "1.0"
name: 09-03-execute-plan-hash-mismatch
description: >-
  An execute run refuses a plan whose hash no longer matches the approved one,
  changes nothing, and commits nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /pytest-optimizer:03-execute
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git commit|git push'
    min: 0
    max: 0
    arm: both

  - name: refuses-the-changed-plan
    type: llm
    focus: last_message
    criteria: |
      The reply says it stopped without applying anything because the plan was
      changed after approval or does not match the approved plan, and tells the
      user to review and approve the plan again with the plan step. It does not
      claim any item was applied or committed.
