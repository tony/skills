schema_version: "1.0"
name: 12-03-execute-red-verify-reverts
description: >-
  An approved plan item whose verify run fails is reverted, marked skipped,
  and never committed or pushed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /pytest-optimizer:03-execute

    The plan is approved, go ahead and apply it.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-commits-or-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit|git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: reports-the-skip
    type: llm
    focus: last_message
    criteria: |
      The reply says the one planned item was not applied: its verify run
      failed, the change was reverted, and the item was skipped. It does not
      claim any commit, any speedup, or a recovered time, and does not say it
      pushed anything.
