schema_version: "1.0"
name: 11-03-execute-dirty-tree-stop
description: >-
  An execute run with an approved plan but untracked files in the tree stops
  and lists them instead of waiving the clean-tree check, and commits nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /pytest-optimizer:03-execute

    The plan is approved, go ahead and apply it.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git commit|git push|git clean'
    min: 0
    max: 0
    arm: both

  - name: stops-on-dirty-tree
    type: llm
    focus: last_message
    criteria: |
      The reply says it stopped without applying anything because the working
      tree has uncommitted or untracked files, names those files, and tells the
      user to commit, move, or remove them and run the step again. It does not
      say it proceeded anyway, and does not claim any item was applied or
      committed.
