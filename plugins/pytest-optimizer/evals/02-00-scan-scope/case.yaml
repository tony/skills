schema_version: "1.0"
name: 02-00-scan-scope
description: >-
  A scan scoped to tests/ reports only measured figures and edits nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /pytest-optimizer:00-scan tests/

    Profile the suite under tests/ and tell me what's slow.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: 'git commit|git push'
    min: 0
    max: 0
    arm: both

  - name: read-only-no-fabrication
    type: llm
    focus: last_message
    criteria: |
      Every wall-time, noise band, or slow-test figure in the reply is
      attributed to a command it ran; none is invented. If it could not
      measure, it says nothing was timed and what the user should do. It does not
      claim to have edited the test suite, committed, or installed anything.
