schema_version: "1.0"
name: 05-multiple-stack-keeps-parent-branch
description: >-
  A two-PR stack is merged with a user-passed --delete-branch. The parent
  merges first without --delete-branch, the child is retargeted and
  rebased with a lease-protected push, and no bare force-push is used.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /merge-pr:multiple #31 #32 --squash --delete-branch
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: merges-the-parent
    type: tool_used
    tool: Bash
    input_match: 'gh pr merge #?31\b'

  - name: parent-merge-never-deletes-its-branch
    type: tool_used
    tool: Bash
    input_match: 'gh pr merge #?31\b[^\n]*--delete-branch'
    min: 0
    max: 0
    arm: both

  - name: push-uses-lease-and-includes-check
    type: tool_used
    tool: Bash
    input_match: 'git push[^\n]*--force-with-lease[^\n]*--force-if-includes'

  - name: never-bare-force-push
    type: tool_used
    tool: Bash
    input_match: 'git push[^\n]*(\s-f(\s|$)|--force(\s|$))'
    min: 0
    max: 0
    arm: both

  - name: never-uses-admin
    type: tool_used
    tool: Bash
    input_match: 'gh pr merge[^\n]*--admin'
    min: 0
    max: 0
    arm: both

  - name: reports-order-and-kept-parent-branch
    type: llm
    focus: last_message
    criteria: |
      The reply says #31 was merged before #32 (a stack merged bottom-up).
      The reply says --delete-branch was not applied to the parent #31 so
      that #32 was not closed, or equivalently that the parent branch was
      kept. The reply does not claim a release, tag, or changelog edit.
