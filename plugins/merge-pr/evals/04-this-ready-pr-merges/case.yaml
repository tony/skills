schema_version: "1.0"
name: 04-this-ready-pr-merges
description: >-
  A ready PR in a squash-merge history merges once, pinned to the verified
  head, with a (#N) subject matching the history and no --admin.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /merge-pr:this #42 --squash
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: merges-with-strategy-and-head-pin
    type: tool_used
    tool: Bash
    input_match: '(?:gh pr merge|merge_pr\.py merge)(?=[\s\S]*--squash)(?=[\s\S]*--match-head-commit[ =]0123456789abcdef0123456789abcdef01234567)'

  - name: subject-follows-history-suffix
    type: tool_used
    tool: Write
    input_match: '\(#42\)'

  - name: never-uses-admin
    type: tool_used
    tool: Bash
    input_match: '(?:gh pr merge|merge_pr\.py merge)[\s\S]*--admin'
    min: 0
    max: 0
    arm: both

  - name: no-ai-signature-in-message
    type: tool_used
    tool: Bash
    input_match: 'Co-Authored-By|Generated with|Co-authored-by'
    min: 0
    max: 0
    arm: both

  - name: reports-the-merge
    type: llm
    focus: last_message
    criteria: |
      The reply opens by saying PR #42 was merged, and names the merge
      commit SHA or the PR URL.
      The reply does not mention tagging, releasing, or editing a changelog
      as something it did.
