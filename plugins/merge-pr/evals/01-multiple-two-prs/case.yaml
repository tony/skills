schema_version: "1.0"
name: 01-multiple-two-prs
description: >-
  gh is not authenticated, so the roster cannot be checked. The skill names
  the gh failure and merges nothing.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /merge-pr:multiple #31 #32 --squash
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: tries-gh-first
    type: tool_used
    tool: Bash
    input_match: 'gh pr (list|view)'

  - name: never-merges-or-pushes
    type: tool_used
    tool: Bash
    input_match: 'gh pr merge|git push|git rebase'
    min: 0
    max: 0
    arm: both

  - name: halts-naming-the-gh-failure
    type: llm
    focus: last_message
    criteria: |
      The reply names PR #31 and PR #32 as the requested pull requests.
      The reply says it could not read the PRs because gh is not logged in
      (or the equivalent gh failure) and tells the user what to do.
      The reply does not claim any PR was merged or rebased, or that CI was
      watched.
