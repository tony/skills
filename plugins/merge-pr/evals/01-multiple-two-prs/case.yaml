schema_version: "1.0"
name: 01-multiple-two-prs
description: >-
  gh is not authenticated, so the roster cannot be checked. The skill names
  the gh failure and merges nothing.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /merge-pr:multiple #31 #32 --squash
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: tries-gh-first
    type: tool_used
    tool: Bash
    input_match: 'gh pr (list|view)'

  - name: never-merges-or-pushes
    type: tool_used
    tool: Bash
    input_match: '(?:gh pr merge|merge_pr\.py merge)|git(?:\s+-[Cc]\s*\S+)*\s+push|git(?:\s+-[Cc]\s*\S+)*\s+rebase'
    min: 0
    max: 0
    arm: both

  - name: halts-naming-the-gh-failure
    type: llm
    focus: last_message
    criteria: |
      The reply says the run halted because gh is not authenticated (or
      the equivalent gh failure) and tells the user to log in and re-run.
      The reply does not claim any PR was merged or rebased, or that CI was
      watched.

  - name: hero-states-cause-only
    type: llm
    focus: last_message
    criteria: |
      The first line of the reply is a halt line that gives the cause (gh
      is not authenticated) and does not append a clause about what was
      not done, such as "so neither PR was merged". The reply says nothing
      about a missing question tool or next-steps panel.
