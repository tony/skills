schema_version: "1.0"
name: 02-this-single-pr
description: >-
  gh is not authenticated, so the PR cannot be read. The skill names the gh
  failure and merges nothing.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /merge-pr:this #42 --squash
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: tries-gh-first
    type: tool_used
    tool: Bash
    input_match: 'gh pr view'

  - name: never-merges-or-pushes
    type: tool_used
    tool: Bash
    input_match: '(?:gh pr merge|merge_pr\.py merge)|git(?:\s+-[Cc]\s*\S+)*\s+push|git(?:\s+-[Cc]\s*\S+)*\s+rebase'
    min: 0
    max: 0
    arm: both

  - name: halts-naming-the-gh-failure
    type: llm
    focus: last_message
    criteria: |
      The reply says PR #42 could not be read because gh is not logged in
      (or the equivalent gh failure) and tells the user what to do.
      The reply does not claim PR #42 was merged, that a merge commit was
      created, or that trunk was synced.
      The reply does not invent PR #42's title, CI status, or diff content.
