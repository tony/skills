schema_version: "1.0"
name: 06-merge-one-auto-queues
description: >-
  A ready PR merged with --auto is only queued: the reply says queued, no
  trunk sync runs, and the reply does not claim the PR merged.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /merge-pr:merge-one #42 --squash --auto
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: passes-auto-through
    type: tool_used
    tool: Bash
    input_match: '(?:gh pr merge|merge_pr\.py merge|\$\{?\w+\}? merge(?= --))(?:(?!merge_pr\.py|\bgh )[\s\S])*--auto'

  - name: no-trunk-sync-for-queued-merge
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(pull|checkout main)'
    min: 0
    max: 0
    arm: both

  - name: never-uses-admin
    type: tool_used
    tool: Bash
    input_match: '(?:gh pr merge|merge_pr\.py merge|\$\{?\w+\}? merge(?= --))(?:(?!merge_pr\.py|\bgh )[\s\S])*--admin'
    min: 0
    max: 0
    arm: both

  - name: reports-queued-not-merged
    type: llm
    focus: last_message
    criteria: |
      The reply opens by saying PR #42 is queued (auto-merge enabled, it
      merges once requirements are met). It does not open with or claim
      that #42 is already merged, and it does not report a post-merge
      trunk sync as done.
