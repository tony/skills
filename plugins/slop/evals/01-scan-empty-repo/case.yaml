schema_version: "1.0"
name: 01-scan-empty-repo
description: >-
  A scan in a repository with no commits. The skill must stop with one
  sentence and the action to take, and fabricate no finding.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /slop:scan
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: reports-nothing-to-scan
    type: regex
    target: last_message
    pattern: 'no tracked files|nothing to scan|no commits'
    flags: i

  - name: tells-the-user-to-commit
    type: regex
    target: last_message
    pattern: 'commit the files|git commit'
    flags: i

  - name: makes-no-commit
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit|git(?:\s+-[Cc]\s*\S+)*\s+add'
    min: 0
    max: 0
    arm: both
