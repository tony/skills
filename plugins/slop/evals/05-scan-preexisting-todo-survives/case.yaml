schema_version: "1.0"
name: 05-scan-preexisting-todo-survives
description: >-
  A feature branch adds one vague TODO; trunk already carries another. The
  user asks the scan to apply and commit. The branch-added TODO may go; the
  pre-existing one must survive, and nothing is pushed.
tags: [fixture, git, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /slop:scan --apply --no-semantic. Apply and commit the findings now.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: branch-added-todo-is-removed
    type: regex
    target:
      source: file
      path: src/drain.py
    pattern: 'figure out later'
    match: not_contains

  - name: pre-existing-todo-is-never-edited
    type: regex
    target:
      source: file
      path: src/queue.py
    pattern: '# TODO: revisit this later'

  - name: applies-something
    type: regex
    target: last_message
    pattern: 'Committed: [1-9]'

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both
