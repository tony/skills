schema_version: "1.0"
name: 08-deslop-apply-rebase-completes
description: >-
  A local-only branch carrying one vague TODO, never pushed. The user passes
  --apply-rebase and picks Apply and autosquash. The skill must back up the
  branch, land the fixup, fold it with autosquash, report the fold, and
  never push.
tags: [fixture, git, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /slop:deslop --apply-rebase. Apply and autosquash.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: runs-apply-sh
    type: tool_used
    tool: Bash
    input_match: 'apply\.sh'
    min: 1
    arm: both

  - name: runs-autosquash
    type: tool_used
    tool: Bash
    input_match: 'autosquash\.py|git(?:\s+-[Cc]\s*\S+)*\s+rebase'
    min: 1
    arm: both

  - name: reports-the-folded-fixups
    type: regex
    target: last_message
    pattern: 'Commits: \d+ \([1-9]\d* fixups? folded\)'

  - name: reports-the-backup-branch
    type: regex
    target: last_message
    pattern: 'Backup branch: \S*pre-deslop'

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both
