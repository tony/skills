schema_version: "1.0"
name: 04-deslop-apply-patches
description: >-
  A local-only branch carrying one vague TODO. The user asks to apply the
  patches now. The skill must back up the branch, run apply.sh to land a
  fixup commit, and never rebase or push.
tags: [fixture, git, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /slop:deslop --apply-patches. Apply the patches now.
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: creates-a-backup-branch
    type: tool_used
    tool: Bash
    input_match: 'git branch .*pre-deslop'
    min: 1
    arm: both

  - name: runs-apply-sh
    type: tool_used
    tool: Bash
    input_match: 'apply\.sh'
    min: 1
    arm: both

  - name: reports-the-applied-fixup
    type: regex
    target: last_message
    pattern: 'fixup'
    flags: i

  - name: reports-the-backup-branch
    type: regex
    target: last_message
    pattern: 'pre-deslop'

  - name: does-not-rebase
    type: tool_used
    tool: Bash
    input_match: 'git rebase'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
    arm: both
