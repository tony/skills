schema_version: "1.0"
name: 06-deslop-pushed-branch-refuses
description: >-
  A clean feature branch whose slop commit is already on its upstream, run
  with the history-rewrite flag. The skill must refuse, name
  --force-rewrite-pushed, and run no rebase.
tags: [fixture, git, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /slop:deslop --apply-rebase
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: names-the-override-flag
    type: regex
    target: last_message
    pattern: '--force-rewrite-pushed'

  - name: says-the-branch-was-pushed
    type: regex
    target: last_message
    pattern: 'pushed|upstream|force-push'
    flags: i

  - name: runs-no-rebase
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+rebase|commit --fixup|git(?:\s+-[Cc]\s*\S+)*\s+commit|--amend|git(?:\s+-[Cc]\s*\S+)*\s+reset'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both
