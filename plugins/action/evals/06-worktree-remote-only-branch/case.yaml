schema_version: "1.0"
name: 06-worktree-remote-only-branch
description: >-
  When the requested branch exists only on origin, the skill asks whether to
  attach to it or pick another name, and creates no worktree.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /action:worktree Add a --dry-run flag to the sync command --branch=feat/x --setup-only
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: creates-no-worktree
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-C \S+ )?worktree add'
    min: 0
    max: 0
    arm: both

  - name: asks-attach-or-rename
    type: llm
    focus: last_message
    criteria: |
      The reply says the branch feat/x already exists on the remote and asks
      the user to choose between attaching to that remote branch and using
      another branch name (or reports it stopped for that decision). It does
      not say a worktree was created.
