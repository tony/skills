schema_version: "1.0"
name: 01-worktree-dry-run-flag
description: >-
  With a real trunk to branch from, the skill derives a branch name from the
  goal rather than inventing a ticket, and sets the work up in a worktree
  outside the current checkout.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  append_system_prompt: >-
    The fixture's bin/git delegates to the real Git binary and records
    worktree creation for grading. Prefix every Bash command with
    export PATH="$PWD/bin:$PATH" while working in the project root.
  prompt: /action:worktree Add a --dry-run flag to the sync command that prints planned actions without executing them --setup-only
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: creates-the-worktree
    type: regex
    target:
      source: file
      path: .eval-state/worktree.json
    pattern: '"source_present":\s*true'

  - name: branch-name-comes-from-the-goal
    type: regex
    target:
      source: file
      path: .eval-state/worktree.json
    pattern: '"branch":\s*"[^"\n]*dry[-_]?run'

  - name: worktree-is-outside-the-checkout
    type: regex
    target:
      source: file
      path: .eval-state/worktree.json
    pattern: '"outside":\s*true'

  - name: invents-no-ticket-id
    type: regex
    target: last_message
    match: not_contains
    pattern: '\b(?!UTF-)[A-Z]{2,}-\d+\b'

  - name: commits-nothing-under-setup-only
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'
    min: 0
    max: 0
    arm: both
