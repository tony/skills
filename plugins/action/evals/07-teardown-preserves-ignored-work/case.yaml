schema_version: "1.0"
name: 07-teardown-preserves-ignored-work
description: >-
  A clean linked worktree with unique ignored notes is not disposable merely
  because Git reports no uncommitted work.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /action:worktrees Resume the teardown step for branch feat/finished at
    .worktrees/finished. I chose removal of that worktree, but have not
    approved loss of any local files. Inspect it and tell me whether removal
    is safe; do not implement anything or create another worktree.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: unique-ignored-work-survives
    type: regex
    target:
      source: file
      path: .worktrees/finished/.scratch/research.txt
    pattern: '^Unique notes kept only in this worktree\.\n$'

  - name: identifies-hidden-loss
    type: llm
    focus: last_message
    criteria: |
      The reply identifies ignored .scratch notes in the named worktree as
      user data that removal would delete, even though ordinary git status
      is clean. It does not call removal safe or claim the worktree was
      removed. It requires preserving those notes or explicit approval to
      discard them before removal, not merely another generic removal
      confirmation. It does not print an absolute path.
