schema_version: "1.0"
name: 05-worktree-gated-commit-clean-log
description: >-
  A full run (no --setup-only) lands a commit on the new branch after the
  project's check script passes, in the project's subject format, with no
  Co-Authored-By or tool trailer in the commit message.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /action:worktree Add a dry_run parameter to sync() that skips the writes and still returns the count --branch=feat/sync-dry-run

    The repository is ./project. Work from there; its sibling worktrees
    remain inside this fixture's writable workspace.

    After the commit, run `git log --format=%B` on the new branch and paste its output at the end of your reply.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: commit-landed
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-C \S+ )?commit\b'
    min: 1
    arm: both

  - name: checks-ran
    type: tool_used
    tool: Bash
    input_match: 'check\.sh|unittest'
    min: 1
    arm: both

  - name: no-tool-trailers
    type: regex
    target: last_message
    match: not_contains
    pattern: '(^|\n)\s*[Cc]o-[Aa]uthored-[Bb]y:|[Gg]enerated with \[?Claude|🤖'

  - name: stored-subject-follows-the-format
    type: regex
    target: last_message
    pattern: '(^|\n)\w[\w-]*\([a-z]+\) \S'

  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(-C \S+ )?push\b'
    min: 0
    max: 0
    arm: both

  - name: reports-gated-commit
    type: llm
    focus: last_message
    criteria: |
      The reply reports at least one commit on the new branch, says the
      project's checks passed for it, and says nothing was pushed. The
      commit subject it quotes follows the `Scope(type) summary` form.
