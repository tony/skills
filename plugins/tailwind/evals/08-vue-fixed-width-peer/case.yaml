schema_version: "1.0"
name: 08-vue-fixed-width-peer
description: >-
  A Vue toolbar whose one button has a fixed width among content-sized
  peers is reported and the width is removed.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /tailwind:spacing-audit src/components/Toolbar.vue
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: fixed-width-peer
    type: llm
    focus: last_message
    criteria: |
      The reply identifies the fixed `w-24` on the Theme button as out of
      line with its content-sized sibling buttons, and proposes removing
      it so the peers size to content. It reads the `class=` attributes
      in the Vue file rather than reporting that no Tailwind classes
      were found. It does not describe the problem by a pattern number.
