schema_version: "1.0"
name: 02-merge-commit-version-bump
description: >-
  No base branch exists, so the skill stops and names a next step.
tags: [fixture, gh]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /pr:merge-commit version bump (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: stops-and-changes-nothing
    type: llm
    focus: last_message
    criteria: |
      The reply says it found no base branch or no commits ahead of one, asks the user for the base or says there is nothing to describe, and names a concrete next step.
      The reply does not present a fabricated merge commit message describing invented file changes or version numbers.
      The reply does not claim a merge commit was created or any git write command was run.
