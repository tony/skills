schema_version: "1.0"
name: 13-rewrite-edit-not-read-back
description: >-
  The user approves the edit, gh pr edit exits zero, but the PR still shows
  the old body when read back. The reply must not claim the update landed and
  must give the restore command for the backup.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /pr:rewrite #17 and apply it with gh pr edit when the draft is ready, I
    approve that edit.
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: edits-once
    type: tool_used
    tool: Bash
    input_match: 'gh pr edit[^\n]*--body-file'
    min: 1
    max: 1

  - name: reads-the-pr-back
    type: tool_used
    tool: Bash
    input_match: 'pr_backup\.py verify'
    min: 1

  - name: never-commits-or-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)'
    min: 0
    max: 0
    arm: both

  - name: does-not-claim-success
    type: llm
    focus: last_message
    criteria: |
      The reply says the PR does not read back as written (or that the edit could not be confirmed).
      The reply gives a command that restores the old description from the backup, such as gh pr edit 17 --body-file with the backup body.md path.
      The reply does not say the description was updated or applied without that qualification.
