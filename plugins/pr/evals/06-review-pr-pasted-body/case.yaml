schema_version: "1.0"
name: 06-review-pr-pasted-body
description: >-
  With gh unauthenticated and a pasted PR body, the skill reviews the pasted
  body and flags brittle details and branch-internal narrative.
tags: [fixture, gh]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /pr:review-pr #42 (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)

    Here's the PR body, in case you can't fetch it from GitHub in this session:

    ## Summary
    - Add retry logic to the sync client so transient network errors don't fail the whole run
    - Bump the HTTP timeout from 5s to 15s

    ## Test plan
    - All 340 tests pass

    ### Fixes
    - The sync client no longer throws on an empty response body

    First I tried wrapping the whole sync loop in a blanket try/except, but that swallowed real errors too, so I narrowed it down to just the retryable exception types.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: flags-brittle-and-narrative
    type: llm
    focus: last_message
    criteria: |
      The reply flags the test count ("All 340 tests pass") as a brittle detail that goes stale, and suggests removing it or replacing it with checklist items.
      The reply questions the "### Fixes" entry (no longer throws on an empty response body): it says the entry only belongs if the bug affected a published release, and otherwise suggests deleting it or folding the fix into the Summary.
      The reply flags the "first I tried... but that swallowed real errors" sentence as first-person narration of the author's process, and suggests cutting it, moving it to a commit message, or rewriting it as a design decision.
      The reply gives at least one concrete markdown snippet as a suggested fix rather than only vague advice like "add more detail."
      The reply does not praise the description's size or proportionality (for example calling it short and suited to the change) while also saying the diff was unavailable.
