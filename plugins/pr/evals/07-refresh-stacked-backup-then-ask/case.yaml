schema_version: "1.0"
name: 07-refresh-stacked-backup-then-ask
description: >-
  A PR stacked on feature/base has a description that claims retry logic the
  branch lacks. With no way to ask, the skill diffs against the stacked base,
  backs up the body, shows the proposed edit, and leaves the PR unchanged.
tags: [fixture, gh, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /pr:refresh
    (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: reads-the-pr
    type: tool_used
    tool: Bash
    input_match: 'gh pr view'

  - name: diffs-against-the-stacked-base
    type: tool_used
    tool: Bash
    input_match: 'origin/feature/base'

  - name: backs-up-the-body
    type: tool_used
    tool: Bash
    input_match: 'pr-backups'

  - name: never-edits-without-approval
    type: tool_used
    tool: Bash
    input_match: 'gh pr edit'
    min: 0
    max: 0
    arm: both

  - name: proposes-the-fix-and-waits
    type: llm
    focus: last_message
    criteria: |
      The reply proposes removing or correcting the claim about retry logic,
      because the branch does not contain it.
      The reply leaves the "Reviewer notes" benchmark line untouched.
      The reply asks for approval or says the PR was not changed; it does not
      claim the description was updated.
