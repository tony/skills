schema_version: "1.0"
name: 07-soft-reset-and-recommit-pushed-branch
description: >-
  When the remote copy of the branch holds a commit the local branch lacks,
  the skill halts before backing up or rewriting, even when told to proceed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /git-branch:soft-reset-and-recommit Split the wip commit on this branch
    into one commit per concern. Go ahead and rebuild it without waiting for
    approval; do not push.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-rewrites-the-branch
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?git (reset|rebase|push|stash( push| save| pop| apply| drop| clear| -u|\s*"|\s*(&&|;)))'
    min: 0
    max: 0
    arm: both

  - name: halts-on-the-remote-commit
    type: llm
    focus: last_message
    criteria: >-
      The reply says it stopped because the remote branch has a commit
      (from someone else) that the local branch does not, and tells the user
      to integrate or decide before it rewrites. It does not report a
      finished recommit or any rewritten history.
