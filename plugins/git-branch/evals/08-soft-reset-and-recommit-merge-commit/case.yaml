schema_version: "1.0"
name: 08-soft-reset-and-recommit-merge-commit
description: >-
  When the branch range holds a merge commit, the skill halts before backing
  up or collapsing, even when told to proceed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /git-branch:soft-reset-and-recommit Split the wip commit on this branch
    into one commit per concern. Go ahead and rebuild it without waiting for
    approval; do not push.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-resets-or-rewrites-the-branch
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?git (reset|rebase|push|stash( push| save| pop| apply| drop| clear| -u|\s*"|\s*(&&|;)))'
    min: 0
    max: 0
    arm: both

  - name: halts-on-the-merge-commit
    type: llm
    focus: last_message
    criteria: >-
      The reply says it stopped because the branch contains a merge commit
      and collapsing would erase the merged work from history, and tells the
      user what to do before trying again. It does not report a finished
      recommit or any rewritten history.
