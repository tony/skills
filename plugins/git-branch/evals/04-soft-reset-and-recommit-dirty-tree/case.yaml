schema_version: "1.0"
name: 04-soft-reset-and-recommit-dirty-tree
description: >-
  With uncommitted changes in the working tree, the skill halts before the
  collapse instead of resetting, stashing, or rewriting history.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /git-branch:soft-reset-and-recommit Split the wip commit on this branch into one commit per concern
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: reports-the-dirty-tree
    type: regex
    target: last_message
    pattern: 'uncommitted|dirty|working tree'
    flags: i

  - name: never-collapses-the-branch
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?git (reset|rebase|push|stash( push| save| pop| apply| drop| clear| -u|\s*"|\s*(&&|;)))'
    min: 0
    max: 0
    arm: both
