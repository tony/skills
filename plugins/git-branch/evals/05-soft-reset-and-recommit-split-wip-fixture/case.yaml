schema_version: "1.0"
name: 05-soft-reset-and-recommit-split-wip-fixture
description: >-
  On a clean local branch with one wip commit, the skill backs up the branch,
  collapses with a soft reset, proves tree equality, and does not push.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /git-branch:soft-reset-and-recommit Split the wip commit on this branch
    into one commit per concern. Go ahead and rebuild it without waiting for
    approval; do not push.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: backs-up-before-collapsing
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+branch .*backup/.*&&\s*git(?:\s+-[Cc]\s*\S+)*\s+reset --soft|(?:branch_gate\.py(?:\\"|'')?|python3?\s+(?:\\"|'')?\$\{?[A-Za-z_]\w*\}?(?:\\"|'')?)\s+backup\s[^"]*--soft-reset'
    min: 1
    arm: both

  - name: reads-series-back-and-checks-authors
    type: tool_used
    tool: Bash
    input_match: '(?:branch_gate\.py(?:\\"|'')?|python3?\s+(?:\\"|'')?\$\{?[A-Za-z_]\w*\}?(?:\\"|'')?)\s+series\s[^"]*--authors-of'
    min: 1
    arm: both

  - name: proves-tree-equality
    type: tool_used
    tool: Bash
    input_match: 'git diff --quiet'
    min: 1
    arm: both

  - name: never-pushes-or-stages-everything
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push|git(?:\s+-[Cc]\s*\S+)*\s+add (-A|\.)(\\"|"|\s)|git(?:\s+-[Cc]\s*\S+)*\s+add --all'
    min: 0
    max: 0
    arm: both

  - name: reports-backup-and-result
    type: llm
    focus: last_message
    criteria: >-
      The reply says the branch was rebuilt as more than one commit, names a
      backup branch, says the final tree matches the original, and says the
      push was left for the user. It does not claim a push happened.
