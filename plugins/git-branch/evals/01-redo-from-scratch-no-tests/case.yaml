schema_version: "1.0"
name: 01-redo-from-scratch-no-tests
description: >-
  On a clean branch with no tests, the redo stops before creating a worktree
  or a backup branch and offers characterization tests.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /git-branch:redo-from-scratch Redo the config parser on this branch from
    scratch with a cleaner approach.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: creates-no-worktree
    type: tool_used
    tool: Bash
    input_match: 'git worktree add'
    min: 0
    max: 0
    arm: both

  - name: creates-no-backup-branch
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(branch|switch -c|checkout -b) [^"]*backup/'
    min: 0
    max: 0
    arm: both

  - name: stops-and-offers-characterization-tests
    type: llm
    focus: last_message
    criteria: >-
      The reply says it stopped because the branch has no tests to act as the
      spec and offers to write characterization tests against the current
      code first, or to rebuild without a mechanical check if the user says
      so. It does not report a finished rewrite, a worktree, or a backup
      branch.
