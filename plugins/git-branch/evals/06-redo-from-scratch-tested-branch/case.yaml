schema_version: "1.0"
name: 06-redo-from-scratch-tested-branch
description: >-
  On a branch whose tests pass, the skill backs up the branch, rebuilds in a
  worktree, copies the spec tests in from the backup without editing them,
  and does not push.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /git-branch:redo-from-scratch Redo the slugify implementation on this
    branch from scratch with a cleaner approach, using its tests as the spec.
    Go ahead and build it without waiting for approval; do not push.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: rebuilds-in-a-worktree
    type: tool_used
    tool: Bash
    input_match: 'git worktree add'
    min: 1
    arm: both

  - name: backs-up-the-original-branch
    type: tool_used
    tool: Bash
    input_match: 'git branch (\\"|")?(backup/|\$)'
    min: 1
    arm: both

  - name: copies-spec-tests-from-the-backup
    type: tool_used
    tool: Bash
    input_match: 'git (checkout|restore) [^"]*backup/[^"]* -- [^"]*test_slugify'
    min: 1
    arm: both

  - name: never-edits-the-spec-tests
    type: tool_used
    tool: Write
    input_match: 'test_slugify'
    min: 0
    max: 0
    arm: both

  - name: never-edits-the-spec-tests-in-place
    type: tool_used
    tool: Edit
    input_match: 'test_slugify'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
    arm: both

  - name: reports-contract-and-backup
    type: llm
    focus: last_message
    criteria: >-
      The reply says the rebuild lives on a new branch separate from the
      original, says the original tests pass unmodified, names a backup
      branch, and says nothing was pushed. It does not claim the original
      branch was rewritten or replaced.
