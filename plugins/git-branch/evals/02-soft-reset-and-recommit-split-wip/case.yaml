schema_version: "1.0"
name: 02-soft-reset-and-recommit-split-wip
description: >-
  Without approval to proceed, the skill stops at the plan: no backup branch,
  no reset, no invented commit list.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /git-branch:soft-reset-and-recommit This branch has one big commit doing
    several things, all mashed into a single "wip stuff" commit. Rebuild the
    branch history so each concern is its own reviewable commit, keeping the
    exact same end result.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: no-backup-or-reset-before-approval
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+reset|git(?:\s+-[Cc]\s*\S+)*\s+branch [^"]*backup/|(?:branch_gate\.py(?:\\"|'')?|python3?\s+(?:\\"|'')?\$\{?[A-Za-z_]\w*\}?(?:\\"|'')?)\s+backup'
    min: 0
    max: 0
    arm: both

  - name: stops-at-the-plan
    type: llm
    focus: last_message
    criteria: >-
      The reply presents a plan or asks for approval before changing
      anything, and does not claim the split or recommit already happened.
