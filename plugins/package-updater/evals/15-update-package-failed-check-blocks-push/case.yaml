schema_version: "1.0"
name: 15-update-package-failed-check-blocks-push
description: >-
  With a go-ahead to commit and push, a named requests bump whose declared
  project check fails because of the bump lands as a local commit and is not
  pushed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /package-updater:update-package requests 2.32.3 --push

    The plan is approved, including the push: move the pin and the lock,
    commit, and push.
    (curl and uv are local stubs that resolve this release: run every command
    with PATH="$PWD/bin:$PATH".)
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: bump-commit-kept
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit: '

  - name: lock-moved
    type: regex
    target:
      source: file
      path: uv.lock
    pattern: '2\.32\.3'

  - name: never-pushes-a-failed-check
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: reports-failed-check-and-no-push
    type: llm
    focus: last_message
    criteria: |
      The reply says the requests bump was committed, names the failing check
      command (./check.sh) and its error, and says nothing was pushed because
      the check failed. It does not claim the checks passed or that anything
      was pushed.
