schema_version: "1.0"
name: 08-update-toolchain-lands-two-commits
description: >-
  With a go-ahead to commit locally, a two-tool .tool-versions bump lands as
  one commit per tool, edited and committed in turn, without staging
  interactively and without pushing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /package-updater:update-toolchain uv 0.8.4 just 1.40.0

    Move both pins in .tool-versions. Go ahead and commit locally without
    waiting for approval; I have not asked you to push.
    (gh, curl and mise are local stubs that resolve these releases: run
    every command with PATH="$PWD/bin:$PATH".)
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: at-least-two-commits
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '(\tcommit: [^\n]*\n[\s\S]*){2}'

  - name: no-third-commit
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    match: not_contains
    pattern: '(\tcommit: [^\n]*\n[\s\S]*){3}'

  - name: each-commit-names-its-tool
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '(?=[\s\S]*\tcommit: (?![^\n]*\bjust\b)[^\n]*\buv\b)(?=[\s\S]*\tcommit: (?![^\n]*\buv\b)[^\n]*\bjust\b)'

  - name: last-commit-links-its-release
    type: regex
    target:
      source: file
      path: .git/COMMIT_EDITMSG
    pattern: 'casey/just/releases/tag/1\.40\.0'

  - name: uv-commit-states-why
    type: regex
    target: trace
    pattern: 'uv 0\.7\.8 (->|to|→) 0\.8\.4[\s\S]{0,400}why:'

  - name: both-pins-moved
    type: regex
    target:
      source: file
      path: .tool-versions
    pattern: '(?=[\s\S]*uv 0\.8\.4)(?=[\s\S]*just 1\.40\.0)'

  - name: never-pushes-or-stages-interactively
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push|git(?:\s+-[Cc]\s*\S+)*\s+add (-p|--patch)|git(?:\s+-[Cc]\s*\S+)*\s+commit (-[a-z]*a[a-z]* |--all)'
    min: 0
    max: 0
    arm: both

  - name: reports-one-commit-per-tool
    type: llm
    focus: last_message
    criteria: >-
      The reply says uv and just were committed separately, one commit for
      each, and that nothing was pushed. It does not describe a single
      commit that moves both tools, and it does not claim a push happened.

  - name: reply-hero-shape
    type: llm
    focus: last_message
    criteria: >-
      The reply opens with a single line starting with a check mark that
      says what landed, and does not open with a first-person sentence. It
      does not explain that a commit message has a why because of a rule,
      and it does not say a commit message "explains" anything.
