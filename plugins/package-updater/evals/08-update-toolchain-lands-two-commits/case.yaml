schema_version: "1.0"
name: 08-update-toolchain-lands-two-commits
description: >-
  With a go-ahead to commit locally, a two-tool .tool-versions bump lands as
  one commit per tool, edited and committed in turn, without staging
  interactively and without pushing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /package-updater:update-toolchain uv 0.8.4 just 1.40.0

    Move both pins in .tool-versions. Go ahead and commit locally without
    waiting for approval; I have not asked you to push.
    (gh, curl and mise are local stubs that resolve these releases: run
    every command with PATH="$PWD/bin:$PATH".)
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: commits-once-per-tool
    type: tool_used
    tool: Bash
    input_match: 'git commit'
    min: 2
    arm: both

  - name: never-pushes-or-stages-interactively
    type: tool_used
    tool: Bash
    input_match: 'git push|git add (-p|--patch)|git commit .*(-a |--all)'
    min: 0
    max: 0
    arm: both

  - name: reports-one-commit-per-tool
    type: llm
    focus: last_message
    criteria: >-
      The reply says uv and just were committed separately, one commit for
      each, and that nothing was pushed. It does not describe a single
      commit that moves both tools, and it does not claim a push happened.
