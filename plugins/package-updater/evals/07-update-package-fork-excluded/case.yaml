schema_version: "1.0"
name: 07-update-package-fork-excluded
description: >-
  A repository named with --repo is a fork of another project. The skill
  reports it as a fork, leaves it out of scope and commits nothing.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /package-updater:update-package just 1.40.0 --repo widgets. Note that
    widgets is my fork of example-org/widgets: gh repo view reports
    isFork true with ADMIN permission.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: commits-nothing
    type: tool_used
    tool: Bash
    input_match: 'git commit|git push'
    min: 0
    max: 0
    arm: both

  - name: reports-fork-and-stops
    type: llm
    focus: last_message
    criteria: |
      The reply says widgets is a fork and that it is out of scope, so
      nothing was changed. It does not claim a commit was made or pushed.

  - name: halt-shape
    type: llm
    focus: last_message
    criteria: |
      The reply is a halt: a stop line, one sentence giving the single
      reason, then a list of options, and nothing else. It has no second
      paragraph and no section headings. Naming the repository, its
      upstream or a release date is fine; it does not narrate commit
      history, authors or remotes, and does not promise later work ("I'll
      then ...", "will be researched").
