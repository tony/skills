schema_version: "1.0"
name: 01-updating-packages-toolchain-bump
description: >-
  Asked to move two toolchain pins and commit each bump, the skill fires and
  keeps uv and just in separate edits and commits.
tags: [fixture, routing]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Move uv and just up to their latest releases in .tool-versions and commit each bump separately.
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(package-updater:)?updating-packages"'
    min: 1
    arm: both

  - name: separate-commits
    type: llm
    focus: last_message
    criteria: |
      The reply never proposes or makes one commit or one edit that moves both
      uv and just; a reply that stops before changing anything passes. Any
      version the reply names as the latest or as confirmed was looked up in
      this run and the reply says where it came from; a version offered from
      memory, or without a source, fails. The reply makes no claim that a
      commit was made unless a commit was actually run in this session.

