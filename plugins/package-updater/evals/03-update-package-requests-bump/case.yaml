schema_version: "1.0"
name: 03-update-package-requests-bump
description: >-
  A named bump on a repository whose pyproject.toml pins requests: the
  version is looked up before it is claimed and nothing is claimed committed
  without a commit. Runs offline, so a halt passes.
tags: [fixture, routing]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /package-updater:update-package requests 2.32.4
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: version-verified-first
    type: llm
    focus: last_message
    criteria: |
      The reply claims no edit or commit to a requests pin unless it read a
      pin file containing requests in this run. Any statement that requests
      2.32.4 is published or confirmed rests on a lookup made in this run,
      and the reply says where it came from; an unsourced confirmation
      fails. The reply does not claim that any commit was made or pushed.

