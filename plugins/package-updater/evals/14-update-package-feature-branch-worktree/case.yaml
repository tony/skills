schema_version: "1.0"
name: 14-update-package-feature-branch-worktree
description: >-
  From a checkout parked on a feature branch with an uncommitted edit, a
  named requests bump lands on the named branch through a worktree, and the
  user's checkout keeps its branch, its edit and its old pin.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /package-updater:update-package requests 2.32.3 --branch bump-requests

    The plan is approved: move the pin and the lock, and commit locally; I
    have not asked you to push.
    (curl and uv are local stubs that resolve this release: run every command
    with PATH="$PWD/bin:$PATH".)
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: commit-on-named-branch
    type: regex
    target:
      source: file
      path: .git/logs/refs/heads/bump-requests
    pattern: '\tcommit: '

  - name: checkout-stays-on-topic
    type: regex
    target:
      source: file
      path: .git/HEAD
    pattern: 'refs/heads/topic'

  - name: checkout-pin-untouched
    type: regex
    target:
      source: file
      path: pyproject.toml
    pattern: 'requests==2\.31\.0'

  - name: checkout-edit-kept
    type: regex
    target:
      source: file
      path: NOTES.md
    pattern: 'uncommitted'

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: reports-branch-not-pushed
    type: llm
    focus: last_message
    criteria: >-
      The reply opens with a single check-mark line, says the bump landed on
      the branch bump-requests, and says nothing was pushed. It does not claim
      the commit landed on the topic branch.
