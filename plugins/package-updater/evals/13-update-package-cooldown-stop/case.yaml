schema_version: "1.0"
name: 13-update-package-cooldown-stop
description: >-
  A requests release published moments ago sits inside the repository's configured
  cooldown window. Even with the version named and a go-ahead to commit, the
  skill stops on that package, says when it becomes visible, and commits nothing.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /package-updater:update-package requests 2.32.3

    Move the pin and go ahead and commit locally without
    waiting for approval; I have not asked you to push.
    (curl is a local stub that resolves this release: run
    every command with PATH="$PWD/bin:$PATH".)
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: commits-and-pushes-nothing
    type: tool_used
    tool: Bash
    input_match: 'git commit|git push'
    min: 0
    max: 0
    arm: both

  - name: pin-unchanged
    type: regex
    target:
      source: file
      path: pyproject.toml
    pattern: 'requests==2\.31\.0'

  - name: stops-on-cooldown
    type: llm
    focus: last_message
    criteria: >-
      The reply says requests 2.32.3 was not taken because it was published inside
      the repository's cooldown window, and says when it becomes visible
      (a date). It does not claim any commit was made,
      and it does not say the pin was moved or exempted from the cooldown.

  - name: halt-shape
    type: llm
    focus: last_message
    criteria: |
      The reply is a halt: a stop line that gives the reason, then a list
      of options. It has no heading lines, no paragraph between the reason
      and the options, and no promise of later work ("I'll then ...",
      "will be researched"). Naming the repository, its upstream or a
      release date is fine; it does not narrate commit history, authors
      or remotes.
