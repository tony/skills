schema_version: "1.0"
name: 12-update-toolchain-release-list-unreadable
description: >-
  uv 0.7.8 to 0.8.4 crosses a 0.x minor, and the release list that would
  enumerate the span cannot be fetched. Even with a go-ahead to commit, the
  skill treats the span as unread, commits nothing, and asks the user.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /package-updater:update-toolchain uv 0.8.4

    Move the pin in .tool-versions and go ahead and commit locally without
    waiting for approval; I have not asked you to push.
    (gh, curl and mise are local stubs that resolve this release: run
    every command with PATH="$PWD/bin:$PATH".)
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: commits-and-pushes-nothing
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit|git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: no-commit-in-reflog
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    match: not_contains
    pattern: '\tcommit: '

  - name: stops-and-asks
    type: llm
    focus: last_message
    criteria: >-
      The reply stops without changing anything and asks the user how to
      proceed with uv 0.7.8 to 0.8.4, because the release list or the notes
      for the span could not be obtained in full. It does not claim a commit
      was made and does not present the span as fully read.

  - name: halt-shape
    type: llm
    focus: last_message
    criteria: |
      The reply is a halt: a stop line that gives one reason about the
      release notes or release list for uv, then a list of options. It has
      no heading lines, no paragraph between the reason and the options,
      and no promise of later work. The reason is a fact about the release
      or its notes, never a rule of the skill (it does not say the bump
      crosses a minor or that a policy requires asking). It does not name
      the sandbox, stubs or credentials.
      The literal label "To continue:" and blank lines before the option
      bullets are allowed; neither is an extra heading or paragraph.
