schema_version: "1.0"
name: 11-update-package-lands-one-commit
description: >-
  With a go-ahead to commit locally, a named requests bump on a scaffolded
  manifest and lock lands as one commit covering the pin site and the lock,
  unpushed.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    /package-updater:update-package requests 2.32.3

    Move the pin and the lock, and go ahead and commit locally without waiting
    for approval; I have not asked you to push.
    (curl and uv are local stubs that resolve this release: run every command
    with PATH="$PWD/bin:$PATH".)
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: commits-once
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    pattern: '\tcommit: '

  - name: no-second-commit
    type: regex
    target:
      source: file
      path: .git/logs/HEAD
    match: not_contains
    pattern: '\tcommit[^\n]*\n[^\n]*\tcommit[^\n]*\n[^\n]*\tcommit'

  - name: lock-moved
    type: regex
    target:
      source: file
      path: uv.lock
    pattern: '2\.32\.3'

  - name: pin-moved
    type: regex
    target:
      source: file
      path: pyproject.toml
    pattern: '2\.32\.3'

  - name: no-trailer-in-commit
    type: regex
    target:
      source: file
      path: .git/COMMIT_EDITMSG
    match: not_contains
    pattern: '[Cc]o-[Aa]uthored-[Bb]y|[Gg]enerated with'

  - name: commit-body-links-release
    type: regex
    target:
      source: file
      path: .git/COMMIT_EDITMSG
    pattern: 'https://\S*requests\S*2\.32\.3'

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
    arm: both

  - name: reports-one-commit-not-pushed
    type: llm
    focus: last_message
    criteria: |
      The reply reports one commit moving requests from 2.31.0 to 2.32.3 and
      says nothing was pushed. It does not mention that the commit omits a
      Co-Authored-By trailer or why, and it does not report that curl or
      uv are stubs.

