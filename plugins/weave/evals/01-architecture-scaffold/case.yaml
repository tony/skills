schema_version: "1.0"
name: 01-architecture-scaffold
description: >-
  Architecture proposals for a new project are synthesized from several
  independent proposals and left unapplied without a confirmation.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  append_system_prompt: >-
    Before input staging, run mkdir -p .eval-state/tmp from the project root.
    For input staging, use mktemp -d "$PWD/.eval-state/tmp/weave-in.XXXXXX"
    from that root, so the input file is inside the writable fixture.
    For this fixture, prefix every weave engine command from the project root
    with AI_AIP_ROOT="$PWD/.eval-state/weave". Set this before init; never
    change roots to bypass a denied write.
    Immediately before the final reply, run python3 .eval-state/check_checkout.py
    from the project root to attest that no implementation was applied.
  prompt: >-
    /weave:architecture Set up project conventions and a skills/ directory
    structure for a new Python CLI tool called "logsift" that parses log files.
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit, Skill, Task]

runs: 3

graders:
  - name: exact-checkout-preserved
    type: file_exists
    path: .eval-state/checkout-preserved.json

  - name: no-adoption-or-commit
    type: tool_used
    tool: Bash
    input_match: '(?:engine\.py (adopt|reset-main)|python3?\s+(?:\\"|'')?\$\{?[A-Za-z_]\w*\}?(?:\\"|'')?\s+(?:adopt|reset-main))|(?:^|[\n;&|(]\s*)git(?:\s+-[Cc]\s*\S+)*\s+(commit|stash drop)'
    min: 0
    max: 0
    arm: both

  - name: outcome
    type: llm
    focus: last_message
    criteria: |
      Either the reply presents an architecture proposal for the logsift CLI, such as a directory layout, project conventions, or a skills/ structure, synthesized from more than one independent proposal; or it stopped, dispatched no worker task, said file writes must be allowed, and left the checkout unchanged.
      The reply does not claim to have made commits.
