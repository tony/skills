schema_version: "1.0"
name: 17-review-report-shape
description: >-
  A review of a branch with a retry defect opens with a hero line, uses only
  the declared headings, tags findings with consensus, and keeps bullets plain.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  append_system_prompt: >-
    Before input staging, run mkdir -p .eval-state/tmp from the project root.
    For input staging, use mktemp -d "$PWD/.eval-state/tmp/weave-in.XXXXXX"
    from that root, so the input file is inside the writable fixture.
    This fixture stores weave sessions in .eval-state/weave inside
    the project. Before the first init and on every engine command, set
    AI_AIP_ROOT="$PWD/.eval-state/weave" for that command. This is
    the configured session root, not a fallback after a denied write.
    After persisting the final review and before replying, run
    python3 .eval-state/collect_review.py to copy its raw evidence for grading.
  prompt: >-
    /weave:review --workers=subagents --passes=1 focus on error handling in
    the charge retry path
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Bash, Read, Glob, Grep, Write, Task, Skill]

runs: 3

graders:
  - name: hero-first
    type: llm
    focus: last_message
    criteria: |
      The reply's first line is a hero: it starts with "⚠" followed by a count of blockers before merge, or with "✓ No blockers". No sentence about what was run comes before it.
      Every markdown heading in the reply is one of Scores, Verified Issues, Critical, Important, Suggestions, False Positives Rejected, Reviewer Disagreements, Critic Findings, Confidence Evolution, Summary, or Attribution.
      Headings from the main list appear in that relative order.

  - name: findings-and-bullets
    type: llm
    focus: last_message
    criteria: |
      The reply reports the unbounded retry in src/payments.py (no attempt limit, no backoff growth, or swallowing every exception) as a finding, citing the file.
      Every finding in Verified Issues, including Important and Suggestions, carries a consensus tag such as "consensus 3/3", "consensus 2/3", or "consensus 1/3". Omit tags only when one reviewer responded, which the reply must state.
      The reply never says a severity was promoted or raised because reviewers agreed.
      No bullet starts with a bold label. Repository-relative finding paths are required; absolute machine paths and session-artifact paths are forbidden.
      Verified Issues and the blocker count exclude claims that depend on unknown client defaults or server behavior; any such risks remain explicitly unverified in Summary.

  - name: consensus-evidence
    type: llm
    focus:
      source: file
      path: .eval-state/review-evidence.json
    criteria: |
      Compare the synthesis's Verified Issues against the raw per-reviewer outputs in this fixture-collected JSON. A finding's consensus numerator counts reviewers who actually reported that issue, and its denominator is the number who responded. The participant list alone is not evidence that a reviewer reported a finding. It never claims three-reviewer agreement on an issue only the host added.
      Agreement alone never raises severity: a unanimous Suggestion remains a Suggestion unless verification supplies a concrete higher-impact reason independent of reviewer count.
