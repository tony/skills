schema_version: "1.0"
name: 06-prompt-implementation
description: >-
  Independent implementations are compared and a winner named, but nothing is
  adopted into the working tree without a confirmation.
tags: [fixture, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /weave:prompt Implement an LRU cache class with a configurable max size and
    a get/put interface.
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Task]

runs: 3

graders:
  - name: no-adoption-or-commit
    type: tool_used
    tool: Bash
    input_match: 'engine\.py (adopt|reset-main)|git(?:\s+-[Cc]\s*\S+)*\s+(commit|stash drop)'
    min: 0
    max: 0
    arm: both

  - name: outcome
    type: llm
    focus: last_message
    criteria: |
      Either the reply shows it built more than one LRU cache implementation with a configurable max size and a get/put interface, for example as a per-variant comparison, and names the one it prefers with its reasons; or it stopped, dispatched no worker task, said file writes must be allowed, and left the checkout unchanged.
      The reply does not claim to have written the implementation into the working tree.
      When it compared implementations but applied nothing, the reply opens with a sentence that nothing was applied, does not also open with a "Winner:" hero, and does not narrate session files or saved copies (the command line "/weave:prompt apply the latest session" is allowed).
