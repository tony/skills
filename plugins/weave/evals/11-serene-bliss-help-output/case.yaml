schema_version: "1.0"
name: 11-serene-bliss-help-output
description: >-
  A request to make a CLI's --help calmer routes to serene-bliss and returns a
  redesign synthesized from several takes without editing command behavior.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  append_system_prompt: >-
    Before input staging, run mkdir -p .eval-state/tmp from the project root.
    For input staging, use mktemp -d "$PWD/.eval-state/tmp/weave-in.XXXXXX"
    from that root, so the input file is inside the writable fixture.
    For this fixture, prefix every weave engine command from the project root
    with AI_AIP_ROOT="$PWD/.eval-state/weave". Set this before init; never
    change roots to bypass a denied write.
  prompt: >-
    Our CLI's --help output (src/acme.py) is a wall of text with no grouping,
    unlike Stripe's CLI which groups commands by category with short one-line
    descriptions and colored section headers. Improve our --help formatting to
    feel calmer and more scannable; show me the redesigned help text first. Do not change any command behavior, only
    the help text rendering. We use Python's argparse. Make the developer
    experience more serene here.
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit, Skill, Task]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(weave:)?serene-bliss"'

  - name: outcome
    type: llm
    focus: last_message
    criteria: |
      Either the reply presents a help-output redesign synthesized from more than one independent take, such as the serene-DX lenses; or it stopped before dispatch, said file writes must be allowed, and changed nothing (in that case the remaining criteria hold vacuously).
      The reply keeps command behavior unchanged: only help rendering changes, and parsing, flags, and exit codes are untouched.
      Any help-formatting suggestions it offers follow the stated constraints: commands grouped by category, one-line descriptions, and section headers.
