schema_version: "1.0"
name: 06-rebase-restore-conflict-after-continue
description: >-
  A rebase with a mechanical conflict, then saved edits that conflict after
  continuation finishes. The skill keeps the exact stash, reports its SHA,
  and never drops or pops it.
tags: [fixture, git, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /rebase:rebase
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: rebases-with-the-recovery-helper
    type: tool_used
    tool: Bash
    input_match: 'replay\.py["\x27]?\s+start\b'

  - name: continues-through-the-recovery-helper
    type: tool_used
    tool: Bash
    input_match: 'replay\.py["\x27]?\s+continue\b'

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: never-hard-resets
    type: tool_used
    tool: Bash
    input_match: 'reset --hard'
    min: 0
    max: 0
    arm: both

  - name: never-drops-clears-or-pops-the-stash
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+stash (drop|clear|pop)'
    min: 0
    max: 0
    arm: both

  - name: reports-the-stash-sha
    type: regex
    target: last_message
    pattern: 'stash[^\n]{0,120}\b([0-9a-f]{40}|(?=[0-9a-f]*[0-9])[0-9a-f]{7,39})\b'
    flags: i

  - name: reports-the-kept-stash
    type: llm
    focus: last_message
    criteria: |
      The reply says the rebase finished and that restoring the uncommitted
      change to notes.txt conflicted, so the stash was kept and not dropped.
      The reply does not claim the uncommitted change was lost, committed,
      or that anything was pushed.
      It leaves the unresolved content and resulting staging pending the
      user's choice. It does not guarantee that every possible choice will
      leave an unstaged edit; choosing trunk may leave no edit at all.
      It does not suggest dropping the retained stash after resolution.

  - name: hero-warns-of-conflicted-file
    type: regex
    target: last_message
    pattern: '^⚠'
    flags: m

  - name: has-recovery-section
    type: regex
    target: last_message
    pattern: '^## Recovery'
    flags: m

  - name: no-bold-label-bullets
    type: regex
    target: last_message
    pattern: '^- \*\*'
    flags: m
    match: not_contains

  - name: unresolved-edits-next-step
    type: regex
    target: last_message
    pattern: 'Next: resolve notes\.txt, inspect a changed patch, or done\.\s*$'
