schema_version: "1.0"
name: 05-rebase-already-up-to-date
description: >-
  A branch that already contains the trunk tip. The skill reports that there
  is nothing to rebase and changes nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /rebase:rebase
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-rebases
    type: tool_used
    tool: Bash
    input_match: 'git (pull --rebase|rebase)'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
    arm: both

  - name: never-hard-resets
    type: tool_used
    tool: Bash
    input_match: 'reset --hard'
    min: 0
    max: 0
    arm: both

  - name: reports-nothing-to-rebase
    type: llm
    focus: last_message
    criteria: |
      The reply says the branch is already up to date with the trunk, so there
      is nothing to rebase.
      The reply does not claim to have rebased or pushed anything.

  - name: stopped-shape
    type: regex
    target: last_message
    pattern: '^⚠ Stopped'
    flags: m
