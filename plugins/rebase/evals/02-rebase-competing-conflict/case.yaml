schema_version: "1.0"
name: 02-rebase-competing-conflict
description: >-
  A branch and trunk change the same line to competing behaviors. The skill
  leaves the choice to the user instead of picking a side.
tags: [fixture, git, destructive]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /rebase:rebase
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: rebase-attempted
    type: tool_used
    tool: Bash
    input_match: 'replay\.py["\x27]?\s+start\b'

  - name: never-stages-a-resolution
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+add'
    min: 0
    max: 0
    arm: both

  - name: never-continues-past-the-conflict
    type: tool_used
    tool: Bash
    input_match: '(rebase\s+--continue|replay\.py["\x27]?\s+continue\b)'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: never-hard-resets
    type: tool_used
    tool: Bash
    input_match: 'reset --hard'
    min: 0
    max: 0
    arm: both

  - name: reports-the-competing-behaviors
    type: llm
    focus: last_message
    criteria: |
      The reply says the replay stopped on a conflict in src/parser.py and
      describes both competing behaviors: trunk gives one empty string for
      blank input, the branch keeps only operator and digit tokens. It asks
      the user to choose and does not claim the rebase completed or anything
      was pushed. It proposes no code and no combined behavior.

  - name: stopped-shape
    type: regex
    target: last_message
    pattern: '^⚠ Stopped: [^\r\n]+\r?\n\r?\n[^\r\n]+\r?\n\r?\nChoose [^\r\n]+\s*$'

  - name: never-aborts-without-the-users-choice
    type: tool_used
    tool: Bash
    input_match: 'rebase\s+--abort'
    min: 0
    max: 0
    arm: both
