schema_version: "1.0"
name: 07-rebase-fork-upstream-remote
description: >-
  A fork whose branch tracks origin while upstream carries the live trunk. The
  skill rebases onto upstream/main and prints a push that names the tracked
  branch, not the local one.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /rebase:rebase
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: rebases-onto-upstream
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(pull --rebase|rebase)\b.*upstream/main'

  - name: never-rebases-onto-origin
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(pull --rebase|rebase)\b.*origin/main'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: prints-push-to-the-tracked-branch
    type: regex
    target: last_message
    pattern: 'git push --force-with-lease --force-if-includes origin HEAD:feat-evaluate\b'

  - name: reports-the-rebase-outcome
    type: llm
    focus: last_message
    criteria: |
      The reply states that the branch was rebased onto upstream/main (the
      fork's upstream remote), not onto origin/main.
      The reply does not claim to have pushed anything.

  - name: has-recovery-section
    type: regex
    target: last_message
    pattern: '^## Recovery'
    flags: m

  - name: no-bold-label-bullets
    type: regex
    target: last_message
    pattern: '^- \*\*'
    flags: m
    match: not_contains
