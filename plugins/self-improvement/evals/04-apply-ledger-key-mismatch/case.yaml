schema_version: "1.0"
name: 04-apply-ledger-key-mismatch
description: >-
  A ledger saved against an older catalog HEAD no longer verifies. Apply stops
  before editing and tells the user to sweep again.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /self-improvement:apply f1 --ledger ledger.json. Apply finding f1 to the
    catalog.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: stops-on-stale-ledger
    type: llm
    criteria: >-
      The reply says nothing was applied because the ledger is out of date:
      it was saved at an older catalog commit, the catalog changed, or the
      key does not verify. It tells the user to sweep again. It does not
      claim to have edited a skill or made a commit.

  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0

  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0

  - name: tree-unchanged
    type: regex
    target:
      source: file
      path: catalog/tidy/SKILL.md
    pattern: '^---\nname: tidy\ndescription: "Use when tidying files."\n---\n\n# Tidy\n\nRemove stray files.\n$'
