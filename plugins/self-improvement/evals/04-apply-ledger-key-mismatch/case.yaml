schema_version: "1.0"
name: 04-apply-ledger-key-mismatch
description: >-
  A ledger saved against an older catalog HEAD no longer verifies. Apply stops
  before editing and tells the user to sweep again.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /self-improvement:apply f1 --ledger ledger.json. Apply finding f1 to the
    catalog.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: stops-on-stale-ledger
    type: llm
    criteria: >-
      The reply says the ledger no longer matches the catalog, because the
      catalog changed or the ledger key does not verify, and tells the user to
      sweep again. It does not claim to have edited a skill or made a commit.

  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0

  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0

  - name: no-shell-writes
    type: tool_used
    tool: Bash
    input_match: '(sed\s+(-[a-zA-Z]*i|--in-place)|(?<![0-9&>=-])>>?(?![=&])\s*(?!/dev/null)\S|\btee\b|git\s+(commit|add|stash|checkout|reset))'
    min: 0
    max: 0
