schema_version: "1.0"
name: 05-apply-dirty-tree
description: >-
  A valid ledger but a tracked file with uncommitted edits. Apply stops at the
  clean-tree check and edits nothing.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /self-improvement:apply f1 --ledger ledger.json. Apply finding f1 to the
    catalog.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: stops-on-dirty-tree
    type: llm
    criteria: >-
      The reply says the working tree has uncommitted changes and tells the
      user to commit or stash them before applying. It does not claim to have
      edited a skill or made a commit.

  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0

  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0

  - name: no-shell-writes
    type: tool_used
    tool: Bash
    input_match: '(sed\s+(-[a-zA-Z]*i|--in-place)|(?<![0-9&>=-])>>?(?![=&])\s*(?!/dev/null)\S|\btee\b|git\s+(commit|add|stash|checkout|reset))'
    min: 0
    max: 0

  - name: ignores-unrelated-untracked-files
    type: llm
    criteria: >-
      The reply blames only the modified skill file. It does not name
      dotfiles or editor or host directories as blockers and does not advise
      committing them.
