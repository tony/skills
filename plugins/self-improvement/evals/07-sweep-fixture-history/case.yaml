schema_version: "1.0"
name: 07-sweep-fixture-history
description: >-
  A two-skill catalog and a fixture history that invokes only demo:used. The
  sweep counts from the fixture and names demo:idle as never invoked.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /self-improvement:sweep. Use history.jsonl in this directory as the prompt
    history, and treat the skill-tool channel as unavailable on this host.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: names-the-never-invoked-skill
    type: llm
    focus: last_message
    criteria: >-
      The reply has a Usage section that ranks demo:used first with 12
      invocations and names demo:idle as never invoked. It states that the
      skill-tool channel was not counted.

  - name: no-bold-lead-ins
    type: regex
    target: last_message
    match: not_contains
    pattern: '^\s*-\s+\*\*'
    flags: m

  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
