schema_version: "1.0"
name: 03-neg-sweep-garage-floor
description: >-
  A request to sweep a garage floor is not a request to mine prompt history.
  The sweep skill does not run.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    sweep the floor in the garage
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: addresses-request
    type: llm
    focus: last_message
    criteria: >-
      The reply responds to the literal request about a garage floor, for
      example by saying it cannot do physical cleaning or by asking what was
      meant. It does not run a skill sweep, report invocation counts, or
      produce a findings ledger.

  - name: not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(self-improvement:)?sweep"'
    min: 0
    max: 0
    arm: both
