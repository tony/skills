schema_version: "1.0"
name: 07-report-org-wide-missing-adoption
description: >-
  An org-wide report on a run whose register lacks five projection inputs
  halts naming every missing input, defaults none to 1.0, and writes no
  report.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /business:report-org-wide out/2026-06-30/business/lean-tighten
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: no-report-written
    type: file_exists
    path: out/2026-06-30/business/lean-tighten/reports/org-wide.md
    exists: false

  - name: halts-on-missing-multipliers
    type: llm
    focus: last_message
    criteria: >-
      The reply stops without a projection and says the assumptions
      register lacks projection inputs, naming every one that the scaffold
      register does not hold: drafts (instances) per engineer per year,
      baseline minutes per draft, savings rate, adoption, and realization,
      in plain words or by register id. It does not name the already
      registered population as missing, does not assume a value of 1.0 for
      adoption or realization, and does not invent a value for any input.

  - name: no-default-1-0-multiplier-entry
    type: regex
    target:
      source: file
      path: out/2026-06-30/business/lean-tighten/assumptions.yaml
    match: not_contains
    pattern: 'id:\s*(?:adoption|realization)[\w-]*\n(?:[ \t]+\S.*\n)*?[ \t]+value:\s*1(?:\.0+)?\s*$'
    flags: m
