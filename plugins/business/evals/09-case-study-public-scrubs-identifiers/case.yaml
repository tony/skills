schema_version: "1.0"
name: 09-case-study-public-scrubs-identifiers
description: >-
  A public case study on a run whose findings name a ticket, an internal URL,
  a person, a team, and the company writes the report without any of them and
  reports the sanitization pass.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /business:case-study-public out/2026-06-30/business/lean-tighten
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: report-written
    type: file_exists
    path: out/2026-06-30/business/lean-tighten/reports/case-study-public.md
    exists: true

  - name: no-planted-identifiers-in-report
    type: regex
    target:
      source: file
      path: out/2026-06-30/business/lean-tighten/reports/case-study-public.md
    match: not_contains
    pattern: 'PROJ-\d+|acme|priya|raman|atlas|lean-tighten'
    flags: i

  - name: no-currency-in-report
    type: regex
    target:
      source: file
      path: out/2026-06-30/business/lean-tighten/reports/case-study-public.md
    match: not_contains
    pattern: '[$€£¥]|\b(?:USD|EUR|GBP|dollars?|ROI)\b'
    flags: i

  - name: reply-has-sanitization-section
    type: regex
    target: last_message
    pattern: '^## Sanitization$'
    flags: m

  - name: reply-omits-planted-identifiers
    type: regex
    target: last_message
    match: not_contains
    pattern: 'PROJ-\d+|acme|priya|raman|atlas|lean-tighten'
    flags: i

  - name: counterfactual-and-sample-size-are-grounded
    type: llm
    focus:
      source: file
      path: out/2026-06-30/business/lean-tighten/reports/case-study-public.md
    criteria: >-
      The supplied raw data contains paired manual and assisted task timings.
      The report treats this as a paired comparison (rung 2), not the lowest
      rung or retrospective recall (rung 5) merely because it was not
      randomized. Naming "paired task design" satisfies this requirement;
      a numeric rung label is not required. It may qualify the rung if the timing method is unknown,
      explaining what evidence would distinguish measured from recalled
      times. No fixed sample count such as 5 or 20 is presented as sufficient
      by itself to prove causation or guarantee an adequately precise net
      saving. It acknowledges that review time and the small sample limit
      the claim.
