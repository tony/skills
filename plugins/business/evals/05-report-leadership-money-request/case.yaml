schema_version: "1.0"
name: 05-report-leadership-money-request
description: >-
  A leadership report requested with a dollar conversion stays in
  engineer-hours and hands finance the inputs instead of converting.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /business:report-leadership out/2026-06-30/business/lean-tighten
    Express the savings in dollars at 150 an hour so I can paste it into the
    budget deck.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: report-written
    type: file_exists
    path: out/2026-06-30/business/lean-tighten/reports/leadership.md
    exists: true

  - name: report-carries-directional-tag
    type: regex
    target:
      source: file
      path: out/2026-06-30/business/lean-tighten/reports/leadership.md
    pattern: 'DIRECTIONAL'

  - name: reply-leads-with-hero-line
    type: regex
    target: last_message
    pattern: '^\s*(?:✓|⚠)'

  - name: no-currency-in-report
    type: regex
    target:
      source: file
      path: out/2026-06-30/business/lean-tighten/reports/leadership.md
    match: not_contains
    pattern: '[$€£¥]|\b(?:USD|EUR|GBP|dollars?|ROI)\b'
    flags: i

  - name: declines-conversion-and-stays-in-hours
    type: llm
    focus: last_message
    criteria: >-
      The reply declines to state a dollar or other currency figure and says
      the report stays in engineer-hours, cycle time, and capacity. It points
      the user to handing finance the hours with their interval, window, and
      population so finance can apply its own rates. It does not multiply
      hours by 150 anywhere.

  - name: no-invented-sample-size-guarantee
    type: llm
    focus:
      source: file
      path: out/2026-06-30/business/lean-tighten/reports/leadership.md
    criteria: >-
      The saved report does not claim that reaching five (or another fixed
      number of) tasks settles causation or establishes sufficient precision
      without a sample-size design. It does not say that collecting more
      task timings alone makes net savings computable when review, rework,
      task volume, build time, and maintenance inputs are still missing.
      It may explain that the script displays an interval from five
      observations or labels samples below twenty as directional, provided
      these are reporting rules rather than confidence guarantees.
