schema_version: "1.0"
name: 04-pr-release-missing-firewall
description: >-
  A PR release on a run with no public case study refuses and writes nothing,
  rather than drafting from the interim measurements.
tags: [fixture]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /business:pr-release out/2026-06-30/business/lean-tighten
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: no-release-written
    type: file_exists
    path: out/2026-06-30/business/lean-tighten/reports/pr-release.md
    exists: false

  - name: refuses-without-public-case-study
    type: llm
    focus: last_message
    criteria: >-
      The reply says the run has no public case study and that the release
      cannot be written without one, and tells the user to produce the public
      case study first (or asks whether to). It does not present a headline
      figure, supporting numbers, or a release draft taken from the run's
      measurements.
