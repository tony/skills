schema_version: "1.0"
name: 02-action-fix-findings
description: >-
  Typed findings reach the screening gate on a clean repository: each finding
  gets one verdict before any fix lands, and the reply states which screening
  path ran.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /respond:action --on-fail=stop Fix the review findings below on this
    branch: 1. parse_retry_after in src/retry.py throws a ValueError when the
    header has no numeric value; add a fallback to 5 seconds. 2. Typo in the
    log message: 'recieved' should be 'received'.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-blanket-stages
    type: tool_used
    tool: Bash
    input_match: 'git add (-A|--all|\.)( |$)|commit[^|;&]* -a'
    min: 0
    max: 0
    arm: both

  - name: screens-before-fixing
    type: llm
    focus: last_message
    criteria: >-
      The reply says how the findings were screened (an existing ledger, a
      fresh check run, or inline screening) and gives exactly one outcome per
      finding (fixed, deferred, or declined), never "fix if X".

  - name: no-home-halt
    type: llm
    focus: last_message
    criteria: >-
      The reply does not say it stopped because the repository is rooted at
      the home directory.
