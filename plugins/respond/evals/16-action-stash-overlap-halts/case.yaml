schema_version: "1.0"
name: 16-action-stash-overlap-halts
description: >-
  The user's stashed edit sits in the file a finding targets; the run does not
  edit that file or commit, and the stashed work is back in the tree at the end.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /respond:action --on-fail=stop Fix this review finding on the current
    branch: delay in src/retry.py raises ValueError when the header is not
    numeric; fall back to 5 seconds. My uncommitted edit in src/retry.py is
    unrelated work: stash it first and restore it when you finish.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: user-edit-is-back-in-the-tree
    type: regex
    target:
      source: file
      path: src/retry.py
    pattern: 'work in progress'

  - name: does-not-edit-the-stashed-file
    type: tool_used
    tool: Edit
    input_match: 'src/retry\.py'
    min: 0
    max: 0
    arm: both

  - name: does-not-write-the-stashed-file
    type: tool_used
    tool: Write
    input_match: 'src/retry\.py'
    min: 0
    max: 0
    arm: both

  - name: no-commit-over-the-stash
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'
    min: 0
    max: 0
    arm: both
