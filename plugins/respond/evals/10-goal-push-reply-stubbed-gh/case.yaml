schema_version: "1.0"
name: 10-goal-push-reply-stubbed-gh
description: >-
  The GitHub-writing steps of the loop, a push and a posted reply, run against
  a stubbed gh: the reply is posted from a file, never through shell quoting or
  a heredoc, and no thread is resolved.
tags: [fixture, gh, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /respond:goal 7 --push --reply --max-rounds=1 Screen the open review
    comment on pull request 7. Posting the drafted replies is confirmed. (gh
    is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: posts-a-reply
    type: regex
    target:
      source: file
      path: gh-writes.log
    pattern: '(--body-file|body=@)'

  - name: reply-never-inlined-in-the-command
    type: regex
    target:
      source: file
      path: gh-writes.log
    match: not_contains
    pattern: '(--body |-f body=|-F body=[^@])'

  - name: never-resolves-or-forces
    type: tool_used
    tool: Bash
    input_match: 'resolveReviewThread|--force|push[^|;&]* -f\b'
    min: 0
    max: 0
    arm: both

  - name: reports-the-reply
    type: llm
    focus: last_message
    criteria: >-
      The reply says the comment was declined or deferred and that its reply
      was posted. It does not claim a thread was resolved or anything was
      force-pushed.
