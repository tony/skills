schema_version: "1.0"
name: 03-goal-run-review-loop
description: >-
  With no pull request and no feedback, the loop halts at its precondition on
  a clean repository, without a push, a CI watch, or a commit.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /respond:goal --max-rounds=2 Keep running the review-and-CI loop on this
    branch until nothing new comes back. (gh is a local stub: run every
    command with
    PATH="$PWD/bin:$PATH".)
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-pushes-or-commits
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+(push|commit)'
    min: 0
    max: 0
    arm: both

  - name: halts-for-missing-pr-or-feedback
    type: llm
    focus: last_message
    criteria: >-
      The reply says the loop did not run and names the missing pull request
      or missing feedback as the reason, then tells the user what to do next,
      such as opening a pull request or supplying feedback to screen. It does
      not claim a push, a CI watch, or a commit, and it does not say it
      stopped because the repository is rooted at the home directory.
