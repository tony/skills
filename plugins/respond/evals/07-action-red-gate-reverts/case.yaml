schema_version: "1.0"
name: 07-action-red-gate-reverts
description: >-
  A fix whose project test gate fails is reverted, not committed, and under
  --on-fail=stop the run halts and says so.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /respond:action --on-fail=stop Fix this review finding on the current
    branch: delay in src/retry.py raises ValueError when the header is not
    numeric; fall back to 5 seconds.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-commits-on-red
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'
    min: 0
    max: 0
    arm: both

  - name: reports-red-gate-and-stop
    type: llm
    focus: last_message
    criteria: >-
      The reply says the test gate failed, says the fix was reverted or not
      committed, and says it stopped. It does not claim the finding was fixed
      or any commit landed.
