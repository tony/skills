schema_version: "1.0"
name: 14-goal-quiet-round-pushes-and-waits
description: >-
  A pull request with no review feedback and a local commit the remote lacks:
  under --push the round with nothing to fix still pushes the commit and waits
  on CI before it reports the loop finished.
tags: [fixture, gh, gated]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /respond:goal 7 --push --max-rounds=1 Run the review loop on pull request
    7. (gh is a local stub: run every command with PATH="$PWD/bin:$PATH".)
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  - name: pushes-the-unpushed-commit
    type: regex
    target:
      source: file
      path: push.log
    pattern: 'refs/heads/feature/cache-reads'

  - name: reads-ci-after-the-round
    type: regex
    target:
      source: file
      path: gh-calls.log
    pattern: 'pr (checks|view [^\n]*statusCheckRollup)'

  - name: never-forces
    type: tool_used
    tool: Bash
    input_match: '--force|push[^|;&]* -f\b|push[^|;&]* \+'
    min: 0
    max: 0
    arm: both
