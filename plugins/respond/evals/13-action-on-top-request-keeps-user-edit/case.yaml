schema_version: "1.0"
name: 13-action-on-top-request-keeps-user-edit
description: >-
  The user asks the fix to run on top of an uncommitted edit that the
  project's formatter rewrites and a red test gate follows; the edit must
  survive in the working tree, whether the run stashes, halts, or proceeds.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /respond:action --on-fail=stop Fix this review finding on the current
    branch: delay in src/retry.py raises ValueError when the header is not
    numeric; fall back to 5 seconds. Leave my uncommitted edit in notes.txt
    where it is and work on top of it.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - name: user-edit-survives
    type: regex
    target:
      source: file
      path: notes.txt
    pattern: 'half-finished thought'

  - name: no-commit-on-a-red-gate
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'
    min: 0
    max: 0
    arm: both
