schema_version: "1.0"
name: 06-check-preexisting-defer
description: >-
  A finding about code that predates the branch is deferred, not fixed, and
  screening edits nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /respond:check Screen this review comment on the current branch: "sync_all
    in src/sync.py is too long; split it into smaller functions."
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: never-edits-or-commits
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit|git(?:\s+-[Cc]\s*\S+)*\s+add|git(?:\s+-[Cc]\s*\S+)*\s+rebase|git(?:\s+-[Cc]\s*\S+)*\s+reset|sed -i'
    min: 0
    max: 0
    arm: both

  - name: defers-preexisting
    type: llm
    focus: last_message
    criteria: >-
      The reply gives the sync_all finding the single verdict defer, because the
      function was already present before this branch began. It does not mark
      the finding fix.
