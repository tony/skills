schema_version: "1.0"
name: 03-rewrite-dirty-tree-stops
description: >-
  A dirty working tree fails the rewrite precondition. The skill names it,
  stops, and touches neither history nor files.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /changelog:rewrite-aggressively --commit
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit]

runs: 3

graders:
  - name: never-rebases-resets-or-commits
    type: tool_used
    tool: Bash
    input_match: 'git rebase|git reset|git commit|git branch +changelog|push --force'
    min: 0
    max: 0
    arm: both

  - name: changelog-left-as-found
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: 'first draft'

  - name: names-the-dirty-tree-and-claims-nothing
    type: llm
    focus: last_message
    criteria: |
      The reply stops, names the uncommitted changes in the working tree as the
      reason, and tells the user what to do (commit or stash them, then re-run).
      It does not claim to have rebased, dropped any commit, or committed.
