schema_version: "1.0"
name: 05-rewrite-approved-drops-commit
description: >-
  With explicit approval of the rewrite and --commit, the skill backs up the
  branch, drops the changelog-only commit, leaves code untouched, and lands one
  fresh commit, in the project's own commit format, without tool trailers.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /changelog:rewrite-aggressively --commit
    Yes, drop that changelog commit and rewrite the entries.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: drops-the-draft-commit-through-the-helper
    type: tool_used
    tool: Bash
    input_match: '(?:rewrite\.py drop|python3?\s+(?:\\"|'')?\$\{?[A-Za-z_]\w*\}?(?:\\"|'')?\s+drop)'
    min: 1
    arm: both

  - name: draft-entry-is-gone
    type: regex
    target:
      source: file
      path: CHANGES.md
    match: not_contains
    pattern: 'first draft'
    flags: i

  - name: changelog-gains-a-ping-entry
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: 'ping'
    flags: i

  - name: code-is-untouched
    type: regex
    target:
      source: file
      path: src/ping.py
    pattern: 'return "PONG"'

  - name: does-not-copy-the-draft-pr-number
    type: regex
    target:
      source: file
      path: CHANGES.md
    match: not_contains
    pattern: '#2\b'

  - name: commits-once
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+commit'
    min: 1
    max: 1
    arm: both

  - name: no-tool-trailers
    type: tool_used
    tool: Bash
    input_match: 'Co-Authored-By|Generated with'
    min: 0
    max: 0
    arm: both

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git(?:\s+-[Cc]\s*\S+)*\s+push'
    min: 0
    max: 0
    arm: both

  - name: reports-backup-and-project-commit
    type: llm
    focus: last_message
    criteria: |
      The reply says the old changelog commit was dropped, names the backup
      branch, and says one new commit was added at the tip. The commit subject
      follows the project's Scope(type[detail]) format, such as CHANGES(docs),
      rather than docs(CHANGES). It does not claim a push or say code changed.

  - name: no-double-quoted-message
    type: regex
    target: last_message
    match: not_contains
    pattern: '--message "'
