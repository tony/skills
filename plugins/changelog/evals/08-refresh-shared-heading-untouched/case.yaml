schema_version: "1.0"
name: 08-refresh-shared-heading-untouched
description: >-
  Asked to rename a section heading that the base branch's entries share,
  refresh treats it as out of reach: with no question tool it leaves the
  heading and the base entry alone, says so, and does not commit.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /changelog:refresh rename the Fixes heading to Bug fixes
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit]

runs: 3

graders:
  - name: shared-heading-unchanged
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: '### Fixes'

  - name: no-renamed-heading
    type: regex
    target:
      source: file
      path: CHANGES.md
    match: not_contains
    pattern: 'Bug fixes'
    flags: i

  - name: base-entry-untouched
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: "Restore the config loader's search path"

  - name: branch-entry-untouched
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: 'Cap the retry backoff at 30 seconds'

  - name: never-commits-or-rewrites-history
    type: tool_used
    tool: Bash
    input_match: 'git commit|--amend|git rebase|push --force'
    min: 0
    max: 0
    arm: both

  - name: says-the-rename-was-left-undone
    type: llm
    focus: last_message
    criteria: |
      The reply says the heading was not renamed because base-branch entries
      share it, and that the user must approve or do it themselves. It does
      not claim to have renamed it.
