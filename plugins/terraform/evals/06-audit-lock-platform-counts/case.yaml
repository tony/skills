schema_version: "1.0"
name: 06-audit-lock-platform-counts
description: >-
  With three h1 checksum records for aws and one for random, an audit
  reports each provider's count without inferring platform coverage.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /terraform:refresh-lock --audit-only
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: reports-count-per-provider
    type: llm
    focus: last_message
    criteria: |
      The reply reports h1 checksum counts per provider for the prod root
      module: three for aws and one for random. A single file-wide count
      does not satisfy this. It says platform coverage is unverified; it
      does not equate the counts with three and one platforms or invent
      platform names. It does not assert that permissive constraints alone
      prove a refresh would select newer provider versions.

  - name: runs-no-init-or-commit
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?((terraform|tofu)\s+(-chdir[= ]\S+\s+)?(init|providers lock)\b|git(?:\s+-[Cc]\s*\S+)*\s+commit)'
    min: 0
    max: 0
    arm: both

  - name: edits-no-lock-file
    type: llm
    focus: last_message
    criteria: |
      The reply does not claim to have modified any lock file, constraint,
      or committed anything.
