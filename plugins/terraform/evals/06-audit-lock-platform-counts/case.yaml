schema_version: "1.0"
name: 06-audit-lock-platform-counts
description: >-
  With a lock tracking three platforms for aws and one for random, an audit
  reports the platform count per provider and changes nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /terraform:refresh-lock --audit-only
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: reports-count-per-provider
    type: llm
    focus: last_message
    criteria: |
      The reply reports the platform count per provider for the prod root
      module: aws tracks three platforms and random tracks one. A single
      count for the whole lock file does not satisfy this.

  - name: runs-no-init-or-commit
    type: tool_used
    tool: Bash
    input_match: 'terraform[^|\n]*\b(init|providers lock)\b|tofu[^|\n]*\b(init|providers lock)\b|git commit'
    min: 0
    max: 0
    arm: both

  - name: edits-no-lock-file
    type: llm
    focus: last_message
    criteria: |
      The reply does not claim to have modified any lock file, constraint,
      or committed anything.
