schema_version: "1.0"
name: 02-bump-provider-audit
description: >-
  An audit in a repository with no Terraform files reports nothing to audit
  and writes nothing, even when the user pastes a constraint into the prompt.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    /terraform:bump-provider aws --audit-only

    Here is the current constraint:

    ```hcl
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "~> 5.60.0"
        }
      }
    }
    ```
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: no-terraform-files-reported
    type: llm
    focus: last_message
    criteria: |
      The reply reports that the repository has no Terraform configuration
      declaring the aws provider to audit (the pasted block is not a file in
      the repository).
      The reply claims no lock file refresh, edit, or commit.
      The reply names no aws provider version as confirmed published unless
      it states how it confirmed it, and invents no `.terraform.lock.hcl`
      contents.

  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)\b'
    min: 0
    max: 0
    arm: both
