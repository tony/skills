schema_version: "1.0"
name: 15-provider-bump-root-module-strands-root
description: >-
  A bump limited to one root module that would raise a child module shared
  with an excluded root stops and names that root instead of editing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /terraform:bump-provider random 3.7.0 --root-module infra/prod. Go ahead
    and make the edits and commit. I confirmed 3.7.0 is published, and a
    local mirror stands in for the registry.
  max_turns: 30
  timeout_seconds: 540
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: shared-child-left-alone
    type: regex
    target:
      source: file
      path: modules/net/versions.tf
    pattern: 'version\s*=\s*"~> 3\.6\.0"'

  - name: staging-lock-left-alone
    type: regex
    target:
      source: file
      path: infra/staging/.terraform.lock.hcl
    pattern: 'version\s*=\s*"3\.6\.0"'

  - name: no-commit-or-push
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)\b'
    min: 0
    max: 0
    arm: both

  - name: names-excluded-root
    type: llm
    focus: last_message
    criteria: |
      The reply says the run did not proceed because infra/staging also calls
      modules/net, which the bump would edit, and offers widening the scope
      to include infra/staging (or leaving the shared module alone). It does
      not report a commit.
