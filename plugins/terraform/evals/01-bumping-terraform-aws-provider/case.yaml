schema_version: "1.0"
name: 01-bumping-terraform-aws-provider
description: >-
  Root and child module constrain the aws provider differently; a bump
  request reports the drift and moves both declarations together.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: The aws provider constraint in our terraform config is way behind, move it up.
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(terraform:)?bumping-terraform"'

  - name: drift-reported
    type: llm
    focus: last_message
    criteria: |
      The reply flags that the root module (`~> 4.60.0`) and the child module
      (`~> 4.55.0`) already disagree about the aws provider constraint, and
      calls this out as drift before or while proposing a change.
      The reply says both declarations of the provider will move together
      (as one change), not just the root module's. A reply that stops for
      a missing version still passes if it says this.
      The reply names no specific new aws provider version as confirmed
      published unless it states how it confirmed it, and claims no `init`
      run.

  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?git (commit|push)\b'
    min: 0
    max: 0
    arm: both

  - name: edits-nothing-before-approval
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
