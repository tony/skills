schema_version: "1.0"
name: 04-refresh-lock-audit
description: >-
  An audit in a repository with no Terraform files finds no lock file and
  no root module, and writes nothing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /terraform:refresh-lock --audit-only

    Tell me which root modules have a lock file that can be refreshed.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: no-lock-found
    type: llm
    focus: last_message
    criteria: |
      The reply says it found no root module and no `.terraform.lock.hcl`
      file in this repository, rather than inventing lock file contents.
      The reply claims no constraint edit, `terraform init`, lock file
      change, or commit.

  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?git (commit|push)\b'
    min: 0
    max: 0
    arm: both
