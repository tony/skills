schema_version: "1.0"
name: 12-provider-bump-root-and-child
description: >-
  A root module and a child module constrain random at different levels; a
  named bump moves both declarations in one commit and the lock lands exactly.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /terraform:bump-provider random 3.7.0. Go ahead: edit the constraints,
    refresh the lock, and commit. I confirmed 3.7.0 is published, and a
    local mirror stands in for the registry.
    The mirror's packages are stubs that cannot run, so `validate` fails
    on them; that failure alone does not block the commit.
  max_turns: 30
  timeout_seconds: 540
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: root-constraint-moved
    type: regex
    target:
      source: file
      path: infra/prod/versions.tf
    pattern: 'version\s*=\s*"~> 3\.7\.0"'

  - name: child-constraint-moved
    type: regex
    target:
      source: file
      path: modules/net/versions.tf
    pattern: 'version\s*=\s*"~> 3\.7\.0"'

  - name: constraints-in-one-commit
    type: llm
    focus: last_message
    criteria: |
      The reply says a single commit holds both constraint edits
      (infra/prod and modules/net) together with the refreshed lock, and
      names the commit by subject. It does not describe separate commits for
      the constraints and the lock, and does not report a push.

  - name: lock-holds-exact-version-and-both-platforms
    type: regex
    target:
      source: file
      path: infra/prod/.terraform.lock.hcl
    pattern: 'version\s*=\s*"3\.7\.0"(?=[\s\S]*"h1:4gtorahqPQTGoaaETTFzFj53XqersCL\+KbVki4w6rMQ=")(?=[\s\S]*"h1:fUMHaOwEvkrr8nDYxJVWkJnEiP2wyMIBITkSTngnt6o=")'

  - name: no-push
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+push\b'
    min: 0
    max: 0
    arm: both

  - name: reports-both-sites-and-lock
    type: llm
    focus: last_message
    criteria: |
      The reply says the constraints in infra/prod and modules/net both moved
      to 3.7.0 and that the infra/prod lock selects random 3.7.0 with two h1
      checksum records before and after. It reports successful package checks
      for the CI-declared linux_amd64 and darwin_arm64 names, separately from
      checksum counts. It does not infer coverage from counts alone, claim
      3.7.1 was selected, or report unapproved checksum loss as committed.

  - name: hero-follows-shape
    type: llm
    focus: last_message
    criteria: |
      The first line of the reply is exactly a hero of the form
      `✓ hashicorp/random 3.6.1 -> 3.7.0 across N root modules` (singular "root module" when N is 1) with nothing appended after it (no "but", no failing
      gate); any failure appears in a later section.

  - name: drift-does-not-restate
    type: llm
    focus: last_message
    criteria: |
      If the reply has a `## Drift` section, none of its bullets repeats a
      fact already stated in `## Sites`, `## Target`, or `## Locks`. A
      reply with no `## Drift` section satisfies this. Any version after
      `terraform` in the hero is an exact version or `mixed`, never a range.
