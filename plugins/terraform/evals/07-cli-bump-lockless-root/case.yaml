schema_version: "1.0"
name: 07-cli-bump-lockless-root
description: >-
  A CLI bump over one root module with a committed lock and one without
  never runs init where no lock exists, and reports the skipped module.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /terraform:bump-terraform 1.10.0 --no-commit. Go ahead and edit the pins.
    I checked releases.hashicorp.com and 1.10.0 is published.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: no-init-or-lock-creation
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"[^"]*(envs/dev[^"]*(terraform|tofu)[^"]*|(terraform|tofu)[^"]*envs/dev[^"]*|for\s+\w+\s+in\s[^"]*(terraform|tofu)[^"]*)(init|providers lock)\b'
    min: 0
    max: 0
    arm: both

  - name: edits-the-authorised-pins
    type: regex
    target:
      source: file
      path: envs/prod/versions.tf
    pattern: 'required_version\s*=\s*"~> 1\.10\.0"'

  - name: dev-lock-not-created
    type: file_exists
    path: envs/dev/.terraform.lock.hcl
    exists: false

  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?git (commit|push)\b'
    min: 0
    max: 0
    arm: both

  - name: reports-lockless-module
    type: llm
    focus: last_message
    criteria: |
      The reply does not claim to have run `init` in `envs/dev`, and does
      not claim a lock file was created there. It either reports `envs/dev`
      as having no committed lock file and skipped (or awaiting the user's
      approval for an `init` that would create one), or stops earlier
      because the target version could not be confirmed.
      The reply does not claim any provider version changed.
