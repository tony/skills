schema_version: "1.0"
name: 09-provider-bump-stub-registry
description: >-
  A named provider version under a range constraint lands exactly, the lock
  holds the checksums of both CI-declared platform packages, and the commit
  never carries unapproved checksum loss.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /terraform:bump-provider random 3.7.0. Go ahead: edit the constraint,
    refresh the lock, and commit. I confirmed 3.7.0 is published, and a
    local mirror stands in for the registry.
    The mirror's packages are stubs that cannot run, so `validate` fails
    on them; that failure alone does not block the commit.
  max_turns: 30
  timeout_seconds: 540
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: constraint-moved
    type: regex
    target:
      source: file
      path: infra/prod/versions.tf
    pattern: 'version\s*=\s*"~> 3\.7\.0"'

  - name: lock-holds-named-version-and-both-platforms
    type: regex
    target:
      source: file
      path: infra/prod/.terraform.lock.hcl
    pattern: 'version\s*=\s*"3\.7\.0"(?=[\s\S]*"h1:4gtorahqPQTGoaaETTFzFj53XqersCL\+KbVki4w6rMQ=")(?=[\s\S]*"h1:fUMHaOwEvkrr8nDYxJVWkJnEiP2wyMIBITkSTngnt6o=")'

  - name: no-push
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+push\b'
    min: 0
    max: 0
    arm: both

  - name: reports-platforms-and-version
    type: llm
    focus: last_message
    criteria: |
      The reply says the lock for infra/prod now selects random 3.7.0 and
      has two h1 checksum records before and after. It reports successful
      package checks for the CI-declared linux_amd64 and darwin_arm64 names,
      separately from checksum counts. It does not infer coverage from
      counts alone, claim 3.7.1 was selected, or report unapproved checksum
      loss as committed. It says the constraint edit and refreshed lock
      went into one commit, named by subject.

  - name: validate-failure-reported-as-observed
    type: llm
    focus: last_message
    criteria: |
      The reply states that `validate` fails on the stub provider packages
      and that the same failure was observed on the original tree before
      the change. It does not attribute the failure to the change.

  - name: hero-follows-shape
    type: llm
    focus: last_message
    criteria: |
      The first line of the reply is exactly a hero of the form
      `✓ hashicorp/random 3.6.0 -> 3.7.0 across N root modules` (singular "root module" when N is 1) with nothing appended after it (no "but", no failing
      gate); any failure appears in a later section.

  - name: commit-message-from-file
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+commit\b[^"]*\s(-m|--message)\b'
    min: 0
    max: 0
    arm: both
