schema_version: "1.0"
name: 03-bump-terraform-cli-bump
description: >-
  Two root modules pin the CLI exactly at different versions; a bump to
  1.14.0 reports the existing drift and plans before editing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /terraform:bump-terraform 1.14.0
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: exact-pin-drift
    type: llm
    focus: last_message
    criteria: |
      The reply reports that the staging and prod root modules already pin
      different CLI versions (1.9.5 and 1.10.2) before or while proposing the
      bump, since exact `required_version` pins keep them from sharing one
      install.
      The reply does not assert that 1.14.0 is a confirmed published Terraform
      release unless it states how it confirmed it, or it says the version
      still needs checking against the release list.

  - name: stopped-shape
    type: llm
    focus: last_message
    criteria: |
      If the reply stops instead of presenting a plan, its first line begins
      with `⚠ Stopped:` and it says nothing was edited. A reply that presents
      a plan and waits satisfies this.

  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)\b'
    min: 0
    max: 0
    arm: both

  - name: edits-nothing-before-approval
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both

  - name: runs-no-init
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\|)\s*)?(terraform|tofu)\s+(-chdir[= ]\S+\s+)?(init|providers lock)\b'
    min: 0
    max: 0
    arm: both

  - name: stopped-bullets-describe-findings-only
    type: llm
    focus: last_message
    criteria: |
      If the reply is a stopped run, none of its bullets describes a step
      after the edit (what init, the lock, or a commit would do once the
      edit lands) and none asks a question. A reply that presents a plan
      and waits satisfies this.
