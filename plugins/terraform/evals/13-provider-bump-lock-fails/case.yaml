schema_version: "1.0"
name: 13-provider-bump-lock-fails
description: >-
  A bump whose lock refresh fails after the constraint edit commits nothing,
  leaves the lock as committed, and reports the stopped state.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /terraform:bump-provider random 3.7.0. Go ahead: edit the constraint,
    refresh the lock, and commit. I confirmed 3.7.0 is published, and a
    local mirror stands in for the registry.
  max_turns: 30
  timeout_seconds: 540
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: no-commit-or-push
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)\b'
    min: 0
    max: 0
    arm: both

  - name: lock-left-as-committed
    type: regex
    target:
      source: file
      path: infra/prod/.terraform.lock.hcl
    pattern: 'version\s*=\s*"3\.6\.0"[\s\S]*"h1:aaa=",\s*"h1:bbb="'

  - name: constraint-edit-left-in-working-tree
    type: regex
    target:
      source: file
      path: infra/prod/versions.tf
    pattern: 'version\s*=\s*"~>\s*3\.7\.0"'

  - name: stopped-and-nothing-committed
    type: llm
    focus: last_message
    criteria: |
      The first line begins with `⚠ Stopped:` and says nothing was committed.
      The next step offers reverting the constraint edit in the working tree.
      The reply does not claim the lock now selects 3.7.0.
      The reply does not say what the agent will itself do later (an
      instruction telling the user what to do next, such as adding the
      build to the mirror and asking for a rerun, is allowed) and lists
      no absences such as a missing backend, lock file or CI step. Saying
      the mirror lacks 3.7.0 is the reason for the stop and is allowed.

  - name: no-question-in-a-bullet
    type: llm
    focus: last_message
    criteria: |
      None of the reply's bullets asks the user a question or asks them for
      anything.
