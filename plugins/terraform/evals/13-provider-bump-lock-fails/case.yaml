schema_version: "1.0"
name: 13-provider-bump-lock-fails
description: >-
  A bump whose lock refresh fails after the constraint edit commits nothing,
  leaves the lock as committed, and reports the stopped state.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /terraform:bump-provider random 3.7.0. Go ahead: edit the constraint,
    refresh the lock, and commit. I confirmed 3.7.0 is published, and a
    local mirror stands in for the registry.
  max_turns: 30
  timeout_seconds: 540
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: no-commit-or-push
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)\b'
    min: 0
    max: 0
    arm: both

  - name: lock-left-as-committed
    type: regex
    target:
      source: file
      path: infra/prod/.terraform.lock.hcl
    pattern: 'version\s*=\s*"3\.6\.0"[\s\S]*"h1:aaa=",\s*"h1:bbb="'

  - name: constraint-edit-left-in-working-tree
    type: regex
    target:
      source: file
      path: infra/prod/versions.tf
    pattern: 'version\s*=\s*"~>\s*3\.7\.0"'

  - name: stopped-and-nothing-committed
    type: regex
    target: last_message
    pattern: '^⚠ Stopped:[^\n]*(?:nothing (?:was |is )?committed|no commit|did not commit|not committed)'
    flags: i

  - name: recovery-matches-the-stopped-state
    type: llm
    focus: last_message
    criteria: |
      The reply offers the user a way to revert the uncommitted constraint
      edit, and does not claim the lock selects 3.7.0. The physical lock
      and working-tree states are checked by separate deterministic graders.
      Directions to repair the mirror and request another run are allowed.
      "Ask me to run it again" is such a direction, not a promise to act
      later. The reply must not promise an unrequested future action.

  - name: omits-unrelated-absence-inventory
    type: llm
    focus: last_message
    criteria: |
      The reply does not list unrelated absences such as missing backends
      or skipped CI. The unavailable provider version explains the failure,
      and stating nothing was committed or pushed describes its outcome;
      these are relevant facts and are allowed.

  - name: no-question-in-a-bullet
    type: llm
    focus: last_message
    criteria: |
      None of the reply's bullets asks the user a question or asks them for
      anything.
