schema_version: "1.0"
name: 16-refresh-lock-gate-fails-after-edit
description: >-
  A refresh moves random to 3.7.1 and restores both platforms, then the
  repository's own check script rejects the new version; the run stops with
  the refreshed lock uncommitted.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /terraform:refresh-lock Go ahead and commit the result. A local mirror
    stands in for the registry.
  max_turns: 30
  timeout_seconds: 540
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Skill]

runs: 3

graders:
  - name: no-commit-or-push
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"([^"]*(&&|;|\|\||\\n)\s*)?git(?:\s+-[Cc]\s*\S+)*\s+(commit|push)\b'
    min: 0
    max: 0
    arm: both

  - name: stopped-and-nothing-committed
    type: llm
    focus: last_message
    criteria: |
      The first line begins with `⚠ Stopped:` and says nothing was
      committed. The reply says the repository's check failed on the
      refreshed lock, does not report the refresh as committed, and has no
      `✓` hero. The reply says nothing about what the agent will itself do
      later.
