[project]
name = "skills"
version = "0.1.0"
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.93",
    "pytest>=9.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.15",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py315"
# User projects receive the templates; their style is the user's, not ours.
extend-exclude = [".agents", "plugins/pytest-optimizer/templates"]
# Plugin code runs under the user's python3, not this project's interpreter.
per-file-target-version = { "plugins/**/*.py" = "py314", "shared/*.py" = "py314" }

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # conflicts with ruff formatter
    "T201",     # allow print() in CLI scripts
    "S311",     # allow random for non-crypto
    "FBT001",   # allow boolean positional args
    "FBT002",   # allow boolean defaults
    "SIM108",   # allow ternary when readable
    "C901",     # allow complex main() in CLI scripts
    "PLR0912",  # allow many branches in main()
    "CPY001",   # licence lives in LICENSE, not a per-file header
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.src]
include = ["scripts", "plugins", "shared"]
exclude = ["plugins/pytest-optimizer/templates"]

[tool.ty.environment]
# Scripts import their siblings as top-level modules, as `python3 <script>` does.
extra-paths = ["scripts", "plugins/goal-planner/evals"]

[tool.ty.rules]
all = "error"
# `if value:` treats an empty string like None on purpose throughout these CLIs.
truthiness-test-of-none-union = "ignore"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore-glob=plugins/*/scripts/closest_model.py"
markers = ["integration: owned Git repositories and CLI subprocess workflows (outer loop)"]
testpaths = [
    "plugins/action/scripts",
    "plugins/agent-messaging/scripts",
    "plugins/business/scripts",
    "plugins/changelog/scripts",
    "plugins/commit/scripts",
    "plugins/disk/scripts",
    "plugins/gh/scripts",
    "plugins/github-actions/scripts",
    "plugins/git-branch/scripts",
    "plugins/goal-planner/scripts",
    "plugins/goal-planner/evals",
    "plugins/lean/scripts",
    "plugins/merge-pr/scripts",
    "plugins/model-cli/scripts",
    "plugins/package-updater/scripts",
    "plugins/pr/scripts",
    "plugins/pytest-optimizer/scripts",
    "plugins/rebase/scripts",
    "plugins/release/scripts",
    "plugins/repo-skills/scripts",
    "plugins/research/scripts",
    "plugins/respond/scripts",
    "plugins/ruff/scripts",
    "plugins/scholar/scripts",
    "plugins/self-improvement/scripts",
    "plugins/situate/scripts",
    "plugins/skill-style/scripts",
    "plugins/slop/scripts",
    "plugins/spike/scripts",
    "plugins/tailwind/scripts",
    "plugins/tdd/scripts",
    "plugins/terraform/scripts",
    "plugins/ticket/scripts",
    "plugins/weave/scripts",
    "scripts",
]
